# Netlify 静态站点（由 build_dashboard.py 生成 index.html 后部署）

[build]
  publish = "."
  command = "echo \"Skip Netlify build; deploy prebuilt dashboard/netlify/ folder\""

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
