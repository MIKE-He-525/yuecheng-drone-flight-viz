<!DOCTYPE html>
<html lang="zh-CN" data-theme="saas">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>空间地图 · 越城区无人机飞行服务</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; transition: background 0.35s, color 0.35s;
    }
    .layout {
      display: grid;
      grid-template-columns: 220px 1fr 300px;
      min-height: 100vh;
    }
    @media (max-width: 1100px) {
      .layout {
        grid-template-columns: 1fr;
        grid-template-rows: auto minmax(420px, 1fr) auto;
      }
    }

    .sidebar {
      background: var(--surface); border-right: 1px solid var(--border);
      padding: 12px; overflow-y: auto; max-height: 100vh;
      display: flex; flex-direction: column; gap: 10px;
    }
    @media (max-width: 1100px) {
      .sidebar { max-height: none; border-right: none; border-bottom: 1px solid var(--border); }
    }

    .track-rail {
      background: var(--surface);
      border-left: 1px solid var(--border);
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      height: 100vh;
      overflow: hidden;
    }
    .track-rail-filters {
      flex-shrink: 0;
      max-height: 46vh;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-gutter: stable;
    }
    .track-list-section {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .filter-status {
      font-size: 0.62rem;
      color: var(--muted);
      line-height: 1.4;
      padding: 6px 8px;
      background: var(--bg);
      border: 1px dashed var(--border);
      border-radius: var(--radius-sm);
    }
    .filter-status-chips {
      display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px;
    }
    .filter-chip {
      font-size: 0.6rem; padding: 2px 6px; border-radius: 999px;
      background: var(--accent-soft); color: var(--accent);
      border: 1px solid transparent;
    }
    .list-toolbar {
      display: flex; gap: 6px; align-items: center;
    }
    .list-toolbar input, .list-toolbar select {
      flex: 1; min-width: 0;
      border: 1px solid var(--border); background: var(--surface);
      color: var(--text); border-radius: var(--radius-sm);
      padding: 4px 6px; font-size: 0.65rem; font-family: inherit;
    }
    .list-toolbar select { flex: 0 0 auto; max-width: 88px; }
    .track-item.dimmed { opacity: 0.45; }
    .track-actions { display: flex; gap: 4px; margin-top: 4px; }
    .track-actions .filter-btn { flex: 1; text-align: center; }
    @media (max-width: 1100px) {
      .track-rail {
        height: auto;
        max-height: 320px;
        border-left: none;
        border-top: 1px solid var(--border);
      }
    }
    .track-rail-header h2 {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--heading);
      line-height: 1.3;
    }
    .track-rail-header p {
      font-size: 0.68rem;
      color: var(--muted);
      margin-top: 2px;
    }
    #btn-solo-track, #btn-clear-selection { display: none; }
    #btn-solo-track.visible, #btn-clear-selection.visible { display: block; }

    .panel-filters h3 {
      display: flex; align-items: center; justify-content: space-between; gap: 6px;
    }
    .back-link {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 0.75rem; color: var(--accent); text-decoration: none; font-weight: 500;
    }
    .back-link:hover { text-decoration: underline; }
    .sidebar h1 { font-size: 1rem; font-weight: 700; color: var(--heading); line-height: 1.3; }
    .sidebar .sub { font-size: 0.72rem; color: var(--muted); }

    .theme-switcher { display: flex; flex-wrap: wrap; gap: 4px; }
    .theme-btn {
      border: 1px solid var(--border); background: var(--bg); color: var(--text);
      padding: 3px 7px; border-radius: var(--radius-sm); font-size: 0.65rem;
      cursor: pointer; transition: all 0.2s;
    }
    .theme-btn.active { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }

    .panel {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 10px;
    }
    .panel h3 { font-size: 0.78rem; font-weight: 600; color: var(--heading); margin-bottom: 8px; }

    .kpi-mini { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .kpi-mini div {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 6px 8px;
    }
    .kpi-mini .lbl { font-size: 0.65rem; color: var(--muted); }
    .kpi-mini .val { font-size: 0.95rem; font-weight: 700; color: var(--heading); }

    .layer-list { display: flex; flex-direction: column; gap: 6px; }
    .layer-list label {
      display: flex; align-items: center; gap: 8px;
      font-size: 0.75rem; cursor: pointer;
    }
    .layer-list input { accent-color: var(--accent); }

    .filter-row { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
    .filter-btn {
      border: 1px solid var(--border); background: var(--surface);
      color: var(--text); padding: 3px 8px; border-radius: 999px;
      font-size: 0.68rem; cursor: pointer;
    }
    .filter-btn.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

    .filter-section { margin-top: 8px; }
    .filter-section:first-child { margin-top: 0; }
    .filter-label {
      font-size: 0.65rem; font-weight: 600; color: var(--muted);
      margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center;
    }
    .filter-count-badge { font-weight: 500; color: var(--accent); font-size: 0.62rem; }
    .range-values {
      font-weight: 500; color: var(--heading); font-size: 0.62rem; font-variant-numeric: tabular-nums;
    }
    .dual-range {
      position: relative; height: 28px; margin-top: 4px;
    }
    .range-track {
      position: absolute; left: 7px; right: 7px; top: 50%;
      transform: translateY(-50%);
      height: 4px; background: var(--border); border-radius: 999px;
      pointer-events: none; overflow: hidden;
    }
    .range-fill {
      position: absolute; left: 0; top: 0; height: 100%; width: 100%;
      background: var(--accent); border-radius: 999px; opacity: 0.5;
    }
    .dual-range input[type="range"] {
      position: absolute; left: 0; right: 0; top: 0;
      width: 100%; height: 28px; margin: 0;
      background: transparent; pointer-events: none;
      -webkit-appearance: none; appearance: none;
    }
    .dual-range input[type="range"].range-min { z-index: 3; }
    .dual-range input[type="range"].range-max { z-index: 4; }
    .dual-range input[type="range"]::-webkit-slider-runnable-track {
      height: 4px; background: transparent; border: none;
    }
    .dual-range input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; pointer-events: auto;
      width: 14px; height: 14px; border-radius: 50%;
      background: var(--accent); border: 2px solid var(--surface);
      box-shadow: 0 1px 4px rgba(0,0,0,0.15);
      margin-top: -5px; cursor: grab;
    }
    .dual-range input[type="range"]::-moz-range-track {
      height: 4px; background: transparent; border: none;
    }
    .dual-range input[type="range"]::-moz-range-thumb {
      pointer-events: auto;
      width: 14px; height: 14px; border-radius: 50%;
      background: var(--accent); border: 2px solid var(--surface);
      box-shadow: 0 1px 4px rgba(0,0,0,0.15);
      cursor: grab;
    }
    .filter-actions { display: flex; gap: 6px; margin-top: 10px; }
    .filter-actions button {
      flex: 1; border: 1px solid var(--border); background: var(--surface);
      color: var(--text); padding: 5px 8px; border-radius: var(--radius-sm);
      font-size: 0.65rem; cursor: pointer;
    }
    .filter-actions button.primary {
      background: var(--accent-soft); border-color: var(--accent); color: var(--accent);
    }
    .track-item.hidden { display: none; }

    .panel-tracks {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 0;
      border: none;
      background: transparent;
    }

    .track-list {
      flex: 1;
      min-height: 0;
      overflow-x: hidden;
      overflow-y: auto;
      scrollbar-gutter: stable;
      font-size: 0.68rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
    }
    .track-item {
      padding: 6px 10px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.15s;
      line-height: 1.35;
    }
    .track-item-title {
      display: block;
      color: var(--heading);
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .track-item-meta {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 0.65rem;
    }
    .track-item:hover, .track-item.active { background: var(--accent-soft); }
    .track-item:last-child { border-bottom: none; }

    .chart-mini { height: 110px; position: relative; }

    .map-wrap { position: relative; min-height: 400px; height: 100vh; }
    @media (max-width: 1100px) { .map-wrap { height: 100%; min-height: 420px; } }
    #map { width: 100%; height: 100%; z-index: 0; }

    .map-legend {
      position: absolute; bottom: 24px; left: 12px; z-index: 1000;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 8px 10px;
      font-size: 0.68rem; box-shadow: var(--shadow);
    }
    .map-legend div { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
    .map-legend div:first-child { margin-top: 0; }
    .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .line-sample { width: 18px; height: 3px; border-radius: 2px; flex-shrink: 0; }

    [data-theme="claude"] {
      --bg: #F4F1EA; --surface: #FAF9F5; --heading: #191919; --text: #191919;
      --muted: #B1ADA1; --border: #E0DDD4; --accent: #C15F3C; --accent-text: #FAF9F5;
      --accent-soft: rgba(193, 95, 60, 0.12); --shadow: 0 2px 12px rgba(25,25,25,0.06);
      --radius: 10px; --radius-sm: 8px;
    }
    [data-theme="material"] {
      --bg: #F8F9FA; --surface: #FFFFFF; --heading: #202124; --text: #202124;
      --muted: #5F6368; --border: #E8EAED; --accent: #1A73E8; --accent-text: #FFFFFF;
      --accent-soft: rgba(26,115,232,0.10); --shadow: 0 2px 12px rgba(26,115,232,0.08);
      --radius: 16px; --radius-sm: 12px;
    }
    [data-theme="vercel"] {
      --bg: #FFFFFF; --surface: #FAFAFA; --heading: #171717; --text: #171717;
      --muted: #666; --border: #EBEBEB; --accent: #171717; --accent-text: #FFFFFF;
      --accent-soft: #F5F5F5; --shadow: none; --radius: 6px; --radius-sm: 4px;
    }
    [data-theme="linear"] {
      --bg: #121316; --surface: #1C1D20; --heading: #F4F5F8; --text: #E8E9ED;
      --muted: #8A8F98; --border: rgba(255,255,255,0.06); --accent: #5E6AD2; --accent-text: #FFF;
      --accent-soft: rgba(94,106,210,0.15); --shadow: 0 4px 24px rgba(0,0,0,0.4);
      --radius: 12px; --radius-sm: 8px;
    }
    [data-theme="saas"] {
      --bg: #F5F7FA; --surface: #FFFFFF; --heading: #1D2129; --text: #4E5969;
      --muted: #86909C; --border: #E5E6EB; --accent: #165DFF; --accent-text: #FFFFFF;
      --accent-soft: rgba(22,93,255,0.08); --shadow: 0 2px 8px rgba(0,0,0,0.06);
      --radius: 10px; --radius-sm: 8px;
    }

    .leaflet-popup-content { font-size: 0.78rem; line-height: 1.45; margin: 10px 12px; }
    .leaflet-popup-content b { color: #1D2129; }
    [data-theme="linear"] .leaflet-popup-content b { color: #F4F5F8; }
    .leaflet-container { background: #E8E8E8; }
    [data-theme="linear"] .leaflet-container { background: #1A1B1E; }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <a class="back-link" href="index.html">← 返回总览看板</a>
      <div>
        <h1>空间地图可视化</h1>
        <p class="sub" id="meta-range">加载中…</p>
      </div>

      <div class="theme-switcher">
        <button class="theme-btn" data-theme="claude">Claude</button>
        <button class="theme-btn" data-theme="material">Material</button>
        <button class="theme-btn" data-theme="vercel">Vercel</button>
        <button class="theme-btn" data-theme="linear">Linear</button>
        <button class="theme-btn active" data-theme="saas">SaaS</button>
      </div>

      <div class="panel">
        <h3>空间数据概览</h3>
        <div class="kpi-mini" id="kpi-mini"></div>
      </div>

      <div class="panel">
        <h3>图层控制</h3>
        <div class="layer-list">
          <label><input type="checkbox" id="layer-airports" checked /> 机场点位（全部）</label>
          <label><input type="checkbox" id="layer-coverage" checked /> 机场覆盖半径</label>
          <label><input type="checkbox" id="layer-tracks" checked /> 飞行轨迹</label>
          <label><input type="checkbox" id="layer-district" checked /> 显示越城区行政区划</label>
          <label><input type="checkbox" id="layer-region-only" /> 仅显示行政区内轨迹</label>
        </div>
        <button type="button" class="filter-btn" id="btn-reset-view" style="margin-top:8px;width:100%;">重置默认视野</button>
      </div>
    </aside>

    <main class="map-wrap">
      <div id="map"></div>
      <div class="map-legend">
        <strong style="font-size:0.72rem;color:var(--heading)">图例</strong>
        <div><span class="dot" style="background:#E74C3C"></span>大疆机场/轨迹</div>
        <div><span class="dot" style="background:#3498DB"></span>一电机场/轨迹</div>
        <div><span class="dot" style="background:#2ECC71"></span>纵横机场/轨迹</div>
        <div><span class="line-sample" style="background:transparent;border:2px solid #E67E22;height:0"></span>越城区行政区划</div>
        <div><span class="line-sample" style="background:#95A5A6"></span>无记录关联轨迹</div>
      </div>
    </main>

    <aside class="track-rail">
      <div class="track-rail-filters">
        <div class="panel panel-filters">
          <h3>轨迹筛选 <span class="filter-count-badge" id="filter-count-badge">—</span></h3>

          <div class="filter-section">
            <div class="filter-label">厂商</div>
            <div class="filter-row" id="factory-filters"></div>
          </div>

          <div class="filter-section">
            <div class="filter-label">任务类型</div>
            <div class="filter-row" id="flytype-filters"></div>
          </div>

          <div class="filter-section">
            <div class="filter-label">
              <span>飞行时长（分钟）</span>
              <span class="range-values" id="filter-duration-values">—</span>
            </div>
            <div class="dual-range">
              <div class="range-track"><div class="range-fill" id="filter-duration-fill"></div></div>
              <input type="range" id="filter-duration-min" class="range-min" />
              <input type="range" id="filter-duration-max" class="range-max" />
            </div>
          </div>

          <div class="filter-section">
            <div class="filter-label">
              <span>飞行距离（km）</span>
              <span class="range-values" id="filter-distance-values">—</span>
            </div>
            <div class="dual-range">
              <div class="range-track"><div class="range-fill" id="filter-distance-fill"></div></div>
              <input type="range" id="filter-distance-min" class="range-min" />
              <input type="range" id="filter-distance-max" class="range-max" />
            </div>
          </div>

          <div class="filter-section">
            <div class="filter-label">
              <span>飞行轨迹最大高度（m）</span>
              <span class="range-values" id="filter-height-values">—</span>
            </div>
            <div class="dual-range">
              <div class="range-track"><div class="range-fill" id="filter-height-fill"></div></div>
              <input type="range" id="filter-height-min" class="range-min" />
              <input type="range" id="filter-height-max" class="range-max" />
            </div>
          </div>

          <div class="filter-section">
            <div class="filter-label">
              <span>飞行最大速度（km/h）</span>
              <span class="range-values" id="filter-speed-values">—</span>
            </div>
            <div class="dual-range">
              <div class="range-track"><div class="range-fill" id="filter-speed-fill"></div></div>
              <input type="range" id="filter-speed-min" class="range-min" />
              <input type="range" id="filter-speed-max" class="range-max" />
            </div>
          </div>

          <div class="filter-actions">
            <button type="button" id="btn-reset-filters" class="primary">重置筛选</button>
          </div>
        </div>
      </div>

      <div class="filter-status" id="filter-status">
        <span id="filter-status-text">调整筛选条件以缩小结果集</span>
        <div class="filter-status-chips" id="filter-status-chips"></div>
      </div>

      <div class="track-list-section">
        <div class="track-rail-header">
          <h2>筛选结果 <span class="filter-count-badge" id="list-count-badge">—</span></h2>
          <p id="track-list-meta">点击定位 · 高亮显示</p>
          <div class="track-actions">
            <button type="button" class="filter-btn" id="btn-solo-track">仅看此条</button>
            <button type="button" class="filter-btn" id="btn-clear-selection">取消选中</button>
          </div>
        </div>
        <div class="list-toolbar">
          <input type="search" id="track-search" placeholder="搜索 ID / 任务名" />
          <select id="track-sort" title="排序">
            <option value="points">点数</option>
            <option value="duration">时长</option>
            <option value="distance">距离</option>
          </select>
        </div>
        <div class="track-list" id="track-list"></div>
      </div>
    </aside>
  </div>

  <script>
    const FACTORY_COLORS = { "大疆": "#E74C3C", "DJ": "#E74C3C", "一电": "#3498DB", "YD": "#3498DB", "纵横": "#2ECC71", "ZH": "#2ECC71", "未知": "#95A5A6" };
    const FACTORY_CODES = { "大疆": "DJ", "一电": "YD", "纵横": "ZH" };

    let MAP_DATA = null;
    let map = null;
    let basemapLayer = null;
    let airportLayer = null;
    let coverageLayer = null;
    let trackLayer = null;
    let districtLayer = null;
    let trackPolylines = new Map();
    let selectedTrackId = null;
    let soloTrackMode = false;
    let trackSearchQuery = "";
    let trackSortKey = "points";
    let filterBounds = null;
    let rangeFiltersBound = false;
    let trackFilters = {
      factory: "all",
      flyType: "all",
      durationMin: null,
      durationMax: null,
      distanceMin: null,
      distanceMax: null,
      heightMin: null,
      heightMax: null,
      speedMin: null,
      speedMax: null,
    };

    const BASEMAPS = {
      light: {
        url: "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
      },
      dark: {
        url: "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
      },
    };

    function applyBasemap(theme) {
      if (!map) return;
      const cfg = theme === "linear" ? BASEMAPS.dark : BASEMAPS.light;
      if (basemapLayer) map.removeLayer(basemapLayer);
      basemapLayer = L.tileLayer(cfg.url, {
        maxZoom: 20,
        subdomains: "abcd",
        attribution: cfg.attribution,
      }).addTo(map);
    }

    function factoryColor(item) {
      return FACTORY_COLORS[item.factory] || FACTORY_COLORS[item.factory_code] || FACTORY_COLORS["未知"];
    }

    function css(name) {
      return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    }

    function renderKPIs() {
      const k = MAP_DATA.kpis;
      const adminPct = k.telemetry_in_district_pct != null
        ? k.telemetry_in_district_pct
        : (k.telemetry_points ? Math.round((k.telemetry_in_district || 0) / k.telemetry_points * 1000) / 10 : 0);
      document.getElementById("kpi-mini").innerHTML = `
        <div><div class="lbl">机场</div><div class="val">${k.airports}</div></div>
        <div><div class="lbl">轨迹</div><div class="val">${k.tracks}</div></div>
        <div><div class="lbl">遥测点</div><div class="val">${k.telemetry_points.toLocaleString()}</div></div>
        <div><div class="lbl">行政内</div><div class="val">${adminPct}%</div></div>
        <div><div class="lbl">飞行记录</div><div class="val">${k.flights_total.toLocaleString()}</div></div>
        <div><div class="lbl">预定义航线</div><div class="val">${k.routes}</div></div>
      `;
    }

    function renderFactoryFilters() {
      initTrackFilters();
    }

    function chipFilters(containerId, options, activeKey, datasetKey, onSelect) {
      const wrap = document.getElementById(containerId);
      if (!wrap) return;
      wrap.innerHTML =
        `<button class="filter-btn active" data-${datasetKey}="all">全部</button>` +
        options.map(v => `<button class="filter-btn" data-${datasetKey}="${v}">${v}</button>`).join("");
      wrap.querySelectorAll(".filter-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          wrap.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          onSelect(btn.dataset[datasetKey]);
        });
      });
    }

    function formatRangeVal(v, decimals) {
      return decimals > 0 ? Number(v).toFixed(decimals) : String(Math.round(Number(v)));
    }

    function updateRangeLabel(labelId, minV, maxV, decimals) {
      const el = document.getElementById(labelId);
      if (el) el.textContent = `${formatRangeVal(minV, decimals)} – ${formatRangeVal(maxV, decimals)}`;
    }

    function updateRangeFill(minId, maxId, fillId) {
      const minEl = document.getElementById(minId);
      const maxEl = document.getElementById(maxId);
      const fill = document.getElementById(fillId);
      if (!minEl || !maxEl || !fill) return;
      const lo = Number(minEl.min);
      const hi = Number(minEl.max);
      const minV = Number(minEl.value);
      const maxV = Number(maxEl.value);
      const span = hi - lo || 1;
      fill.style.left = ((minV - lo) / span * 100) + "%";
      fill.style.width = ((maxV - minV) / span * 100) + "%";
    }

    function configureRangeSlider(minId, maxId, labelId, fillId, bounds, step, decimals) {
      const minEl = document.getElementById(minId);
      const maxEl = document.getElementById(maxId);
      if (!minEl || !maxEl) return;
      minEl.min = maxEl.min = String(bounds.min);
      minEl.max = maxEl.max = String(bounds.max);
      minEl.step = maxEl.step = String(step);
      minEl.value = String(bounds.min);
      maxEl.value = String(bounds.max);
      updateRangeLabel(labelId, bounds.min, bounds.max, decimals);
      updateRangeFill(minId, maxId, fillId);
    }

    function readRangeSlider(minId, maxId) {
      const minEl = document.getElementById(minId);
      const maxEl = document.getElementById(maxId);
      return { min: Number(minEl.value), max: Number(maxEl.value) };
    }

    function bindRangeFilterInputs() {
      if (rangeFiltersBound) return;
      rangeFiltersBound = true;
      const specs = [
        ["filter-duration-min", "filter-duration-max", "filter-duration-values", "filter-duration-fill", 0],
        ["filter-distance-min", "filter-distance-max", "filter-distance-values", "filter-distance-fill", 1],
        ["filter-height-min", "filter-height-max", "filter-height-values", "filter-height-fill", 0],
        ["filter-speed-min", "filter-speed-max", "filter-speed-values", "filter-speed-fill", 0],
      ];
      specs.forEach(([minId, maxId, labelId, fillId, decimals]) => {
        const minEl = document.getElementById(minId);
        const maxEl = document.getElementById(maxId);
        if (!minEl || !maxEl) return;
        const onSlide = (changed) => {
          let minV = Number(minEl.value);
          let maxV = Number(maxEl.value);
          if (minV > maxV) {
            if (changed === "min") maxEl.value = String(minV);
            else minEl.value = String(maxV);
            minV = Number(minEl.value);
            maxV = Number(maxEl.value);
          }
          updateRangeLabel(labelId, minV, maxV, decimals);
          updateRangeFill(minId, maxId, fillId);
          applyTrackFilters();
        };
        minEl.addEventListener("input", () => onSlide("min"));
        maxEl.addEventListener("input", () => onSlide("max"));
      });
    }

    function initTrackFilters() {
      filterBounds = MAP_DATA.meta.filter_bounds;
      if (!filterBounds) return;

      chipFilters("factory-filters", filterBounds.factories || [], trackFilters.factory, "f", v => {
        trackFilters.factory = v;
        applyTrackFilters();
      });
      chipFilters("flytype-filters", filterBounds.fly_types || [], trackFilters.flyType, "t", v => {
        trackFilters.flyType = v;
        applyTrackFilters();
      });

      const b = filterBounds;
      configureRangeSlider("filter-duration-min", "filter-duration-max", "filter-duration-values", "filter-duration-fill", b.duration_min, 0.1, 1);
      configureRangeSlider("filter-distance-min", "filter-distance-max", "filter-distance-values", "filter-distance-fill", b.distance_km, 0.1, 1);
      configureRangeSlider("filter-height-min", "filter-height-max", "filter-height-values", "filter-height-fill", b.height_m, 1, 0);
      configureRangeSlider("filter-speed-min", "filter-speed-max", "filter-speed-values", "filter-speed-fill", b.speed_kmh, 1, 0);
      bindRangeFilterInputs();

      syncFilterStateFromInputs();
      updateFilterCountBadge();
    }

    function syncFilterStateFromInputs() {
      const dur = readRangeSlider("filter-duration-min", "filter-duration-max");
      const dist = readRangeSlider("filter-distance-min", "filter-distance-max");
      const h = readRangeSlider("filter-height-min", "filter-height-max");
      const spd = readRangeSlider("filter-speed-min", "filter-speed-max");
      trackFilters.durationMin = dur.min;
      trackFilters.durationMax = dur.max;
      trackFilters.distanceMin = dist.min;
      trackFilters.distanceMax = dist.max;
      trackFilters.heightMin = h.min;
      trackFilters.heightMax = h.max;
      trackFilters.speedMin = spd.min;
      trackFilters.speedMax = spd.max;
    }

    function resetTrackFilters() {
      if (!filterBounds) return;
      trackFilters.factory = "all";
      trackFilters.flyType = "all";
      document.querySelectorAll("#factory-filters .filter-btn").forEach(b => {
        b.classList.toggle("active", b.dataset.f === "all");
      });
      document.querySelectorAll("#flytype-filters .filter-btn").forEach(b => {
        b.classList.toggle("active", b.dataset.t === "all");
      });

      const b = filterBounds;
      configureRangeSlider("filter-duration-min", "filter-duration-max", "filter-duration-values", "filter-duration-fill", b.duration_min, 0.1, 1);
      configureRangeSlider("filter-distance-min", "filter-distance-max", "filter-distance-values", "filter-distance-fill", b.distance_km, 0.1, 1);
      configureRangeSlider("filter-height-min", "filter-height-max", "filter-height-values", "filter-height-fill", b.height_m, 1, 0);
      configureRangeSlider("filter-speed-min", "filter-speed-max", "filter-speed-values", "filter-speed-fill", b.speed_kmh, 1, 0);
      syncFilterStateFromInputs();
      applyTrackFilters();
    }

    function applyTrackFilters() {
      syncFilterStateFromInputs();
      if (soloTrackMode) soloTrackMode = false;
      updateFilterCountBadge();
      updateFilterStatus();
      renderTrackList();
      refreshLayers();
    }

    function updateFilterStatus() {
      const chipsEl = document.getElementById("filter-status-chips");
      const textEl = document.getElementById("filter-status-text");
      if (!chipsEl || !textEl || !filterBounds) return;
      const chips = [];
      if (trackFilters.factory !== "all") chips.push(trackFilters.factory);
      if (trackFilters.flyType !== "all") chips.push(trackFilters.flyType);
      const b = filterBounds;
      if (trackFilters.durationMin > b.duration_min.min || trackFilters.durationMax < b.duration_min.max) {
        chips.push(`时长 ${formatRangeVal(trackFilters.durationMin, 0)}–${formatRangeVal(trackFilters.durationMax, 0)} 分`);
      }
      if (trackFilters.distanceMin > b.distance_km.min || trackFilters.distanceMax < b.distance_km.max) {
        chips.push(`距离 ${formatRangeVal(trackFilters.distanceMin, 1)}–${formatRangeVal(trackFilters.distanceMax, 1)} km`);
      }
      if (trackFilters.heightMin > b.height_m.min || trackFilters.heightMax < b.height_m.max) {
        chips.push(`高度 ${formatRangeVal(trackFilters.heightMin, 0)}–${formatRangeVal(trackFilters.heightMax, 0)} m`);
      }
      if (trackFilters.speedMin > b.speed_kmh.min || trackFilters.speedMax < b.speed_kmh.max) {
        chips.push(`速度 ${formatRangeVal(trackFilters.speedMin, 0)}–${formatRangeVal(trackFilters.speedMax, 0)} km/h`);
      }
      if (document.getElementById("layer-region-only")?.checked) chips.push("仅行政区内");
      const n = filteredTracks().length;
      textEl.textContent = chips.length ? `当前条件 · 共 ${n} 条轨迹` : `未限制维度 · 共 ${n} 条轨迹`;
      chipsEl.innerHTML = chips.map(c => `<span class="filter-chip">${c}</span>`).join("");
    }

    function updateFilterCountBadge() {
      const badge = document.getElementById("filter-count-badge");
      const listBadge = document.getElementById("list-count-badge");
      if (!MAP_DATA) return;
      const n = filteredTracks().length;
      const total = MAP_DATA.tracks.length;
      const label = `${n} / ${total}`;
      if (badge) badge.textContent = label;
      if (listBadge) listBadge.textContent = label;
    }

    function sortTracks(tracks) {
      const arr = [...tracks];
      if (trackSortKey === "duration") {
        arr.sort((a, b) => (b.duration_min || 0) - (a.duration_min || 0));
      } else if (trackSortKey === "distance") {
        arr.sort((a, b) => (b.distance_m || 0) - (a.distance_m || 0));
      } else {
        arr.sort((a, b) => b.point_count - a.point_count);
      }
      return arr;
    }

    function listTracksForDisplay() {
      let tracks = sortTracks(filteredTracks());
      if (trackSearchQuery.trim()) {
        const q = trackSearchQuery.trim().toLowerCase();
        tracks = tracks.filter(t =>
          String(t.id).includes(q) || (t.task_name || "").toLowerCase().includes(q),
        );
      }
      return tracks;
    }

    function shouldShowTrack(t) {
      if (!matchTrackFilters(t) || !matchRegion(t)) return false;
      if (soloTrackMode && selectedTrackId !== null) return t.id === selectedTrackId;
      return true;
    }

    function updateTrackListMeta() {
      const meta = document.getElementById("track-list-meta");
      const soloBtn = document.getElementById("btn-solo-track");
      const clearBtn = document.getElementById("btn-clear-selection");
      if (!meta) return;
      if (selectedTrackId !== null) {
        meta.textContent = soloTrackMode
          ? `仅显示 #${selectedTrackId}`
          : `已选中 #${selectedTrackId} · 地图高亮 · 其余半透明`;
        soloBtn?.classList.toggle("visible", !soloTrackMode);
        clearBtn?.classList.add("visible");
      } else {
        const shown = listTracksForDisplay().length;
        const total = filteredTracks().length;
        meta.textContent = shown === total
          ? `共 ${total} 条 · 点击列表项定位并高亮`
          : `显示 ${shown} / ${total} 条 · 点击定位并高亮`;
        soloBtn?.classList.remove("visible");
        clearBtn?.classList.remove("visible");
      }
    }

    function renderTrackList() {
      const list = document.getElementById("track-list");
      const tracks = listTracksForDisplay();
      updateTrackListMeta();
      if (!tracks.length) {
        list.innerHTML = `<div class="track-item" style="cursor:default;color:var(--muted)">无匹配轨迹，请放宽筛选或搜索条件</div>`;
        return;
      }
      list.innerHTML = tracks.map(t => {
        const title = `#${t.id} · ${t.point_count} 点${t.task_name ? " · " + t.task_name : ""}`;
        const parts = [
          t.factory || "未知",
          t.fly_type || "—",
          t.duration_min != null ? `${t.duration_min} 分钟` : null,
          t.distance_m != null ? `${(t.distance_m / 1000).toFixed(1)} km` : null,
        ].filter(Boolean);
        const meta = parts.join(" · ");
        const active = selectedTrackId === t.id ? " active" : "";
        return `<div class="track-item${active}" data-id="${t.id}">
          <span class="track-item-title">${title}</span>
          <span class="track-item-meta">${meta || t.start_time || "—"}</span>
        </div>`;
      }).join("");
      list.querySelectorAll(".track-item[data-id]").forEach(el => {
        el.addEventListener("click", () => focusTrack(Number(el.dataset.id)));
      });
    }

    function inNumericRange(value, min, max) {
      if (value == null || Number.isNaN(value)) return true;
      if (min != null && value < min) return false;
      if (max != null && value > max) return false;
      return true;
    }

    function matchTrackFilters(t) {
      if (trackFilters.factory !== "all" && t.factory !== trackFilters.factory) return false;
      if (trackFilters.flyType !== "all" && t.fly_type !== trackFilters.flyType) return false;
      if (!inNumericRange(t.duration_min, trackFilters.durationMin, trackFilters.durationMax)) return false;
      const distKm = t.distance_m != null ? t.distance_m / 1000 : null;
      if (!inNumericRange(distKm, trackFilters.distanceMin, trackFilters.distanceMax)) return false;
      if (!inNumericRange(t.max_height_m, trackFilters.heightMin, trackFilters.heightMax)) return false;
      if (!inNumericRange(t.max_speed_kmh, trackFilters.speedMin, trackFilters.speedMax)) return false;
      return true;
    }

    function filteredTracks() {
      return MAP_DATA.tracks.filter(t => matchTrackFilters(t) && matchRegion(t));
    }

    function airportPopup(a) {
      return `<b>${a.name}</b><br>
        厂商：${a.factory}<br>
        设备 SN：${a.device_sn}<br>
        坐标：${a.longitude}, ${a.latitude}<br>
        覆盖半径：${a.radius_m} m<br>
        ${a.height != null ? "海拔：" + a.height + " m<br>" : ""}
        关联飞行：${a.flight_count} 次<br>
        ${a.department ? "部门：" + a.department + "<br>" : ""}
        ${a.firmware_version ? "固件：" + a.firmware_version : ""}`;
    }

    function trackPopup(t) {
      return `<b>飞行 #${t.id}</b><br>
        类型：${t.fly_type}<br>
        ${t.task_name ? "任务：" + t.task_name + "<br>" : ""}
        厂商：${t.factory}<br>
        ${t.airport_name ? "起飞机场：" + t.airport_name + "<br>" : ""}
        遥测点：${t.point_count}（行政内 ${Math.round((t.in_district_ratio ?? 0) * 100)}%）<br>
        ${t.duration_min != null ? "时长：" + t.duration_min + " 分钟<br>" : ""}
        ${t.distance_m != null ? "距离：" + (t.distance_m / 1000).toFixed(2) + " km<br>" : ""}
        ${t.max_height_m != null ? "最大高度：" + t.max_height_m + " m<br>" : ""}
        ${t.max_speed_kmh != null ? "最大速度：" + t.max_speed_kmh + " km/h<br>" : ""}
        ${t.start_time ? "起飞：" + t.start_time + "<br>" : ""}
        ${!t.has_record ? "<span style='color:#E67E22'>⚠ 无飞行记录关联</span>" : ""}`;
    }

    function matchFactory(item) {
      if (trackFilters.factory === "all") return true;
      return item.factory === trackFilters.factory;
    }

    function matchRegion(t) {
      if (!document.getElementById("layer-region-only").checked) return true;
      return (t.in_district_ratio ?? 0) >= 0.5;
    }

    function fitDefaultView() {
      const view = MAP_DATA.meta.default_view || MAP_DATA.meta.bounds;
      const maxZoom = view.max_zoom || 12;
      map.fitBounds([view.southwest, view.northeast], { padding: [28, 28], maxZoom });
    }

    function initMap() {
      map = L.map("map", { zoomControl: true });
      applyBasemap(document.documentElement.dataset.theme);
      fitDefaultView();

      airportLayer = L.layerGroup().addTo(map);
      coverageLayer = L.layerGroup().addTo(map);
      trackLayer = L.layerGroup().addTo(map);
      districtLayer = L.layerGroup().addTo(map);
      refreshLayers();
      setTimeout(() => map.invalidateSize(), 0);
    }

    window.addEventListener("resize", () => { if (map) map.invalidateSize(); });

    function refreshDistrictLayer() {
      if (!districtLayer) return;
      districtLayer.clearLayers();
      if (!document.getElementById("layer-district")?.checked) return;
      const geo = MAP_DATA.meta.district_boundary;
      if (!geo) return;
      L.geoJSON(geo, {
        style: {
          color: "#E67E22",
          weight: 2,
          fillColor: "#E67E22",
          fillOpacity: 0.06,
        },
      }).bindPopup(
        `<b>${MAP_DATA.meta.district_name || "越城区"}</b><br>看板「行政内」KPI 按此行政区划面统计`,
      ).addTo(districtLayer);
    }

    function refreshLayers() {
      airportLayer.clearLayers();
      coverageLayer.clearLayers();
      trackLayer.clearLayers();
      trackPolylines.clear();

      const showAirports = document.getElementById("layer-airports").checked;
      const showCoverage = document.getElementById("layer-coverage").checked;
      const showTracks = document.getElementById("layer-tracks").checked;

      if (showAirports) {
        MAP_DATA.airports.forEach(a => {
          if (!matchFactory(a)) return;
          const color = factoryColor(a);
          L.circleMarker([a.latitude, a.longitude], {
            radius: 7, color: "#fff", weight: 1.5,
            fillColor: color, fillOpacity: 0.92,
          }).bindPopup(airportPopup(a)).addTo(airportLayer);
        });
      }

      if (showCoverage) {
        MAP_DATA.airports.forEach(a => {
          if (!matchFactory(a)) return;
          const color = factoryColor(a);
          L.circle([a.latitude, a.longitude], {
            radius: a.radius_m,
            color, weight: 1, fillColor: color, fillOpacity: 0.06,
            dashArray: "4 6",
          }).bindPopup(`<b>${a.name}</b><br>覆盖半径 ${(a.radius_m / 1000).toFixed(1)} km`).addTo(coverageLayer);
        });
      }

      if (showTracks) {
        MAP_DATA.tracks.forEach(t => {
          if (!shouldShowTrack(t)) return;
          const latlngs = t.coords.map(c => [c[1], c[0]]);
          const color = t.has_record ? factoryColor(t) : "#95A5A6";
          const isSelected = selectedTrackId === t.id;
          const dimOthers = selectedTrackId !== null && !soloTrackMode && !isSelected;
          const line = L.polyline(latlngs, {
            color,
            weight: isSelected ? 4 : 2,
            opacity: isSelected ? 1 : (dimOthers ? 0.22 : 0.75),
          }).bindPopup(trackPopup(t));
          line.addTo(trackLayer);
          trackPolylines.set(t.id, line);
          L.circleMarker(latlngs[0], {
            radius: isSelected ? 6 : 4,
            color: "#fff",
            weight: 1,
            fillColor: color,
            fillOpacity: dimOthers ? 0.35 : 1,
          }).addTo(trackLayer);
          if (latlngs.length > 1) {
            L.circleMarker(latlngs[latlngs.length - 1], {
              radius: isSelected ? 5 : 3,
              color: "#fff",
              weight: 1,
              fillColor: color,
              fillOpacity: dimOthers ? 0.3 : 0.85,
            }).addTo(trackLayer);
          }
        });
      }
      refreshDistrictLayer();
    }

    function clearTrackSelection() {
      selectedTrackId = null;
      soloTrackMode = false;
      refreshLayers();
      renderTrackList();
    }

    function focusTrack(id) {
      selectedTrackId = id;
      soloTrackMode = false;
      refreshLayers();
      renderTrackList();

      const line = trackPolylines.get(id);
      const t = MAP_DATA.tracks.find(x => x.id === id);
      if (line) {
        map.fitBounds(line.getBounds(), { padding: [40, 40], maxZoom: 15 });
        line.openPopup();
      } else if (t && t.coords.length) {
        map.setView([t.coords[0][1], t.coords[0][0]], 14);
      }
      const activeEl = document.querySelector(`.track-item[data-id="${id}"]`);
      activeEl?.scrollIntoView({ block: "nearest", behavior: "smooth" });
    }

    function enterSoloTrackMode() {
      if (selectedTrackId === null) return;
      soloTrackMode = true;
      refreshLayers();
      updateTrackListMeta();
    }

    function setTheme(name) {
      document.documentElement.dataset.theme = name;
      document.querySelectorAll(".theme-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.theme === name);
      });
      localStorage.setItem("dashboard-theme", name);
      applyBasemap(name);
    }

    document.querySelectorAll(".theme-btn").forEach(btn => {
      btn.addEventListener("click", () => setTheme(btn.dataset.theme));
    });

    ["layer-airports", "layer-coverage", "layer-tracks", "layer-district", "layer-region-only"].forEach(id => {
      document.getElementById(id).addEventListener("change", () => {
        updateFilterCountBadge();
        updateFilterStatus();
        renderTrackList();
        refreshLayers();
      });
    });
    document.getElementById("btn-reset-view").addEventListener("click", fitDefaultView);
    document.getElementById("btn-solo-track")?.addEventListener("click", enterSoloTrackMode);
    document.getElementById("btn-clear-selection")?.addEventListener("click", clearTrackSelection);
    document.getElementById("btn-reset-filters")?.addEventListener("click", resetTrackFilters);
    document.getElementById("track-search")?.addEventListener("input", e => {
      trackSearchQuery = e.target.value;
      renderTrackList();
    });
    document.getElementById("track-sort")?.addEventListener("change", e => {
      trackSortKey = e.target.value;
      renderTrackList();
    });

    const savedTheme = localStorage.getItem("dashboard-theme");
    if (savedTheme) setTheme(savedTheme);

    fetch("map_data.json")
      .then(r => {
        if (!r.ok) throw new Error("无法读取 map_data.json，请先运行 build_dashboard.py");
        return r.json();
      })
      .then(json => {
        if (!json) throw new Error("无可用地图数据");
        MAP_DATA = json;
        document.getElementById("meta-range").textContent =
          `时间范围：${json.meta.date_range.start} ~ ${json.meta.date_range.end}`;
        document.getElementById("meta-range").style.color = "";
        renderKPIs();
        renderFactoryFilters();
        updateFilterStatus();
        renderTrackList();
        if (typeof L === "undefined") {
          throw new Error("Leaflet 未加载，请检查网络");
        }
        initMap();
      })
      .catch(err => {
        document.getElementById("meta-range").textContent = "数据加载失败：" + err.message;
        document.getElementById("meta-range").style.color = "var(--negative, #F53F3F)";
        console.error(err);
      });
  </script>
</body>
</html>
