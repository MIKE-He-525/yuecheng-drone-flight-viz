                color: muted,
                font: { family: fontFamily, size: 9 },
              },
              grid: { color: grid },
            },
            y: {
              type: "linear",
              title: {
                display: true,
                text: yTitle,
                color: muted,
                font: { family: fontFamily, size: 10 },
              },
              ticks: { color: muted, font: { family: fontFamily, size: 9 }, maxTicksLimit: 6 },
              grid: { color: grid },
            },
          },
        },
      });
      if (!canvas.dataset.seriesLeaveBound) {
        canvas.dataset.seriesLeaveBound = "1";
        canvas.addEventListener("mouseleave", () => {
          if (!seriesPlay.playing && !seriesPlay.cursorVisible) clearSeriesPosMarker();
          else if (!seriesPlay.playing && seriesPlay.cursorVisible) refreshSeriesPlayCursor({ forceTip: true });
        });
      }
      bindTrackSeriesLegend(colors);
      updateSeriesPlayUi();
      openTrackSeriesDrawer({
        onOpened: () => {
          if (seriesChartTrack) seekSeriesPlayByTime(seriesPlay.tCursor || 0);
        },
      });
    }

    /**
     * 清除选中态并重置关联 UI（时序抽屉、3D 细管、详情卡、列表高亮）。
     * 副作用：hideTrackSeriesPanel、clearSelectedTrack3dGeometry、refreshLayers、renderTrackList。
     */
    function clearTrackSelection() {
      selectedTrackId = null;
      hoverTrackId = null;
      soloTrackMode = false;
      compareActive = false;
      compareTrackIds = [];
      comparePickMode = false;
      updateCompareActionButtons();
      const metricEl = document.getElementById("series-metric-toggles");
      if (metricEl) metricEl.hidden = true;
      hideTrackSeriesPanel();
      hideMap3dTrackInfo();
      clearSelectedTrack3dGeometry();
      if (in3dMode) syncMap3dOverlays();
      refreshLayers();
      renderTrackList();
      setTimeout(() => { if (map) map.invalidateSize(); }, 80);
    }

    function fitTrackIntoView(line) {
      if (!map || !line) return;
      map.invalidateSize({ animate: false });
      const bounds = line.getBounds();
      if (!bounds.isValid()) return;
      map.fitBounds(bounds, {
        paddingTopLeft: [56, 130],
        paddingBottomRight: [56, 72],
        maxZoom: 15,
        animate: true,
      });
    }

    function scheduleFitCompareTracks() {
      const run = () => {
        if (!map || !compareActive) return;
        const bounds = L.latLngBounds([]);
        let has = false;
        for (const id of compareTrackIds) {
          const entry = getTrackLineEntry(id);
          if (entry?.line) {
            const b = entry.line.getBounds();
            if (b.isValid()) {
              bounds.extend(b);
              has = true;
            }
          } else {
            const t = MAP_DATA?.tracks.find((x) => x.id === id);
            if (t?.coords?.length) {
              t.coords.forEach((c) => {
                bounds.extend([c[1], c[0]]);
                has = true;
              });
            }
          }
        }
        if (!has || !bounds.isValid()) return;
        map.invalidateSize({ animate: false });
        map.fitBounds(bounds, {
          paddingTopLeft: [56, 130],
          paddingBottomRight: [56, 72],
          maxZoom: 15,
          animate: true,
        });
      };
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          run();
          setTimeout(run, 280);
          setTimeout(run, 520);
        });
      });
    }

    function scheduleFitSelectedTrack(id) {
      if (compareActive) {
        scheduleFitCompareTracks();
        return;
      }
      const run = () => {
        if (!map || selectedTrackId !== id) return;
        const entry = getTrackLineEntry(id);
        const line = entry?.line;
        const t = MAP_DATA?.tracks.find(x => x.id === id);
        if (line) fitTrackIntoView(line);
        else if (t && t.coords.length) {
          map.invalidateSize({ animate: false });
          map.setView([t.coords[0][1], t.coords[0][0]], 14);
        }
      };
      // 等时序面板撑开与 smooth scroll 大致完成后适配（多拍校正）
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          run();
          setTimeout(run, 280);
          setTimeout(run, 520);
        });
      });
    }

    /**
     * 选中轨迹并联动列表、图层、时序图、详情卡与视野适配。
     * 口径：不自动 solo、不自动开 3D；3D 细管仅当 prefer3dView 已为真时 syncSelectedTrackTo3d。
     * 副作用：refreshLayers、renderTrackSeriesChart、showMap3dTrackInfo、scheduleFitSelectedTrack。
     */
    function focusTrack(id, opts = {}) {
      if (comparePickMode) {
        if (id === selectedTrackId) {
          cancelComparePick();
          return;
        }
        startCompare(id);
        return;
      }
      if (compareActive && !compareTrackIds.includes(id)) {
        exitCompare({ refresh: false });
      }
      selectedTrackId = id;
      hoverTrackId = null;
      refreshLayers();
      renderTrackList();

      const t = MAP_DATA.tracks.find(x => x.id === id);

      if (compareActive) {
        if (t) {
          renderCompareSeriesChart();
          showCompareTrackInfo(false);
        }
        document.getElementById("section-map")?.scrollIntoView({ block: "nearest", behavior: "smooth" });
        const activeEl = document.querySelector(`.track-item[data-id="${id}"]`);
        activeEl?.scrollIntoView({ block: "nearest", behavior: "smooth" });
        if (opts.fromCompareTable || opts.easeToFocus) {
          if (prefer3dView) syncSelectedTrackTo3d({ animateCamera: true, easeToFocus: true });
        } else if (prefer3dView) {
          syncSelectedTrackTo3d({ animateCamera: false });
        }
        return;
      }

      if (t) {
        const metricEl = document.getElementById("series-metric-toggles");
        if (metricEl) metricEl.hidden = true;
        renderTrackSeriesChart(t);
        showMap3dTrackInfo(t, false);
      } else {
        hideTrackSeriesPanel();
        hideMap3dTrackInfo();
      }
      document.getElementById("section-map")?.scrollIntoView({ block: "nearest", behavior: "smooth" });
      const activeEl = document.querySelector(`.track-item[data-id="${id}"]`);
      activeEl?.scrollIntoView({ block: "nearest", behavior: "smooth" });
      scheduleFitSelectedTrack(id);
      if (prefer3dView) syncSelectedTrackTo3d({ animateCamera: true });
      else clearSelectedTrack3dGeometry();
    }

    function enterSoloTrackMode() {
      if (selectedTrackId === null || compareActive) return;
      soloTrackMode = true;
      refreshLayers();
      updateTrackListMeta();
    }

    /* ========================================================================
     * UI 绑定与初始化（IntersectionObserver 惰性加载）
     * ======================================================================== */

    function bindMapUi() {
      ["layer-airports", "layer-coverage", "layer-tracks", "layer-district", "layer-region-only"].forEach(id => {
        document.getElementById(id)?.addEventListener("change", () => {
          updateFilterCountBadge();
          updateFilterStatus();
          renderTrackList();
          refreshLayers();
        });
      });
      document.getElementById("layer-buildings-3d")?.addEventListener("change", () => {
        syncMap3dBuildingsVisibility();
      });
      document.getElementById("layer-view-3d")?.addEventListener("change", (e) => {
        set3dViewEnabled(!!e.target.checked);
      });
      document.getElementById("layer-terrain")?.addEventListener("change", (e) => {
        setTerrainEnabled(!!e.target.checked);
      });
      document.getElementById("btn-reset-view")?.addEventListener("click", fitDefaultView);
      document.getElementById("btn-solo-track")?.addEventListener("click", enterSoloTrackMode);
      document.getElementById("btn-clear-selection")?.addEventListener("click", clearTrackSelection);
      document.getElementById("btn-add-compare")?.addEventListener("click", onAddCompareClick);
      document.getElementById("btn-exit-compare")?.addEventListener("click", () => {
        exitCompare({ refresh: true, animateCamera: true });
      });
      document.getElementById("series-metric-toggles")?.addEventListener("click", (e) => {
        const btn = e.target?.closest?.("[data-metric]");
        if (!btn) return;
        setCompareMetric(btn.dataset.metric);
      });
      document.getElementById("btn-show-series")?.addEventListener("click", () => reopenTrackSeriesPanel());
      document.getElementById("btn-toggle-series")?.addEventListener("click", () => toggleTrackSeriesDrawer());
      document.getElementById("btn-series-play")?.addEventListener("click", () => startSeriesPlay());
      document.getElementById("btn-series-pause")?.addEventListener("click", () => stopSeriesPlay());
      document.getElementById("series-play-rate")?.addEventListener("change", (e) => {
        seriesPlay.rate = Number(e.target.value) || 3;
      });
      document.getElementById("btn-reset-filters")?.addEventListener("click", resetTrackFilters);
      document.getElementById("track-search")?.addEventListener("input", e => {
        trackSearchQuery = e.target.value;
        renderTrackList();
      });
      document.getElementById("track-sort")?.addEventListener("change", e => {
        trackSortKey = e.target.value;
        renderTrackList();
      });
    }

    const savedTheme = localStorage.getItem("dashboard-theme");
    if (savedTheme) {
      document.documentElement.dataset.theme = savedTheme;
    }

    bindMapUi();
    // 独立页：直接 fetch map_data.json 并 initMap。
    // 嵌入 dashboard 时 build_dashboard.py 会去掉此 fetch，改由 IntersectionObserver（watchMapSection）惰性 bootMapSection。
    fetch("map_data.json")
      .then(r => {
        if (!r.ok) throw new Error("无法读取 map_data.json，请先运行 build_dashboard.py");
        return r.json();
      })
      .then(json => {
        if (!json) throw new Error("无可用地图数据");
        MAP_DATA = json;
        setMapStatus(
          `时间范围：${json.meta.date_range.start} ~ ${json.meta.date_range.end}`,
        );
        renderFactoryFilters();
        updateFilterStatus();
        renderTrackList();
        if (typeof L === "undefined") {
          throw new Error("Leaflet 未加载，请检查网络");
        }
        initMap();
      })
      .catch(err => {
        setMapStatus("数据加载失败：" + err.message, true);
        console.error(err);
      });
  </script>
</body>
