          built.path.forEach((c) => bounds.extend(c));
          has = true;
        }
        if (!has) return;
        const cam = {
          pitch: 60,
          bearing: -20,
          padding: { top: 72, bottom: 72, left: 56, right: 56 },
          maxZoom: 17,
          duration: animateCamera ? 800 : 0,
        };
        if (typeof map3d.fitBounds === "function") map3d.fitBounds(bounds, cam);
        else map3d.easeTo({ center: bounds.getCenter(), pitch: 60, bearing: -20, duration: animateCamera ? 800 : 0 });
        return;
      }
      if (!track) return;
      map3dTrackId = track.id;
      map3d.resize();
      const built = updateMap3dGeometry(track);
      if (!built?.path?.length) return;
      const bounds = new maplibregl.LngLatBounds();
      built.path.forEach((c) => bounds.extend(c));
      const cam = {
        pitch: 60,
        bearing: -20,
        padding: { top: 72, bottom: 72, left: 56, right: 56 },
        // 允许拉近到可看清建筑；长轨仍会被 fitBounds 压低缩放
        maxZoom: 17,
        duration: animateCamera ? 800 : 0,
      };
      if (typeof map3d.fitBounds === "function") {
        map3d.fitBounds(bounds, cam);
      } else {
        map3d.easeTo({
          center: bounds.getCenter(),
          pitch: 60,
          bearing: -20,
          duration: animateCamera ? 800 : 0,
        });
      }
    }

    function clearSelectedTrack3dGeometry() {
      map3dPendingTrack = null;
      map3dTrackId = null;
      clearMap3dPopup();
      clearSeriesPos3dMarker();
      if (map3d && map3dReady) {
        selectedTrack3dLineLayer?.clearTrack?.();
        if (selectedTrack3dLineLayer) {
          selectedTrack3dLineLayer.visible = false;
          map3d.triggerRepaint();
        }
      }
    }

    /** 若当前为 3D 且有选中轨，刷新立体航迹；无选中则清空细管。不改变 3D/地形开关。 */
    function syncSelectedTrackTo3d(opts = {}) {
      if (!prefer3dView || !in3dMode) return;
      if (compareActive) {
        const tracks = getCompareTracks();
        const focus = tracks.find((t) => t.id === selectedTrackId) || tracks[0] || null;
        if (!focus) {
          clearSelectedTrack3dGeometry();
          syncMap3dOverlays();
          return;
        }
        const m = ensureMap3d();
        if (!m) return;
        if (!map3dReady) {
          map3dPendingTrack = focus;
          showCompareTrackInfo(false);
          return;
        }
        if (opts.easeToFocus && focus) {
          map3dTrackId = focus.id;
          const built = updateMap3dGeometry(focus);
          if (built?.path?.length && opts.animateCamera !== false) {
            const bounds = new maplibregl.LngLatBounds();
            built.path.forEach((c) => bounds.extend(c));
            map3d.fitBounds(bounds, {
              pitch: 60,
              bearing: -20,
              padding: { top: 72, bottom: 72, left: 56, right: 56 },
              maxZoom: 17,
              duration: 600,
            });
          } else if (opts.animateCamera !== false) {
            applyTrack3dView(focus, true);
          } else {
            updateMap3dGeometry(focus);
          }
        } else {
          applyTrack3dView(focus, opts.animateCamera !== false);
        }
        syncMap3dOverlays();
        showCompareTrackInfo(false);
        return;
      }
      const t = selectedTrackId != null
        ? MAP_DATA?.tracks?.find((x) => x.id === selectedTrackId)
        : null;
      if (!t) {
        clearSelectedTrack3dGeometry();
        syncMap3dOverlays();
        return;
      }
      const m = ensureMap3d();
      if (!m) return;
      if (!map3dReady) {
        map3dPendingTrack = t;
        showMap3dTrackInfo(t, false);
        return;
      }
      applyTrack3dView(t, opts.animateCamera !== false);
      syncMap3dOverlays();
      showMap3dTrackInfo(t, false);
    }

    function applyTerrainPreference() {
      if (!map3d || !map3dReady) return;
      ensureMap3dTerrain();
      if (compareActive && in3dMode) {
        const focus = getCompareTracks().find((t) => t.id === selectedTrackId) || getCompareTracks()[0];
        if (focus) updateMap3dGeometry(focus);
        return;
      }
      if (selectedTrackId != null && in3dMode) {
        const t = MAP_DATA?.tracks?.find((x) => x.id === selectedTrackId);
        if (t) updateMap3dGeometry(t);
      }
    }

    function enter3dView() {
      const wrap = document.querySelector(".map-wrap");
      wrap?.classList.add("is-3d");
      in3dMode = true;
      const m = ensureMap3d();
      if (!m) {
        wrap?.classList.remove("is-3d");
        in3dMode = false;
        prefer3dView = false;
        const cb = document.getElementById("layer-view-3d");
        if (cb) cb.checked = false;
        return;
      }
      const afterReady = () => {
        applyTerrainPreference();
        ensureMap3dBuildings();
        syncMap3dOverlays();
        syncSelectedTrackTo3d({ animateCamera: true });
        requestAnimationFrame(() => map3d?.resize());
      };
      if (!map3dReady) {
        map3d.once("load", afterReady);
        requestAnimationFrame(() => map3d?.resize());
        return;
      }
      afterReady();
    }

    function exit3dView() {
      const wrap = document.querySelector(".map-wrap");
      const hint = document.getElementById("map3d-hint");
      if (hint) {
        hint.hidden = true;
        hint.textContent = "";
      }
      clearSelectedTrack3dGeometry();
      if (!in3dMode && !wrap?.classList.contains("is-3d")) return;
      in3dMode = false;
      if (map3d && map3dReady) {
        map3d.easeTo({ pitch: 0, bearing: 0, duration: 450 });
        setTimeout(() => {
          wrap?.classList.remove("is-3d");
          if (map) map.invalidateSize();
        }, 380);
      } else {
        wrap?.classList.remove("is-3d");
        if (map) map.invalidateSize();
      }
    }

    function set3dViewEnabled(on) {
      prefer3dView = !!on;
      const cb = document.getElementById("layer-view-3d");
      if (cb) cb.checked = prefer3dView;
      if (prefer3dView) enter3dView();
      else exit3dView();
    }

    function setTerrainEnabled(on) {
      preferTerrain = !!on;
      const cb = document.getElementById("layer-terrain");
      if (cb) cb.checked = preferTerrain;
      if (in3dMode && map3dReady) applyTerrainPreference();
    }

    function enterTrack3d(track) {
      // 兼容旧调用：仅在全局已开 3D 时同步几何
      if (!prefer3dView || !track) return;
      syncSelectedTrackTo3d({ animateCamera: true });
    }

    function exitTrack3d() {
      // 兼容旧调用：只清选中几何，不关全局 3D
      clearSelectedTrack3dGeometry();
      if (in3dMode) syncMap3dOverlays();
    }

    function factoryColor(item) {
      return FACTORY_COLORS[item.factory] || FACTORY_COLORS[item.factory_code] || FACTORY_COLORS["未知"];
    }

    function compareTrackColor(id) {
      const ids = compareTrackIds;
      const idx = ids.indexOf(id);
      if (idx >= 0) return COMPARE_PALETTE[idx % COMPARE_PALETTE.length];
      const t = MAP_DATA?.tracks?.find((x) => x.id === id);
      return t ? factoryColor(t) : COMPARE_PALETTE[0];
    }

    function isCompareHighlighted(id) {
      if (compareActive) return compareTrackIds.includes(id);
      return false;
    }

    function getCompareTracks() {
      if (!MAP_DATA?.tracks || !compareTrackIds.length) return [];
      return compareTrackIds
        .map((id) => MAP_DATA.tracks.find((x) => x.id === id))
        .filter(Boolean);
    }

    function updateCompareActionButtons() {
      const addBtn = document.getElementById("btn-add-compare");
      const exitBtn = document.getElementById("btn-exit-compare");
      const showAdd = selectedTrackId != null || compareActive || comparePickMode;
      if (addBtn) {
        addBtn.classList.toggle("visible", showAdd);
        addBtn.classList.toggle("pick-active", comparePickMode);
        if (compareActive) {
          addBtn.textContent = "换对比轨";
          addBtn.title = "保留当前对比中的第一条，再点另一条替换对比对象";
          addBtn.disabled = false;
        } else if (comparePickMode) {
          addBtn.textContent = "取消选择";
          addBtn.title = "取消待选对比轨";
          addBtn.disabled = false;
        } else {
          addBtn.textContent = "加入对比";
          addBtn.title = selectedTrackId != null
            ? "再点另一条轨迹进行对比"
            : "请先选中一条轨迹";
          addBtn.disabled = selectedTrackId == null;
        }
      }
      exitBtn?.classList.toggle("visible", compareActive);
    }

    function cancelComparePick() {
      if (!comparePickMode) return;
      comparePickMode = false;
      updateCompareActionButtons();
      renderTrackList();
    }

    /** 进入待选对比轨：对比中则为「换对比轨」（保留主焦点）。 */
    function beginComparePick() {
      if (selectedTrackId == null && !compareActive) return;
      if (compareActive) {
        exitCompare({ refresh: true, enterPick: true, animateCamera: false });
        return;
      }
      comparePickMode = true;
      updateCompareActionButtons();
      renderTrackList();
    }

    function onAddCompareClick() {
      if (comparePickMode) {
        cancelComparePick();
        return;
      }
      if (compareActive || selectedTrackId != null) beginComparePick();
    }

    function exitCompare(opts = {}) {
      const wasActive = compareActive;
      compareActive = false;
      compareTrackIds = [];
      comparePickMode = !!opts.enterPick && selectedTrackId != null;
      updateCompareActionButtons();
      const metricEl = document.getElementById("series-metric-toggles");
      if (metricEl) metricEl.hidden = true;
      document.getElementById("map3d-track-info")?.classList.remove("compare-mode");
      clearSeriesPosExtraMarkers();
      if (!wasActive && !opts.refresh && !opts.enterPick) return;
      if (opts.refresh === false && !opts.enterPick) return;
      if (selectedTrackId != null && MAP_DATA && !comparePickMode) {
        const t = MAP_DATA.tracks.find((x) => x.id === selectedTrackId);
        if (t) {
          renderTrackSeriesChart(t);
          showMap3dTrackInfo(t, false);
          if (prefer3dView) syncSelectedTrackTo3d({ animateCamera: !!opts.animateCamera });
        }
      } else if (comparePickMode && selectedTrackId != null && MAP_DATA) {
        const t = MAP_DATA.tracks.find((x) => x.id === selectedTrackId);
        if (t) {
          renderTrackSeriesChart(t);
          showMap3dTrackInfo(t, false);
          if (prefer3dView) syncSelectedTrackTo3d({ animateCamera: !!opts.animateCamera });
        }
      }
      refreshLayers();
      renderTrackList();
    }

    /** @param {number} partnerId 对比副轨；主轨为当前 selectedTrackId */
    function startCompare(partnerId) {
      const primary = selectedTrackId;
      const partner = Number(partnerId);
      if (primary == null || !Number.isFinite(partner) || partner === primary) return;
      const visible = new Set(filteredTracks().map((t) => t.id));
      if (!visible.has(primary) || !visible.has(partner)) {
        comparePickMode = false;
        updateCompareActionButtons();
        return;
      }
      comparePickMode = false;
      compareActive = true;
      compareTrackIds = [primary, partner].slice(0, COMPARE_MAX);
      soloTrackMode = false;
      updateCompareActionButtons();
      refreshLayers();
      renderTrackList();
      renderCompareSeriesChart();
      showCompareTrackInfo();
      scheduleFitCompareTracks();
      if (prefer3dView) syncSelectedTrackTo3d({ animateCamera: true });
      else clearSelectedTrack3dGeometry();
      document.getElementById("section-map")?.scrollIntoView({ block: "nearest", behavior: "smooth" });
    }

    function pruneCompareAgainstFilters() {
      if (comparePickMode && selectedTrackId != null) {
        const visible = new Set(filteredTracks().map((t) => t.id));
        if (!visible.has(selectedTrackId)) {
          comparePickMode = false;
        }
      }
      if (!compareActive) {
        updateCompareActionButtons();
        return;
      }
      const visible = new Set(filteredTracks().map((t) => t.id));
      compareTrackIds = compareTrackIds.filter((id) => visible.has(id));
      if (compareTrackIds.length < 2) {
        exitCompare({ refresh: true });
        return;
      }
      if (!compareTrackIds.includes(selectedTrackId)) {
        selectedTrackId = compareTrackIds[0];
      }
      updateCompareActionButtons();
      renderCompareSeriesChart();
      showCompareTrackInfo();
      if (prefer3dView) syncSelectedTrackTo3d({ animateCamera: false });
    }

    function setCompareMetric(metric) {
      if (!["height", "speed", "distance"].includes(metric)) return;
      compareMetric = metric;
      document.querySelectorAll("#series-metric-toggles .filter-btn").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.metric === metric);
      });
      if (compareActive) renderCompareSeriesChart();
    }

    /** 加深颜色，供 3D 航迹管使用。 */
    function darkenHex(hex, factor = 0.72) {
      const m = String(hex || "").trim().match(/^#?([0-9a-f]{6})$/i);
      if (!m) return hex;
      const n = parseInt(m[1], 16);
      const mix = (c) => Math.max(0, Math.min(255, Math.round(c * factor)));
      const r = mix((n >> 16) & 255);
      const g = mix((n >> 8) & 255);
      const b = mix(n & 255);
      return `#${((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1)}`;
    }

    function css(name) {
      return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    }

    function setMapStatus(msg, isError = false) {
      const el = document.getElementById("map-status");
      if (!el) return;
      el.textContent = msg;
      el.style.color = isError ? "var(--negative, #F53F3F)" : "";
    }

    function renderFactoryFilters() {
      initTrackFilters();
    }

    function chipFilters(containerId, options, activeKey, datasetKey, onSelect) {
      const wrap = document.getElementById(containerId);
      if (!wrap) return;
      wrap.innerHTML =
        `<button class="filter-btn active" data-${datasetKey}="all">全部</button>` +
        options.map(v => `<button class="filter-btn" data-${datasetKey}="${v}">${v}</button>`).join("");
      wrap.querySelectorAll(".filter-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          wrap.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          onSelect(btn.dataset[datasetKey]);
        });
      });
    }

    function formatRangeVal(v, decimals) {
      return decimals > 0 ? Number(v).toFixed(decimals) : String(Math.round(Number(v)));
    }

    function updateRangeLabel(labelId, minV, maxV, decimals) {
      const el = document.getElementById(labelId);
      if (el) el.textContent = `${formatRangeVal(minV, decimals)} – ${formatRangeVal(maxV, decimals)}`;
    }

    function dayIndexToIso(dayIndex) {
      const base = filterBounds?.date?.min || "2024-09-14";
      const [y, m, d] = base.split("-").map(Number);
      const dt = new Date(y, m - 1, d + Number(dayIndex));
      const yy = dt.getFullYear();
      const mm = String(dt.getMonth() + 1).padStart(2, "0");
      const dd = String(dt.getDate()).padStart(2, "0");
      return `${yy}-${mm}-${dd}`;
    }

    function isoToDayIndex(iso) {
      if (!iso || iso.length < 10) return null;
      const base = filterBounds?.date?.min || "2024-09-14";
      const [y0, m0, d0] = base.split("-").map(Number);
      const [y, m, d] = iso.slice(0, 10).split("-").map(Number);
      const a = Date.UTC(y, m - 1, d);
      const b = Date.UTC(y0, m0 - 1, d0);
      return Math.round((a - b) / 86400000);
    }

    function updateDateRangeLabel(minDay, maxDay) {
      const el = document.getElementById("filter-date-values");
      if (el) el.textContent = `${dayIndexToIso(minDay)} – ${dayIndexToIso(maxDay)}`;
    }

    function trackStartDayIndex(t) {
      const s = (t.start_time || "").slice(0, 10);
      if (!s) return null;
      return isoToDayIndex(s);
    }

    function updateRangeFill(minId, maxId, fillId) {
      const minEl = document.getElementById(minId);
      const maxEl = document.getElementById(maxId);
      const fill = document.getElementById(fillId);
      if (!minEl || !maxEl || !fill) return;
      const lo = Number(minEl.min);
      const hi = Number(minEl.max);
      const minV = Number(minEl.value);
      const maxV = Number(maxEl.value);
      const span = hi - lo || 1;
      fill.style.left = ((minV - lo) / span * 100) + "%";
      fill.style.width = ((maxV - minV) / span * 100) + "%";
    }

    function configureRangeSlider(minId, maxId, labelId, fillId, bounds, step, decimals) {
      const minEl = document.getElementById(minId);
      const maxEl = document.getElementById(maxId);
      if (!minEl || !maxEl) return;
      minEl.min = maxEl.min = String(bounds.min);
      minEl.max = maxEl.max = String(bounds.max);
      minEl.step = maxEl.step = String(step);
      minEl.value = String(bounds.min);
      maxEl.value = String(bounds.max);
      updateRangeLabel(labelId, bounds.min, bounds.max, decimals);
      updateRangeFill(minId, maxId, fillId);
    }

    function readRangeSlider(minId, maxId) {
      const minEl = document.getElementById(minId);
      const maxEl = document.getElementById(maxId);
      return { min: Number(minEl.value), max: Number(maxEl.value) };
    }

    function bindRangeFilterInputs() {
      if (rangeFiltersBound) return;
      rangeFiltersBound = true;
      const specs = [
        ["filter-date-min", "filter-date-max", "filter-date-values", "filter-date-fill", "date"],
        ["filter-duration-min", "filter-duration-max", "filter-duration-values", "filter-duration-fill", 0],
        ["filter-distance-min", "filter-distance-max", "filter-distance-values", "filter-distance-fill", 1],
        ["filter-height-min", "filter-height-max", "filter-height-values", "filter-height-fill", 0],
        ["filter-speed-min", "filter-speed-max", "filter-speed-values", "filter-speed-fill", 0],
      ];
      specs.forEach(([minId, maxId, labelId, fillId, decimalsOrDate]) => {
        const minEl = document.getElementById(minId);
        const maxEl = document.getElementById(maxId);
        if (!minEl || !maxEl) return;
        const onSlide = (changed) => {
          let minV = Number(minEl.value);
          let maxV = Number(maxEl.value);
          if (minV > maxV) {
            if (changed === "min") maxEl.value = String(minV);
            else minEl.value = String(maxV);
            minV = Number(minEl.value);
            maxV = Number(maxEl.value);
          }
          if (decimalsOrDate === "date") updateDateRangeLabel(minV, maxV);
          else updateRangeLabel(labelId, minV, maxV, decimalsOrDate);
          updateRangeFill(minId, maxId, fillId);
          scheduleApplyTrackFilters();
        };
        minEl.addEventListener("input", () => onSlide("min"));
        maxEl.addEventListener("input", () => onSlide("max"));
      });
    }

    function scheduleApplyTrackFilters() {
      if (filterApplyTimer != null) clearTimeout(filterApplyTimer);
      filterApplyTimer = setTimeout(() => {
        filterApplyTimer = null;
        applyTrackFilters();
      }, 120);
    }

    function initTrackFilters() {
      filterBounds = MAP_DATA.meta.filter_bounds;
      if (!filterBounds) return;

      chipFilters("factory-filters", filterBounds.factories || [], trackFilters.factory, "f", v => {
        trackFilters.factory = v;
        applyTrackFilters();
      });
      chipFilters("flytype-filters", filterBounds.fly_types || [], trackFilters.flyType, "t", v => {
        trackFilters.flyType = v;
        applyTrackFilters();
      });

      const b = filterBounds;
      if (b.date) {
        configureRangeSlider(
          "filter-date-min", "filter-date-max", "filter-date-values", "filter-date-fill",
          { min: b.date.day_min, max: b.date.day_max }, 1, 0,
        );
        updateDateRangeLabel(b.date.day_min, b.date.day_max);
      }
      configureRangeSlider("filter-duration-min", "filter-duration-max", "filter-duration-values", "filter-duration-fill", b.duration_min, 0.1, 1);
      configureRangeSlider("filter-distance-min", "filter-distance-max", "filter-distance-values", "filter-distance-fill", b.distance_km, 0.1, 1);
      configureRangeSlider("filter-height-min", "filter-height-max", "filter-height-values", "filter-height-fill", b.height_m, 1, 0);
      configureRangeSlider("filter-speed-min", "filter-speed-max", "filter-speed-values", "filter-speed-fill", b.speed_kmh, 1, 0);
      bindRangeFilterInputs();

      syncFilterStateFromInputs();
      updateFilterCountBadge();
    }

    function syncFilterStateFromInputs() {
      const dateR = readRangeSlider("filter-date-min", "filter-date-max");
      const dur = readRangeSlider("filter-duration-min", "filter-duration-max");
      const dist = readRangeSlider("filter-distance-min", "filter-distance-max");
      const h = readRangeSlider("filter-height-min", "filter-height-max");
      const spd = readRangeSlider("filter-speed-min", "filter-speed-max");
      trackFilters.dateMin = dateR.min;
      trackFilters.dateMax = dateR.max;
      trackFilters.durationMin = dur.min;
      trackFilters.durationMax = dur.max;
      trackFilters.distanceMin = dist.min;
      trackFilters.distanceMax = dist.max;
      trackFilters.heightMin = h.min;
      trackFilters.heightMax = h.max;
      trackFilters.speedMin = spd.min;
      trackFilters.speedMax = spd.max;
    }

    function resetTrackFilters() {
      if (!filterBounds) return;
      trackFilters.factory = "all";
      trackFilters.flyType = "all";
      document.querySelectorAll("#factory-filters .filter-btn").forEach(b => {
        b.classList.toggle("active", b.dataset.f === "all");
      });
      document.querySelectorAll("#flytype-filters .filter-btn").forEach(b => {
        b.classList.toggle("active", b.dataset.t === "all");
      });

      const b = filterBounds;
      if (b.date) {
        configureRangeSlider(
          "filter-date-min", "filter-date-max", "filter-date-values", "filter-date-fill",
          { min: b.date.day_min, max: b.date.day_max }, 1, 0,
        );
        updateDateRangeLabel(b.date.day_min, b.date.day_max);
      }
      configureRangeSlider("filter-duration-min", "filter-duration-max", "filter-duration-values", "filter-duration-fill", b.duration_min, 0.1, 1);
      configureRangeSlider("filter-distance-min", "filter-distance-max", "filter-distance-values", "filter-distance-fill", b.distance_km, 0.1, 1);
      configureRangeSlider("filter-height-min", "filter-height-max", "filter-height-values", "filter-height-fill", b.height_m, 1, 0);
      configureRangeSlider("filter-speed-min", "filter-speed-max", "filter-speed-values", "filter-speed-fill", b.speed_kmh, 1, 0);
      syncFilterStateFromInputs();
      applyTrackFilters();
    }

    function applyTrackFilters() {
      syncFilterStateFromInputs();
      // 选中轨若不在筛选结果中：取消选中并关时序；仍在结果中则保留 solo
      let clearedSelection = false;
      if (selectedTrackId !== null) {
        const stillVisible = filteredTracks().some(t => t.id === selectedTrackId);
        if (!stillVisible) {
          selectedTrackId = null;
          hoverTrackId = null;
          soloTrackMode = false;
          hideTrackSeriesPanel();
          hideMap3dTrackInfo();
          clearSeriesPosMarker();
          clearedSelection = true;
        }
      }
      pruneCompareAgainstFilters();
      updateFilterCountBadge();
      updateFilterStatus();
      renderTrackList();
      refreshLayers();
      if (clearedSelection && !compareActive) {
        clearSelectedTrack3dGeometry();
        if (in3dMode) syncMap3dOverlays();
        setTimeout(() => { if (map) map.invalidateSize(); }, 80);
      } else if (compareActive && prefer3dView) {
        syncSelectedTrackTo3d({ animateCamera: false });
      }
    }

    function updateFilterStatus() {
      const chipsEl = document.getElementById("filter-status-chips");
      const textEl = document.getElementById("filter-status-text");
      if (!chipsEl || !textEl || !filterBounds) return;
      const chips = [];
      if (trackFilters.factory !== "all") chips.push(trackFilters.factory);
      if (trackFilters.flyType !== "all") chips.push(trackFilters.flyType);
      const b = filterBounds;
      if (b.date && (trackFilters.dateMin > b.date.day_min || trackFilters.dateMax < b.date.day_max)) {
        chips.push(`${dayIndexToIso(trackFilters.dateMin)}～${dayIndexToIso(trackFilters.dateMax)}`);
        const noStart = filteredTracks().filter(t => !(t.start_time || "").trim()).length;
        if (noStart > 0) chips.push(`含 ${noStart} 条无起飞时间`);
      }
      if (trackFilters.durationMin > b.duration_min.min || trackFilters.durationMax < b.duration_min.max) {
        chips.push(`时长 ${formatRangeVal(trackFilters.durationMin, 0)}–${formatRangeVal(trackFilters.durationMax, 0)} 分`);
      }
      if (trackFilters.distanceMin > b.distance_km.min || trackFilters.distanceMax < b.distance_km.max) {
        chips.push(`距离 ${formatRangeVal(trackFilters.distanceMin, 1)}–${formatRangeVal(trackFilters.distanceMax, 1)} km`);
      }
      if (trackFilters.heightMin > b.height_m.min || trackFilters.heightMax < b.height_m.max) {
        chips.push(`高度 ${formatRangeVal(trackFilters.heightMin, 0)}–${formatRangeVal(trackFilters.heightMax, 0)} m`);
      }
      if (trackFilters.speedMin > b.speed_kmh.min || trackFilters.speedMax < b.speed_kmh.max) {
        chips.push(`速度 ${formatRangeVal(trackFilters.speedMin, 0)}–${formatRangeVal(trackFilters.speedMax, 0)} km/h`);
      }
      if (document.getElementById("layer-region-only")?.checked) chips.push("仅行政区内");
      const n = filteredTracks().length;
      textEl.textContent = chips.length ? `当前条件 · 共 ${n} 条轨迹` : `未限制维度 · 共 ${n} 条轨迹`;
      chipsEl.innerHTML = chips.map(c => `<span class="filter-chip">${c}</span>`).join("");
    }

    function updateFilterCountBadge() {
      const badge = document.getElementById("filter-count-badge");
      const listBadge = document.getElementById("list-count-badge");
      if (!MAP_DATA) return;
      const n = filteredTracks().length;
      const total = MAP_DATA.tracks.length;
      const label = `${n} / ${total}`;
      if (badge) badge.textContent = label;
      if (listBadge) listBadge.textContent = label;
    }

    function sortTracks(tracks) {
      const arr = [...tracks];
      if (trackSortKey === "duration") {
        arr.sort((a, b) => (b.duration_min || 0) - (a.duration_min || 0));
      } else if (trackSortKey === "distance") {
        arr.sort((a, b) => (b.distance_m || 0) - (a.distance_m || 0));
      } else {
        arr.sort((a, b) => b.point_count - a.point_count);
      }
      return arr;
    }

    function trackMatchesSearch(t, q) {
      const fields = [
        String(t.id),
        t.task_name || "",
        t.airport_name || "",
        t.dock_sn || "",
        t.mission_id != null ? String(t.mission_id) : "",
        t.uav_sn || "",
      ];
      return fields.some(f => f.toLowerCase().includes(q));
    }

    function listTracksForDisplay() {
      let tracks = sortTracks(filteredTracks());
      if (trackSearchQuery.trim()) {
        const q = trackSearchQuery.trim().toLowerCase();
        tracks = tracks.filter(t => trackMatchesSearch(t, q));
      }
      return tracks;
    }

    function shouldShowTrack(t) {
      if (!matchTrackFilters(t) || !matchRegion(t)) return false;
      if (soloTrackMode && selectedTrackId !== null) return t.id === selectedTrackId;
      return true;
    }

    /* ========================================================================
     * 时序抽屉（docked/visible 开合、Chart.js、播放插值、2D/3D 位置标点）
     * ======================================================================== */

    function isTrackSeriesPanelVisible() {
      return !!document.getElementById("track-series-panel")?.classList.contains("visible");
    }

    function isTrackSeriesPanelDocked() {
      return !!document.getElementById("track-series-panel")?.classList.contains("docked");
    }

    function syncSeriesPanelActions() {
      const showBtn = document.getElementById("btn-show-series");
      const toggleBtn = document.getElementById("btn-toggle-series");
      const panel = document.getElementById("track-series-panel");
      const panelOpen = isTrackSeriesPanelVisible();
      const docked = isTrackSeriesPanelDocked();
      const hasFocus = selectedTrackId != null || compareActive;
      showBtn?.classList.toggle("visible", hasFocus && !docked && !panelOpen);
      if (toggleBtn) {
        toggleBtn.setAttribute("aria-expanded", panelOpen ? "true" : "false");
        const label = panelOpen ? "收起时序图" : "展开时序图";
        toggleBtn.title = label;
        toggleBtn.setAttribute("aria-label", label);
      }
      if (panel) panel.setAttribute("aria-hidden", docked ? "false" : "true");
    }

    /** 抽屉开合过程中持续刷新地图/图表尺寸，避免灰边或拉伸。 */
    function pulseMapLayoutDuringSeriesAnim(durationMs = 400) {
      const t0 = performance.now();
      const tick = (now) => {
        trackSeriesChart?.resize();
        if (map) map.invalidateSize({ animate: false });
        if (map3d) map3d.resize();
        if (now - t0 < durationMs) requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    }

    function seriesDrawerTransitionProp(name) {
      return !name || name === "height" || name === "max-height" || name === "min-height" || name === "padding";
    }

    function afterSeriesDrawerLayoutSettle(panel, cb) {
      let done = false;
      const finish = () => {
        if (done) return;
        done = true;
        panel?.removeEventListener("transitionend", onEnd);
        cb?.();
      };
      const onEnd = (e) => {
        if (!panel || e.target !== panel || !seriesDrawerTransitionProp(e.propertyName)) return;
        finish();
      };
      panel?.addEventListener("transitionend", onEnd);
      setTimeout(finish, 420);
    }

    /**
     * 展开底部时序抽屉（docked + visible），为 Chart 腾出高度并收缩地图区。
     * 副作用：改 panel class、syncSeriesPanelActions；动画期 pulseMapLayoutDuringSeriesAnim；
     *         布局稳定后 invalidateSize/resize 并调用 opts.onOpened。
     */
    function openTrackSeriesDrawer(opts = {}) {
      const panel = document.getElementById("track-series-panel");
      if (!panel) return;
      const already = panel.classList.contains("visible") && panel.classList.contains("docked");
      panel.classList.add("docked", "visible");
      syncSeriesPanelActions();
      const afterOpen = () => {
        trackSeriesChart?.resize();
        if (map) map.invalidateSize({ animate: false });
        if (map3d) map3d.resize();
        opts.onOpened?.();
      };
      if (already) {
        requestAnimationFrame(afterOpen);
        return;
      }
      pulseMapLayoutDuringSeriesAnim(400);
      afterSeriesDrawerLayoutSettle(panel, afterOpen);
    }

    /**
     * 收起为仅箭头条（仍 docked，保留选中态与 Chart 实例）。
     * 副作用：移除 visible；地图区高度复原；不销毁 trackSeriesChart。
     */
    function collapseTrackSeriesDrawer(opts = {}) {
      const panel = document.getElementById("track-series-panel");
      if (!panel) {
        opts.onClosed?.();
        return;
      }
      if (panel.classList.contains("docked") && !panel.classList.contains("visible")) {
        syncSeriesPanelActions();
        opts.onClosed?.();
        return;
      }
      panel.classList.add("docked");
      panel.classList.remove("visible");
      syncSeriesPanelActions();
      pulseMapLayoutDuringSeriesAnim(400);
      afterSeriesDrawerLayoutSettle(panel, () => {
        if (map) map.invalidateSize({ animate: false });
        if (map3d) map3d.resize();
        opts.onClosed?.();
      });
    }

    /**
     * 完全卸下抽屉（clearTrackSelection / hideTrackSeriesPanel 时）。
     * 副作用：移除 docked + visible；地图恢复全高；回调 opts.onClosed。
     */
    function undockTrackSeriesDrawer(opts = {}) {
      const panel = document.getElementById("track-series-panel");
      if (!panel) {
        opts.onClosed?.();
        return;
      }
      const wasShowing = panel.classList.contains("docked");
      panel.classList.remove("visible", "docked");
      syncSeriesPanelActions();
      if (!wasShowing) {
        opts.onClosed?.();
        return;
      }
      pulseMapLayoutDuringSeriesAnim(400);
      afterSeriesDrawerLayoutSettle(panel, () => {
        if (map) map.invalidateSize({ animate: false });
        if (map3d) map3d.resize();
        opts.onClosed?.();
      });
    }

    /** @deprecated 兼容旧调用 → 收起为箭头条 */
    function closeTrackSeriesDrawer(opts = {}) {
      collapseTrackSeriesDrawer(opts);
    }

    function updateTrackListMeta() {
      const meta = document.getElementById("track-list-meta");
      const soloBtn = document.getElementById("btn-solo-track");
      const clearBtn = document.getElementById("btn-clear-selection");
      if (!meta) return;
      if (compareActive) {
        meta.textContent = `对比中 ${compareTrackIds.length} 条 · #${compareTrackIds.join(" / #")}`;
        soloBtn?.classList.remove("visible");
        clearBtn?.classList.add("visible");
      } else if (comparePickMode && selectedTrackId != null) {
        meta.textContent = `待选对比轨 · 已选 #${selectedTrackId} · 再点另一条`;
        soloBtn?.classList.remove("visible");
        clearBtn?.classList.add("visible");
      } else if (selectedTrackId !== null) {
        meta.textContent = soloTrackMode
          ? `仅显示 #${selectedTrackId}`
          : `已选中 #${selectedTrackId} · 点「加入对比」再选另一条`;
        soloBtn?.classList.toggle("visible", !soloTrackMode);
        clearBtn?.classList.add("visible");
      } else {
        const shown = listTracksForDisplay().length;
        const total = filteredTracks().length;
        meta.textContent = shown === total
          ? `共 ${total} 条 · 点击选中`
          : `显示 ${shown} / ${total} 条 · 点击选中`;
        soloBtn?.classList.remove("visible");
        clearBtn?.classList.remove("visible");
      }
      updateCompareActionButtons();
      syncSeriesPanelActions();
    }

    /** 仅收起时序抽屉（保留选中与图表实例），底部箭头可再展开。 */
    function dismissTrackSeriesPanel() {
      stopSeriesPlay();
      seriesPlay.cursorVisible = false;
      seriesPlay.lastTipIdx = -1;
      clearSeriesPosMarker();
      const cursor = document.getElementById("series-play-cursor");
      if (cursor) cursor.hidden = true;
      collapseTrackSeriesDrawer();
    }

    function toggleTrackSeriesDrawer() {
      if (selectedTrackId == null && !compareActive) return;
      if (isTrackSeriesPanelVisible()) {
        dismissTrackSeriesPanel();
        return;
      }
      reopenTrackSeriesPanel();
    }

    /** 在仍选中某轨时重新打开时序抽屉。 */
    function reopenTrackSeriesPanel() {
      if (compareActive) {
        renderCompareSeriesChart();
        return;
      }
      if (selectedTrackId == null || !MAP_DATA) return;
      const t = MAP_DATA.tracks.find((x) => x.id === selectedTrackId);
      if (!t) return;
      renderTrackSeriesChart(t);
    }

    function renderTrackList() {
      const list = document.getElementById("track-list");
      const tracks = listTracksForDisplay();
      updateTrackListMeta();
      if (!tracks.length) {
        list.innerHTML = `<div class="track-item" style="cursor:default;color:var(--muted);display:block">无匹配轨迹，请放宽筛选或搜索条件</div>`;
        return;
      }
      list.innerHTML = tracks.map(t => {
        const title = `#${t.id} · ${t.point_count} 点${t.task_name ? " · " + t.task_name : ""}`;
        const parts = [
          t.factory || "未知",
          t.fly_type || "—",
          t.duration_min != null ? `${t.duration_min} 分钟` : null,
          t.distance_m != null ? `${(t.distance_m / 1000).toFixed(1)} km` : null,
        ].filter(Boolean);
        const meta = parts.join(" · ");
        const active = (!compareActive && selectedTrackId === t.id) ? " active" : "";
        const compareRow = compareActive && compareTrackIds.includes(t.id) ? " compare-active-row" : "";
        const pickTarget = comparePickMode && selectedTrackId !== t.id ? " compare-pick-target" : "";
        const swatch = compareActive && compareTrackIds.includes(t.id)
          ? compareTrackColor(t.id)
          : "";
        return `<div class="track-item${active}${compareRow}${pickTarget}" data-id="${t.id}"${swatch ? ` style="--compare-swatch:${swatch}"` : ""}>
          <span class="track-item-title">${title}</span>
          <span class="track-item-meta">${meta || t.start_time || "—"}</span>
        </div>`;
      }).join("");
      list.querySelectorAll(".track-item[data-id]").forEach(el => {
        const id = Number(el.dataset.id);
        el.addEventListener("click", () => focusTrack(id));
        el.addEventListener("mouseenter", () => setHoverTrack(id));
        el.addEventListener("mouseleave", () => setHoverTrack(null));
      });
    }

    function trackLineStyle(t) {
      const factory = t.has_record ? factoryColor(t) : "#95A5A6";
      const isCompare = isCompareHighlighted(t.id);
      const isSelected = selectedTrackId === t.id || isCompare;
      const isHover = hoverTrackId === t.id;
      const dimOthers = (
        (compareActive && !isCompare && !isHover) ||
        (!compareActive && selectedTrackId !== null && !soloTrackMode && !isSelected && !isHover)
      );
      let weight = 2;
      let opacity = 0.22;
      let color = factory;
      if (isCompare) {
        opacity = 1;
        color = compareTrackColor(t.id);
      } else if (isSelected || isHover) {
        opacity = 1;
        color = factory;
      } else if (dimOthers) {
        color = "#94A3B8";
        opacity = 0.12;
      }
      return { color, weight, opacity, isSelected, isHover, dimOthers, isCompare };
    }

    function getTrackLineEntry(id) {
      const entry = trackPolylines.get(id);
      if (!entry) return null;
      if (entry.line) return entry;
      return { line: entry, hit: null };
    }

    function bindTrackInteractions(layer, trackId) {
      layer.on("click", () => focusTrack(trackId));
      layer.on("mouseover", () => {
        setHoverTrack(trackId);
        if (map) map.getContainer().style.cursor = "pointer";
      });
      layer.on("mouseout", () => {
        setHoverTrack(null);
        if (map) map.getContainer().style.cursor = "";
      });
    }

    function applyTrackPolylineStyle(id) {
      const entry = getTrackLineEntry(id);
      const t = MAP_DATA?.tracks.find(x => x.id === id);
      if (!entry?.line || !t) return;
      const style = trackLineStyle(t);
      entry.line.setStyle({
        color: style.color,
        weight: style.weight,
        opacity: style.opacity,
      });
      if (entry.hit) {
        entry.hit.setStyle({
          color: style.color,
          weight: TRACK_HIT_WEIGHT,
          opacity: 0,
        });
      }
      if (style.isSelected || style.isHover) {
        entry.line.bringToFront();
        entry.hit?.bringToFront();
      }
    }

    function setHoverTrack(id) {
      const prev = hoverTrackId;
      if (prev === id) return;
      hoverTrackId = id;
      if (prev != null) applyTrackPolylineStyle(prev);
      if (id != null) applyTrackPolylineStyle(id);
      applyMap3dTrackHover(id);
      document.querySelectorAll(".track-item[data-id]").forEach(el => {
        el.classList.toggle("hovering", Number(el.dataset.id) === id);
      });
    }

    function inNumericRange(value, min, max) {
      if (value == null || Number.isNaN(value)) return true;
      if (min != null && value < min) return false;
      if (max != null && value > max) return false;
      return true;
    }

    function matchTrackFilters(t) {
      if (trackFilters.factory !== "all" && t.factory !== trackFilters.factory) return false;
      if (trackFilters.flyType !== "all" && t.fly_type !== trackFilters.flyType) return false;
      // 无起飞时间不排除（与其它空字段口径一致）
      if (!inNumericRange(trackStartDayIndex(t), trackFilters.dateMin, trackFilters.dateMax)) return false;
      if (!inNumericRange(t.duration_min, trackFilters.durationMin, trackFilters.durationMax)) return false;
      const distKm = t.distance_m != null ? t.distance_m / 1000 : null;
      if (!inNumericRange(distKm, trackFilters.distanceMin, trackFilters.distanceMax)) return false;
      if (!inNumericRange(t.max_height_m, trackFilters.heightMin, trackFilters.heightMax)) return false;
      if (!inNumericRange(t.max_speed_kmh, trackFilters.speedMin, trackFilters.speedMax)) return false;
      return true;
    }

    function filteredTracks() {
      return MAP_DATA.tracks.filter(t => matchTrackFilters(t) && matchRegion(t));
    }

    function airportPopup(a) {
      return `<b>${a.name}</b><br>
        厂商：${a.factory}<br>
        设备 SN：${a.device_sn}<br>
        坐标：${a.longitude}, ${a.latitude}<br>
        覆盖半径：${a.radius_m} m<br>
        ${a.height != null ? "海拔：" + a.height + " m<br>" : ""}
        关联飞行：${a.flight_count} 次<br>
        ${a.department ? "部门：" + a.department + "<br>" : ""}
        ${a.firmware_version ? "固件：" + a.firmware_version : ""}`;
    }

    function matchFactory(item) {
      if (trackFilters.factory === "all") return true;
      return item.factory === trackFilters.factory;
    }

    function matchRegion(t) {
      if (!document.getElementById("layer-region-only")?.checked) return true;
      return (t.in_district_ratio ?? 0) >= 0.5;
    }

    function fitDefaultView() {
      const view = MAP_DATA.meta.default_view || MAP_DATA.meta.bounds;
      const maxZoom = view.max_zoom || 12;
      map.fitBounds([view.southwest, view.northeast], { padding: [28, 28], maxZoom });
      if (in3dMode && map3d && map3dTrackId != null && MAP_DATA) {
        const t = MAP_DATA.tracks.find((x) => x.id === map3dTrackId);
        if (t) {
          applyTrack3dView(t, true);
          return;
        }
      }
      if (in3dMode && map3d) {
        // meta 为 Leaflet [lat,lon]；MapLibre 要 [lon,lat]
        const sw = view.southwest;
        const ne = view.northeast;
        const cam = {
          pitch: 60,
          bearing: -20,
          padding: { top: 72, bottom: 72, left: 56, right: 56 },
          maxZoom: 17,
          duration: 800,
        };
        if (typeof map3d.fitBounds === "function") {
          map3d.fitBounds(
            [
              [sw[1], sw[0]],
              [ne[1], ne[0]],
            ],
            cam
          );
        } else {
          map3d.easeTo({ pitch: 60, bearing: -20, duration: 800 });
        }
      }
    }

    function initMap() {
      map = L.map("map", { zoomControl: true });
      applyBasemap(document.documentElement.dataset.theme);
      fitDefaultView();

      // 自下而上：机场 → 覆盖 → 行政区划（倒数第二）→ 轨迹（最上层，便于点选）
      airportLayer = L.layerGroup().addTo(map);
      coverageLayer = L.layerGroup().addTo(map);
      districtLayer = L.layerGroup().addTo(map);
      trackLayer = L.layerGroup().addTo(map);
      refreshLayers();
      setTimeout(() => map.invalidateSize(), 0);
    }

    window.addEventListener("resize", () => {
      if (map) map.invalidateSize();
      if (map3d) map3d.resize();
    });

    function refreshDistrictLayer() {
      if (!districtLayer) return;
      districtLayer.clearLayers();
      if (!document.getElementById("layer-district")?.checked) return;
      const geo = MAP_DATA.meta.district_boundary;
      if (!geo) return;
      L.geoJSON(geo, {
        style: {
          color: "#E67E22",
          weight: 2,
          fillColor: "#E67E22",
          fillOpacity: 0.06,
        },
      }).bindPopup(
        `<b>${MAP_DATA.meta.district_name || "越城区"}</b><br>看板「行政内」KPI 按此行政区划面统计`,
      ).addTo(districtLayer);
    }

    /**
     * 重建 Leaflet 机场/覆盖/区划/轨迹图层，并 syncMap3dOverlays 同步 3D 叠层。
     * 口径：轨迹折线优先 series.lon/lat（与时序标点同源）；缺 series 时回退 t.coords。
     *       可见性由 shouldShowTrack + 图层 checkbox 决定；命中层 hit 透明加宽。
     * 副作用：清空 trackLayer/trackPolylines 后全量重绘；不改动选中 id。
     */
    function refreshLayers() {
      airportLayer.clearLayers();
      coverageLayer.clearLayers();
      trackLayer.clearLayers();
      trackPolylines.clear();

      const showAirports = document.getElementById("layer-airports").checked;
      const showCoverage = document.getElementById("layer-coverage").checked;
      const showTracks = document.getElementById("layer-tracks").checked;

      if (showAirports) {
        MAP_DATA.airports.forEach(a => {
          if (!matchFactory(a)) return;
          const color = factoryColor(a);
          L.circleMarker([a.latitude, a.longitude], {
            radius: 7, color: "#fff", weight: 1.5,
            fillColor: color, fillOpacity: 0.92,
          }).bindPopup(airportPopup(a)).addTo(airportLayer);
        });
      }

      if (showCoverage) {
        MAP_DATA.airports.forEach(a => {
          if (!matchFactory(a)) return;
          const color = factoryColor(a);
          L.circle([a.latitude, a.longitude], {
            radius: a.radius_m,
            color, weight: 1, fillColor: color, fillOpacity: 0.06,
            dashArray: "4 6",
          }).bindPopup(`<b>${a.name}</b><br>覆盖半径 ${(a.radius_m / 1000).toFixed(1)} km`).addTo(coverageLayer);
        });
      }

      refreshDistrictLayer();

      if (showTracks) {
        MAP_DATA.tracks.forEach(t => {
          if (!shouldShowTrack(t)) return;
          // 有时序 lon/lat 时与标点同源，避免 coords 抽稀与 series 不一致导致「点不在线上」
          const series = t.series;
          let latlngs;
          if (series?.lon?.length && series?.lat?.length) {
            const n = Math.min(series.lon.length, series.lat.length);
            latlngs = [];
            for (let i = 0; i < n; i++) {
              const lon = series.lon[i];
              const lat = series.lat[i];
              if (lon == null || lat == null || !Number.isFinite(lon) || !Number.isFinite(lat)) continue;
              latlngs.push([lat, lon]);
            }
          }
          if (!latlngs?.length) {
            latlngs = t.coords.map(c => [c[1], c[0]]);
          }
          if (latlngs.length < 2) return;
          const style = trackLineStyle(t);
          const line = L.polyline(latlngs, {
            color: style.color,
            weight: style.weight,
            opacity: style.opacity,
            interactive: false,
          });
          // 透明加宽命中层：扩大点选 / 悬停判定范围（详情在右上角卡，不再用 Leaflet 弹窗）
          const hit = L.polyline(latlngs, {
            color: style.color,
            weight: TRACK_HIT_WEIGHT,
            opacity: 0,
            fillOpacity: 0,
            interactive: true,
            bubblingMouseEvents: false,
            className: "track-hit-line",
          });
          bindTrackInteractions(hit, t.id);
          line.addTo(trackLayer);
          hit.addTo(trackLayer);
          trackPolylines.set(t.id, { line, hit });
          if (style.isSelected || style.isHover) {
            line.bringToFront();
            hit.bringToFront();
          }
          const endpointStrong = style.isSelected || style.isHover;
          L.circleMarker(latlngs[0], {
            radius: 4,
            color: "#fff",
            weight: 1,
            fillColor: style.color,
            fillOpacity: endpointStrong ? 1 : (style.dimOthers ? 0.12 : 0.35),
          }).addTo(trackLayer);
          if (latlngs.length > 1) {
            L.circleMarker(latlngs[latlngs.length - 1], {
              radius: 3,
              color: "#fff",
              weight: 1,
              fillColor: style.color,
              fillOpacity: endpointStrong ? 0.85 : (style.dimOthers ? 0.1 : 0.3),
            }).addTo(trackLayer);
          }
        });
      }
      syncMap3dOverlays();
    }

    function seriesPointLatLng(track, dataIndex) {
      const series = track?.series;
      if (!series || dataIndex == null || dataIndex < 0) return null;
      const lat = series.lat?.[dataIndex];
      const lon = series.lon?.[dataIndex];
      if (lat != null && lon != null && Number.isFinite(lat) && Number.isFinite(lon)) {
        return [lat, lon];
      }
      const coords = track.coords;
      if (!coords?.length || !series.t_min?.length) return null;
      const n = series.t_min.length;
      const ratio = n <= 1 ? 0 : dataIndex / (n - 1);
      const ci = Math.round(ratio * (coords.length - 1));
      const c = coords[Math.max(0, Math.min(coords.length - 1, ci))];
      if (!c || c.length < 2) return null;
      return [c[1], c[0]];
    }

    function lerpNum(a, b, u) {
      const na = Number(a);
      const nb = Number(b);
      const fa = Number.isFinite(na);
      const fb = Number.isFinite(nb);
      if (!fa && !fb) return null;
      if (!fa) return nb;
      if (!fb) return na;
      return na + (nb - na) * u;
    }

    function seriesPlayTMax(track) {
      const arr = track?.series?.t_min;
      if (!arr?.length) return 0;
      for (let i = arr.length - 1; i >= 0; i--) {
        if (arr[i] != null && Number.isFinite(Number(arr[i]))) return Number(arr[i]);
      }
      return 0;
    }

    /** 最后一个 t_min <= tMin 的下标。 */
    function seriesIndexAtTime(track, tMin) {
      const arr = track?.series?.t_min;
      if (!arr?.length) return 0;
      let lo = 0;
      let hi = arr.length - 1;
      if (tMin <= Number(arr[0] ?? 0)) return 0;
      if (tMin >= Number(arr[hi] ?? 0)) return hi;
      while (lo < hi) {
        const mid = (lo + hi + 1) >> 1;
        const v = Number(arr[mid]);
        if (v <= tMin) lo = mid;
        else hi = mid - 1;
      }
      return lo;
    }

    /**
     * 按 t_min 在相邻采样点间连续插值位置与标量（高度/速度/距离/elevation）。
     * 口径：位置经 seriesPointLatLng（优先 series lon/lat，否则 coords 比例回退）；
     *       标量在 [i0,i1] 上线性 lerp；返回 i0/i1/u 供播放游标与标注节流。
     * 副作用：无。
     */
    function seriesInterpAtTime(track, tMin) {
      const series = track?.series;
      const arr = series?.t_min;
      if (!arr?.length) return null;
      const n = arr.length;
      let i0 = seriesIndexAtTime(track, tMin);
      if (i0 >= n - 1) {
        i0 = n - 1;
        const ll = seriesPointLatLng(track, i0);
        return {
          i0,
          i1: i0,
          u: 0,
          t: Number(arr[i0]) || 0,
          lat: ll ? ll[0] : Number(series.lat?.[i0]),
          lon: ll ? ll[1] : Number(series.lon?.[i0]),
          height_m: series.height_m?.[i0] != null ? Number(series.height_m[i0]) : null,
          elevation_m: series.elevation_m?.[i0] != null ? Number(series.elevation_m[i0]) : null,
          speed_kmh: series.speed_kmh?.[i0] != null ? Number(series.speed_kmh[i0]) : null,
          distance_km: series.distance_km?.[i0] != null ? Number(series.distance_km[i0]) : null,
        };
      }
      const i1 = i0 + 1;
      const t0 = Number(arr[i0]) || 0;
      const t1 = Number(arr[i1]) || t0;
      const span = t1 - t0;
      const u = span > 1e-9 ? Math.max(0, Math.min(1, (tMin - t0) / span)) : 0;
      const ll0 = seriesPointLatLng(track, i0);
      const ll1 = seriesPointLatLng(track, i1);
      const lat0 = ll0 ? ll0[0] : Number(series.lat?.[i0]);
      const lon0 = ll0 ? ll0[1] : Number(series.lon?.[i0]);
      const lat1 = ll1 ? ll1[0] : Number(series.lat?.[i1]);
      const lon1 = ll1 ? ll1[1] : Number(series.lon?.[i1]);
      return {
        i0,
        i1,
        u,
        t: t0 + (t1 - t0) * u,
        lat: lerpNum(lat0, lat1, u),
        lon: lerpNum(lon0, lon1, u),
        height_m: lerpNum(series.height_m?.[i0], series.height_m?.[i1], u),
        elevation_m: lerpNum(series.elevation_m?.[i0], series.elevation_m?.[i1], u),
        speed_kmh: lerpNum(series.speed_kmh?.[i0], series.speed_kmh?.[i1], u),
        distance_km: lerpNum(series.distance_km?.[i0], series.distance_km?.[i1], u),
      };
    }

    function seriesPosAnnotationFromSample(sample, opts = {}) {
      if (!sample) return "";
      const colors = seriesChartColors();
      const trackLabel = opts.trackLabel ? String(opts.trackLabel) : "";
      const title = trackLabel
        ? `${trackLabel} · 起飞后 ${Number(sample.t).toFixed(1)} 分钟`
        : `起飞后 ${Number(sample.t).toFixed(1)} 分钟`;
      const rows = [
        { color: colors.height, label: "高度 (m)", value: formatSeriesNum(sample.height_m, 0) },
        { color: colors.speed, label: "速度 (km/h)", value: formatSeriesNum(sample.speed_kmh, 1) },
        { color: colors.distance, label: "累计距离 (km)", value: formatSeriesNum(sample.distance_km, 2) },
      ];
      const footer =
        sample.lat != null && sample.lon != null && Number.isFinite(sample.lat) && Number.isFinite(sample.lon)
          ? `位置 ${sample.lat.toFixed(5)}, ${sample.lon.toFixed(5)}`
          : "";
      const rowsHtml = rows
        .map(
          (r) =>
            `<div class="series-pos-tip-row"><span class="series-pos-tip-swatch" style="background:${r.color}"></span>${r.label}: ${r.value}</div>`
        )
        .join("");
      return (
        `<div class="series-pos-tip">` +
        `<div class="series-pos-tip-title">${title}</div>` +
        rowsHtml +
        (footer ? `<div class="series-pos-tip-footer">${footer}</div>` : "") +
        `</div>`
      );
    }

    function seriesPosPinInnerHtml(sample, accent, opts = {}) {
      return (
        seriesPosAnnotationFromSample(sample, opts) +
        `<div class="series-pos-dot" style="background:${accent}"></div>`
      );
    }

    function compareTrackPosLabel(track) {
      if (!track) return "";
      return `#${track.id}`;
    }

    function seriesAltForSample(track, sample) {
      if (!sample || sample.lon == null || sample.lat == null) return 0;
      const { usedDefault120 } = displayHeightsFor3d(track?.series);
      return absoluteAltitudeFor3d(
        sample.lon,
        sample.lat,
        sample.height_m,
        sample.elevation_m,
        usedDefault120
      );
    }

    /**
     * 在 2D/3D 地图展示时序采样位置（播放 / seek / 悬停插值）。
     * 口径：每帧更新 marker 坐标；标注 HTML 仅在 i0 变化或 forceTip 时刷新（seriesPlay.lastTipIdx）。
     * 副作用：创建/移动 seriesPosMarker；3D 模式下更新 WebGL hover 点与屏幕 overlay pin。
     */
    function showSeriesPosSample(track, sample, opts = {}) {
      if (!map || !track || !sample) return;
      if (selectedTrackId !== track.id || !shouldShowTrack(track)) {
        clearPrimarySeriesPosMarker();
        return;
      }
      if (sample.lat == null || sample.lon == null || !Number.isFinite(sample.lat) || !Number.isFinite(sample.lon)) {
        clearPrimarySeriesPosMarker();
        return;
      }
      const ll = [sample.lat, sample.lon];
      const accent = compareActive
        ? compareTrackColor(track.id)
        : (css("--accent") || "#2563EB");
      const tipOpts = compareActive ? { trackLabel: compareTrackPosLabel(track) } : {};
      const tipIdx = sample.i0;
      const needTip = opts.forceTip || tipIdx !== seriesPlay.lastTipIdx;
      if (seriesPosMarker) {
        seriesPosMarker.setLatLng(ll);
        if (needTip) {
          const root = seriesPosMarker.getElement()?.querySelector?.(".series-pos-pin");
          if (root) root.innerHTML = seriesPosPinInnerHtml(sample, accent, tipOpts);
        }
      } else {
        const pin = document.createElement("div");
        pin.className = "series-pos-pin";
        pin.innerHTML = seriesPosPinInnerHtml(sample, accent, tipOpts);
        seriesPosMarker = L.marker(ll, {
          interactive: false,
          keyboard: false,
          zIndexOffset: 800,
          icon: L.divIcon({
            className: "series-pos-divicon",
            html: pin.outerHTML,
            iconSize: [0, 0],
            iconAnchor: [0, 0],
          }),
        }).addTo(map);
        seriesPlay.lastTipIdx = tipIdx;
      }
      if (needTip) seriesPlay.lastTipIdx = tipIdx;

      if (in3dMode && map3d && map3dReady) {
        const alt = seriesAltForSample(track, sample);
        seriesPos3dState = { lng: sample.lon, lat: sample.lat, alt, accent };
        clearSeriesPos3dBead();
        // 对比模式由 showCompareExtraPosMarkers 统一挂多珠；单轨仍用单珠
        if (!compareActive) {
          selectedTrack3dLineLayer?.setHoverPoint?.(sample.lon, sample.lat, alt, accent);
        }
        if (!seriesPos3dEl) {
          seriesPos3dEl = document.createElement("div");
          seriesPos3dEl.className = "series-pos-pin series-pos-3d-pin";
          seriesPos3dEl.innerHTML = seriesPosPinInnerHtml(sample, accent, tipOpts);
          const host = map3d.getCanvasContainer() || map3d.getContainer();
          host.appendChild(seriesPos3dEl);
        } else if (needTip) {
          seriesPos3dEl.innerHTML = seriesPosPinInnerHtml(sample, accent, tipOpts);
        }
        ensureSeriesPos3dRenderHook();
        updateSeriesPos3dPinScreen();
      } else if (!compareActive) {
        clearSeriesPos3dMarker();
      }
    }

    function showSeriesPosMarker(track, dataIndex) {
      if (!map || !track) return;
      if (selectedTrackId !== track.id || !shouldShowTrack(track)) {
        clearPrimarySeriesPosMarker();
        return;
      }
      const sample = seriesInterpAtTime(track, Number(track.series?.t_min?.[dataIndex]) || 0);
      if (!sample) {
        clearPrimarySeriesPosMarker();
        return;
      }
      // 悬停时贴齐离散点
      sample.i0 = dataIndex;
      sample.i1 = dataIndex;
      sample.u = 0;
      sample.t = Number(track.series?.t_min?.[dataIndex]) || sample.t;
      sample.height_m = track.series?.height_m?.[dataIndex] != null
        ? Number(track.series.height_m[dataIndex]) : sample.height_m;
      sample.speed_kmh = track.series?.speed_kmh?.[dataIndex] != null
        ? Number(track.series.speed_kmh[dataIndex]) : sample.speed_kmh;
      sample.distance_km = track.series?.distance_km?.[dataIndex] != null
        ? Number(track.series.distance_km[dataIndex]) : sample.distance_km;
      const ll = seriesPointLatLng(track, dataIndex);
      if (ll) {
        sample.lat = ll[0];
        sample.lon = ll[1];
      }
      seriesPlay.lastTipIdx = -1;
      showSeriesPosSample(track, sample, { forceTip: true });
    }

    function updateSeriesPlayUi() {
      const playBtn = document.getElementById("btn-series-play");
      const pauseBtn = document.getElementById("btn-series-pause");
      const timeEl = document.getElementById("series-play-time");
      const bar = document.getElementById("series-play-bar");
      const track = seriesChartTrack;
      const canPlay = !!(track?.series?.t_min?.length >= 2);
      if (bar) bar.hidden = !canPlay;
      if (playBtn) playBtn.hidden = !canPlay || seriesPlay.playing;
      if (pauseBtn) pauseBtn.hidden = !canPlay || !seriesPlay.playing;
      if (timeEl && track) {
        const tMax = seriesPlayTMax(track);
        const tNow = seriesPlay.cursorVisible ? seriesPlay.tCursor : 0;
        timeEl.textContent = `T+${tNow.toFixed(2)} / ${tMax.toFixed(1)} min`;
      }
    }

    function updateSeriesPlayCursorDom() {
      const el = document.getElementById("series-play-cursor");
      if (!el) return;
      if (!trackSeriesChart || !seriesPlay.cursorVisible || !seriesChartTrack) {
        el.hidden = true;
        return;
      }
      const { top, bottom } = trackSeriesChart.chartArea || {};
      if (top == null || bottom == null) {
        el.hidden = true;
        return;
      }
      let x = null;
      const xScale = trackSeriesChart.scales?.x;
      // 线性时间轴（对比图）：按 tCursor 取像素；category 轴（单轨 labels）不能把时间值当索引传给 getPixelForValue
      const useLinearTime = xScale?.type === "linear"
        && typeof xScale.getPixelForValue === "function"
        && Number.isFinite(seriesPlay.tCursor);
      if (useLinearTime) {
        x = xScale.getPixelForValue(seriesPlay.tCursor);
      } else {
        const meta = trackSeriesChart.getDatasetMeta(0);
        const pts = meta?.data;
        if (pts?.length) {
          const i0 = Math.max(0, Math.min(pts.length - 1, seriesPlay.index | 0));
          const i1 = Math.min(pts.length - 1, i0 + 1);
          const p0 = pts[i0];
          const p1 = pts[i1];
          if (p0 && typeof p0.x === "number") {
            const u = i0 === i1 ? 0 : (Number(seriesPlay.frac) || 0);
            x = p0.x + ((p1?.x ?? p0.x) - p0.x) * u;
          }
        }
      }
      if (x == null || !Number.isFinite(x)) {
        el.hidden = true;
        return;
      }
      const canvas = trackSeriesChart.canvas;
      const chartBox = canvas?.parentElement;
      // 相对 .track-series-chart：用 canvas 相对父级的偏移 + Chart 内部 CSS 像素
      const leftBase = canvas && chartBox ? canvas.offsetLeft : 0;
      const topBase = canvas && chartBox ? canvas.offsetTop : 0;
      el.hidden = false;
      el.style.left = `${leftBase + x}px`;
      el.style.top = `${topBase + top}px`;
      el.style.height = `${Math.max(0, bottom - top)}px`;
    }

    function refreshSeriesPlayCursor(opts = {}) {
      if (!seriesChartTrack && !compareActive) return;
      const track = seriesChartTrack
        || (compareActive ? getCompareTracks().find((t) => t.id === selectedTrackId) : null)
        || (compareActive ? getCompareTracks()[0] : null);
      if (!track) return;
      const sample = seriesInterpAtTime(track, seriesPlay.tCursor);
      if (sample) {
        seriesPlay.index = sample.i0;
        seriesPlay.frac = sample.u;
        if (seriesChartTrack) showSeriesPosSample(seriesChartTrack, sample, opts);
        else showSeriesPosSample(track, sample, opts);
      }
      if (compareActive) showCompareExtraPosMarkers(seriesPlay.tCursor, opts);
      updateSeriesPlayUi();
      updateSeriesPlayCursorDom();
    }

    function seekSeriesPlay(index, opts = {}) {
      const track = seriesChartTrack;
      if (!track?.series?.t_min?.length) return;
      const n = track.series.t_min.length;
      const idx = Math.max(0, Math.min(n - 1, Number(index) || 0));
      const t = Number(track.series.t_min[idx]);
      seriesPlay.tCursor = Number.isFinite(t) ? t : 0;
      seriesPlay.index = idx;
      seriesPlay.frac = 0;
      seriesPlay.cursorVisible = true;
      seriesPlay.lastTipIdx = -1;
      if (!opts.keepPlaying && seriesPlay.playing) stopSeriesPlay();
      refreshSeriesPlayCursor({ forceTip: true });
    }

    function stopSeriesPlay() {
      seriesPlay.playing = false;
      seriesPlay.lastTs = 0;
      if (seriesPlay.raf) {
        cancelAnimationFrame(seriesPlay.raf);
        seriesPlay.raf = 0;
      }
      updateSeriesPlayUi();
    }

    function seriesPlayTick(ts) {
      if (!seriesPlay.playing || !seriesChartTrack?.series?.t_min?.length) {
        stopSeriesPlay();
        return;
      }
      if (!seriesPlay.lastTs) seriesPlay.lastTs = ts;
      const dt = Math.min(0.05, (ts - seriesPlay.lastTs) / 1000);
      seriesPlay.lastTs = ts;
      const rate = Number(seriesPlay.rate) || 3;
      seriesPlay.tCursor += dt * rate;
      const tMax = seriesPlayTMax(seriesChartTrack);
      if (seriesPlay.tCursor >= tMax) {
        seriesPlay.tCursor = tMax;
        refreshSeriesPlayCursor();
        stopSeriesPlay();
        return;
      }
      refreshSeriesPlayCursor();
      seriesPlay.raf = requestAnimationFrame(seriesPlayTick);
    }

    function startSeriesPlay() {
      const track = seriesChartTrack;
      if (!track?.series?.t_min?.length || track.series.t_min.length < 2) return;
      const tMax = seriesPlayTMax(track);
      if (seriesPlay.tCursor >= tMax - 1e-6) {
        seriesPlay.tCursor = Number(track.series.t_min[0]) || 0;
        seriesPlay.index = 0;
        seriesPlay.frac = 0;
        seriesPlay.lastTipIdx = -1;
      }
      seriesPlay.playing = true;
      seriesPlay.cursorVisible = true;
      seriesPlay.lastTs = 0;
      updateSeriesPlayUi();
      refreshSeriesPlayCursor({ forceTip: true });
      seriesPlay.raf = requestAnimationFrame(seriesPlayTick);
    }

    function toggleSeriesPlay() {
      if (seriesPlay.playing) stopSeriesPlay();
      else startSeriesPlay();
    }

    function hideTrackSeriesPanel() {
      const legend = document.getElementById("track-series-legend");
      if (legend) legend.innerHTML = "";
      const metricEl = document.getElementById("series-metric-toggles");
      if (metricEl) metricEl.hidden = true;
      stopSeriesPlay();
      seriesPlay.cursorVisible = false;
      seriesPlay.lastTipIdx = -1;
      clearSeriesPosMarker();
      seriesChartTrack = null;
      if (trackSeriesChart) {
        trackSeriesChart.destroy();
        trackSeriesChart = null;
      }
      const bar = document.getElementById("series-play-bar");
      if (bar) bar.hidden = true;
      const cursor = document.getElementById("series-play-cursor");
      if (cursor) cursor.hidden = true;
      undockTrackSeriesDrawer();
    }

    function bindTrackSeriesLegend(colors) {
      const legend = document.getElementById("track-series-legend");
      if (!legend || !trackSeriesChart) return;
      const items = trackSeriesChart.data.datasets.map((ds, i) => ({
        index: i,
        label: ds.label,
        color: colors[i] || ds.borderColor,
        checked: trackSeriesChart.isDatasetVisible(i),
      }));
      legend.innerHTML = items.map(item => `
        <label>
          <input type="checkbox" data-ds="${item.index}" ${item.checked ? "checked" : ""} />
          <span class="track-series-swatch" style="background:${item.color}"></span>
          <span>${item.label}</span>
        </label>
      `).join("");
      legend.querySelectorAll("input[type=checkbox]").forEach(input => {
        input.addEventListener("change", () => {
          const idx = Number(input.dataset.ds);
          trackSeriesChart.setDatasetVisibility(idx, input.checked);
          trackSeriesChart.update();
        });
      });
    }

    function renderTrackSeriesChart(track) {
      const panel = document.getElementById("track-series-panel");
      const titleEl = document.getElementById("track-series-title");
      const metaEl = document.getElementById("track-series-meta");
      const canvas = document.getElementById("chart-track-series");
      const legend = document.getElementById("track-series-legend");
      const metricEl = document.getElementById("series-metric-toggles");
      if (!panel || !canvas) return;
      if (metricEl) metricEl.hidden = true;

      const series = track?.series;
      titleEl.textContent = `飞行 #${track.id} · 时序曲线`;
      const st = seriesSummaryStats(track);
      const bits = [
        track.task_name || null,
        track.factory || null,
        st.duration_min != null ? `${st.duration_min} min` : null,
        st.distance_km != null ? `${Number(st.distance_km).toFixed(1)} km` : null,
        st.max_height_m != null ? `最高 ${st.max_height_m} m` : null,
        st.max_speed_kmh != null ? `最快 ${st.max_speed_kmh} km/h` : null,
      ].filter(Boolean);
      metaEl.textContent = bits.join(" · ");

      if (!series || !series.t_min || series.t_min.length < 2) {
        clearSeriesPosMarker();
        seriesChartTrack = null;
        if (trackSeriesChart) {
          trackSeriesChart.destroy();
          trackSeriesChart = null;
        }
        if (legend) legend.innerHTML = "";
        metaEl.textContent = (bits.length ? bits.join(" · ") + " · " : "") + "暂无时序数据";
        updateSeriesPlayUi();
        openTrackSeriesDrawer();
        return;
      }

      if (typeof Chart === "undefined") {
        metaEl.textContent = "Chart.js 未加载，无法绘制时序图";
        openTrackSeriesDrawer();
        return;
      }

      seriesChartTrack = track;
      stopSeriesPlay();
      seriesPlay.index = 0;
      seriesPlay.frac = 0;
      seriesPlay.tCursor = Number(track.series?.t_min?.[0]) || 0;
      seriesPlay.cursorVisible = true;
      seriesPlay.lastTipIdx = -1;
      clearSeriesPosMarker();
      const labels = series.t_min.map(v => (v == null ? "" : Number(v).toFixed(1)));
      const isDark = document.documentElement.dataset.theme === "linear";
      const c1 = isDark ? "#60A5FA" : "#2563EB";
      const c2 = isDark ? "#FBBF24" : "#EA580C";
      const c3 = isDark ? "#34D399" : "#059669";
      const seriesColors = [c1, c2, c3];
      const muted = css("--muted") || "#86909C";
      const grid = isDark ? "rgba(255,255,255,0.06)" : (css("--border") || "#E5E6EB");
      const fontFamily = "'Inter','Noto Sans SC',sans-serif";

      if (trackSeriesChart) trackSeriesChart.destroy();
      trackSeriesChart = new Chart(canvas, {
        type: "line",
        data: {
          labels,
          datasets: [
            {
              label: "高度 (m)",
              data: series.height_m,
              borderColor: c1,
              backgroundColor: "transparent",
              fill: false,
              borderWidth: 2,
              pointRadius: 2,
              pointHoverRadius: 6,
              pointHoverBorderWidth: 2,
              pointHoverBorderColor: "#fff",
              pointBackgroundColor: c1,
              tension: 0.35,
              yAxisID: "yH",
            },
            {
              label: "速度 (km/h)",
              data: series.speed_kmh,
              borderColor: c2,
              backgroundColor: "transparent",
              fill: false,
              borderWidth: 2,
              pointRadius: 2,
              pointHoverRadius: 6,
              pointHoverBorderWidth: 2,
              pointHoverBorderColor: "#fff",
              pointBackgroundColor: c2,
              tension: 0.35,
              yAxisID: "yV",
            },
            {
              label: "累计距离 (km)",
              data: series.distance_km,
              borderColor: c3,
              backgroundColor: "transparent",
              fill: false,
              borderWidth: 2,
              pointRadius: 2,
              pointHoverRadius: 6,
              pointHoverBorderWidth: 2,
              pointHoverBorderColor: "#fff",
              pointBackgroundColor: c3,
              tension: 0.35,
              yAxisID: "yD",
            },
          ],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: { duration: 0 },
          interaction: { mode: "index", intersect: false },
          layout: { padding: { left: 4, right: 8, top: 2, bottom: 0 } },
          onHover(_evt, elements) {
            if (seriesPlay.playing) return;
            if (!elements?.length || !seriesChartTrack) {
              if (!seriesPlay.cursorVisible) clearSeriesPosMarker();
              return;
            }
            seekSeriesPlay(elements[0].index, { keepPlaying: false });
          },
          onClick(_evt, elements) {
            if (!elements?.length) return;
            seekSeriesPlay(elements[0].index, { keepPlaying: seriesPlay.playing });
          },
          plugins: {
            legend: { display: false },
            tooltip: {
              enabled: true,
              titleFont: { family: fontFamily, size: 11 },
              bodyFont: { family: fontFamily, size: 11 },
              footerFont: { family: fontFamily, size: 10 },
              callbacks: {
                title(items) {
                  const v = items?.[0]?.label;
                  return v ? `起飞后 ${v} 分钟` : "";
                },
                footer(items) {
                  const idx = items?.[0]?.dataIndex;
                  const ll = seriesPointLatLng(seriesChartTrack, idx);
                  if (!ll) return "";
                  return `位置 ${ll[0].toFixed(5)}, ${ll[1].toFixed(5)}`;
                },
              },
            },
          },
          scales: {
            x: {
              title: {
                display: true,
                text: "时间（分钟）",
                color: muted,
                font: { family: fontFamily, size: 10 },
              },
              ticks: {
                maxTicksLimit: 10,
                maxRotation: 0,
                color: muted,
                font: { family: fontFamily, size: 9 },
              },
              grid: { color: grid },
            },
            yH: {
              type: "linear",
              position: "left",
              title: {
                display: true,
                text: "高度 m",
                color: muted,
                font: { family: fontFamily, size: 10 },
              },
              ticks: { color: muted, font: { family: fontFamily, size: 9 }, maxTicksLimit: 6 },
              grid: { color: grid },
            },
            yV: {
              type: "linear",
              position: "right",
              title: {
                display: true,
                text: "速度 km/h",
                color: muted,
                font: { family: fontFamily, size: 10 },
              },
              ticks: { color: muted, font: { family: fontFamily, size: 9 }, maxTicksLimit: 6 },
              grid: { drawOnChartArea: false },
            },
            yD: {
              type: "linear",
              position: "right",
              offset: true,
              title: {
                display: true,
                text: "距离 km",
                color: muted,
                font: { family: fontFamily, size: 10 },
              },
              ticks: { color: muted, font: { family: fontFamily, size: 9 }, maxTicksLimit: 6 },
              grid: { drawOnChartArea: false },
            },
          },
        },
      });
      if (!canvas.dataset.seriesLeaveBound) {
        canvas.dataset.seriesLeaveBound = "1";
        canvas.addEventListener("mouseleave", () => {
          if (!seriesPlay.playing && !seriesPlay.cursorVisible) clearSeriesPosMarker();
          else if (!seriesPlay.playing && seriesPlay.cursorVisible) refreshSeriesPlayCursor({ forceTip: true });
        });
      }
      bindTrackSeriesLegend(seriesColors);
      updateSeriesPlayUi();
      openTrackSeriesDrawer({
        onOpened: () => {
          if (seriesChartTrack === track) seekSeriesPlay(0);
        },
      });
    }

    function compareMetricLabel(metric) {
      if (metric === "speed") return "速度 (km/h)";
      if (metric === "distance") return "累计距离 (km)";
      return "高度 (m)";
    }

    function compareMetricSeries(track, metric) {
      const s = track?.series;
      if (!s?.t_min?.length) return null;
      if (metric === "speed") return s.speed_kmh;
      if (metric === "distance") return s.distance_km;
      return s.height_m;
    }

    function seekSeriesPlayByTime(tMin, opts = {}) {
      const track = seriesChartTrack;
      if (!track?.series?.t_min?.length) return;
      const t = Number(tMin);
      seriesPlay.tCursor = Number.isFinite(t) ? t : 0;
      const sample = seriesInterpAtTime(track, seriesPlay.tCursor);
      seriesPlay.index = sample?.i0 ?? 0;
      seriesPlay.frac = sample?.u ?? 0;
      seriesPlay.cursorVisible = true;
      seriesPlay.lastTipIdx = -1;
      if (!opts.keepPlaying && seriesPlay.playing) stopSeriesPlay();
      refreshSeriesPlayCursor({ forceTip: true });
    }

    function renderCompareSeriesChart() {
      const panel = document.getElementById("track-series-panel");
      const titleEl = document.getElementById("track-series-title");
      const metaEl = document.getElementById("track-series-meta");
      const canvas = document.getElementById("chart-track-series");
      const legend = document.getElementById("track-series-legend");
      const metricEl = document.getElementById("series-metric-toggles");
      if (!panel || !canvas) return;

      const tracks = getCompareTracks();
      if (metricEl) {
        metricEl.hidden = false;
        metricEl.querySelectorAll(".filter-btn").forEach((btn) => {
          btn.classList.toggle("active", btn.dataset.metric === compareMetric);
        });
      }
      titleEl.textContent = `多轨对比 · ${tracks.length} 条`;
      const withSeries = tracks.filter((t) => t.series?.t_min?.length >= 2);
      const skipped = tracks.length - withSeries.length;
      metaEl.textContent = [
        compareMetricLabel(compareMetric),
        skipped > 0 ? `${skipped} 条无时序（仅摘要）` : null,
        compareTrackIds.length ? `#${compareTrackIds.join(" / #")}` : null,
      ].filter(Boolean).join(" · ");

      if (!withSeries.length) {
        clearSeriesPosMarker();
        seriesChartTrack = tracks.find((t) => t.id === selectedTrackId) || tracks[0] || null;
        if (trackSeriesChart) {
          trackSeriesChart.destroy();
          trackSeriesChart = null;
        }
        if (legend) legend.innerHTML = "";
        updateSeriesPlayUi();
        openTrackSeriesDrawer();
        return;
      }

      if (typeof Chart === "undefined") {
        metaEl.textContent = "Chart.js 未加载，无法绘制时序图";
        openTrackSeriesDrawer();
        return;
      }

      const focus = tracks.find((t) => t.id === selectedTrackId) || withSeries[0];
      seriesChartTrack = focus?.series?.t_min?.length >= 2
        ? focus
        : withSeries[0];
      stopSeriesPlay();
      seriesPlay.index = 0;
      seriesPlay.frac = 0;
      seriesPlay.tCursor = Number(seriesChartTrack.series?.t_min?.[0]) || 0;
      seriesPlay.cursorVisible = true;
      seriesPlay.lastTipIdx = -1;
      clearSeriesPosMarker();

      const isDark = document.documentElement.dataset.theme === "linear";
      const muted = css("--muted") || "#86909C";
      const grid = isDark ? "rgba(255,255,255,0.06)" : (css("--border") || "#E5E6EB");
      const fontFamily = "'Inter','Noto Sans SC',sans-serif";
      const yTitle = compareMetricLabel(compareMetric);
      const colors = [];
      const datasets = withSeries.map((t) => {
        const color = compareTrackColor(t.id);
        colors.push(color);
        const ys = compareMetricSeries(t, compareMetric) || [];
        const data = [];
        for (let i = 0; i < t.series.t_min.length; i++) {
          const x = Number(t.series.t_min[i]);
          const y = ys[i] != null ? Number(ys[i]) : null;
          if (!Number.isFinite(x)) continue;
          data.push({ x, y: Number.isFinite(y) ? y : null });
        }
        return {
          label: `#${t.id}${t.factory ? " · " + t.factory : ""}`,
          data,
          borderColor: color,
          backgroundColor: "transparent",
          fill: false,
          borderWidth: 2.5,
          pointRadius: 0,
          pointHoverRadius: 5,
          pointHoverBorderWidth: 2,
          pointHoverBorderColor: "#fff",
          pointBackgroundColor: color,
          tension: 0.25,
          spanGaps: true,
        };
      });

      if (trackSeriesChart) trackSeriesChart.destroy();
      trackSeriesChart = new Chart(canvas, {
        type: "line",
        data: { datasets },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: { duration: 0 },
          parsing: false,
          interaction: { mode: "nearest", axis: "x", intersect: false },
          layout: { padding: { left: 4, right: 8, top: 2, bottom: 0 } },
          onHover(_evt, elements) {
            if (seriesPlay.playing) return;
            if (!elements?.length || !seriesChartTrack) {
              if (!seriesPlay.cursorVisible) clearSeriesPosMarker();
              return;
            }
            const ds = trackSeriesChart.data.datasets[elements[0].datasetIndex];
            const pt = ds?.data?.[elements[0].index];
            if (pt && Number.isFinite(pt.x)) seekSeriesPlayByTime(pt.x, { keepPlaying: false });
          },
          onClick(_evt, elements) {
            if (!elements?.length) return;
            const ds = trackSeriesChart.data.datasets[elements[0].datasetIndex];
            const pt = ds?.data?.[elements[0].index];
            if (pt && Number.isFinite(pt.x)) {
              seekSeriesPlayByTime(pt.x, { keepPlaying: seriesPlay.playing });
            }
          },
          plugins: {
            legend: { display: false },
            tooltip: {
              enabled: true,
              titleFont: { family: fontFamily, size: 11 },
              bodyFont: { family: fontFamily, size: 11 },
              callbacks: {
                title(items) {
                  const x = items?.[0]?.parsed?.x;
                  return Number.isFinite(x) ? `起飞后 ${Number(x).toFixed(1)} 分钟` : "";
                },
              },
            },
          },
          scales: {
            x: {
              type: "linear",
              title: {
                display: true,
                text: "时间（分钟）",
                color: muted,
                font: { family: fontFamily, size: 10 },
              },
              ticks: {
                maxTicksLimit: 10,
