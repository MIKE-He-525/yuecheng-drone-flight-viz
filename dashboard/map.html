<!DOCTYPE html>
<html lang="zh-CN" data-theme="saas">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>空间地图 · 越城区无人机飞行服务</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" crossorigin="" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js" crossorigin=""></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style data-scope="map-standalone">
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; transition: background 0.35s, color 0.35s;
    }
    [data-theme="claude"] {
      --bg: #F4F1EA; --surface: #FAF9F5; --heading: #191919; --text: #191919;
      --muted: #B1ADA1; --border: #E0DDD4; --accent: #C15F3C; --accent-text: #FAF9F5;
      --accent-soft: rgba(193, 95, 60, 0.12); --shadow: 0 2px 12px rgba(25,25,25,0.06);
      --radius: 10px; --radius-sm: 8px;
    }
    [data-theme="material"] {
      --bg: #F8F9FA; --surface: #FFFFFF; --heading: #202124; --text: #202124;
      --muted: #5F6368; --border: #E8EAED; --accent: #1A73E8; --accent-text: #FFFFFF;
      --accent-soft: rgba(26,115,232,0.10); --shadow: 0 2px 12px rgba(26,115,232,0.08);
      --radius: 16px; --radius-sm: 12px;
    }
    [data-theme="vercel"] {
      --bg: #FFFFFF; --surface: #FAFAFA; --heading: #171717; --text: #171717;
      --muted: #666; --border: #EBEBEB; --accent: #171717; --accent-text: #FFFFFF;
      --accent-soft: #F5F5F5; --shadow: none; --radius: 6px; --radius-sm: 4px;
    }
    [data-theme="linear"] {
      --bg: #121316; --surface: #1C1D20; --heading: #F4F5F8; --text: #E8E9ED;
      --muted: #8A8F98; --border: rgba(255,255,255,0.06); --accent: #5E6AD2; --accent-text: #FFF;
      --accent-soft: rgba(94,106,210,0.15); --shadow: 0 4px 24px rgba(0,0,0,0.4);
      --radius: 12px; --radius-sm: 8px;
    }
    [data-theme="saas"] {
      --bg: #F5F7FA; --surface: #FFFFFF; --heading: #1D2129; --text: #4E5969;
      --muted: #86909C; --border: #E5E6EB; --accent: #165DFF; --accent-text: #FFFFFF;
      --accent-soft: rgba(22,93,255,0.08); --shadow: 0 2px 8px rgba(0,0,0,0.06);
      --radius: 10px; --radius-sm: 8px;
    }
  </style>
  <link rel="stylesheet" href="map_section.css" data-scope="map-section" />
</head>
<body>
  <!-- map.html：空间地图区块模板。样式见 map_section.css；数据来自 map_data.json（本页 fetch），或由 build_dashboard.py 内嵌注入 dashboard。 -->
  <section id="section-map" class="map-section">
    <div class="map-section-header">
      <div class="map-section-header-main">
        <h2>空间地图</h2>
        <p class="sub" id="map-status">加载中…</p>
      </div>
      <p class="map-term-note" role="note">
        <strong>数据说明：</strong>橙线为行政区划（统计用），<strong>≠</strong>法定空域/管制空域；
        「行政区内轨迹」按点占比 ≥50% 筛选，不代表可飞或已获许可。
      </p>
    </div>
  <div class="layout">
    <aside class="track-rail">
      <div class="track-rail-filters">
        <div class="panel panel-filters">
          <h3>轨迹筛选 <span class="filter-count-badge" id="filter-count-badge">—</span></h3>

          <div class="filter-section">
            <div class="filter-label">厂商</div>
            <div class="filter-row" id="factory-filters"></div>
          </div>

          <div class="filter-section">
            <div class="filter-label">任务类型</div>
            <div class="filter-row" id="flytype-filters"></div>
          </div>

          <div class="filter-section">
            <div class="filter-label">
              <span>起飞时间</span>
              <span class="range-values" id="filter-date-values">—</span>
            </div>
            <div class="dual-range">
              <div class="range-track"><div class="range-fill" id="filter-date-fill"></div></div>
              <input type="range" id="filter-date-min" class="range-min" />
              <input type="range" id="filter-date-max" class="range-max" />
            </div>
          </div>

          <div class="filter-section">
            <div class="filter-label">
              <span>飞行时长（分钟）</span>
              <span class="range-values" id="filter-duration-values">—</span>
            </div>
            <div class="dual-range">
              <div class="range-track"><div class="range-fill" id="filter-duration-fill"></div></div>
              <input type="range" id="filter-duration-min" class="range-min" />
              <input type="range" id="filter-duration-max" class="range-max" />
            </div>
          </div>

          <div class="filter-section">
            <div class="filter-label">
              <span>飞行距离（km）</span>
              <span class="range-values" id="filter-distance-values">—</span>
            </div>
            <div class="dual-range">
              <div class="range-track"><div class="range-fill" id="filter-distance-fill"></div></div>
              <input type="range" id="filter-distance-min" class="range-min" />
              <input type="range" id="filter-distance-max" class="range-max" />
            </div>
          </div>

          <div class="filter-section">
            <div class="filter-label">
              <span>飞行轨迹最大高度（m）</span>
              <span class="range-values" id="filter-height-values">—</span>
            </div>
            <div class="dual-range">
              <div class="range-track"><div class="range-fill" id="filter-height-fill"></div></div>
              <input type="range" id="filter-height-min" class="range-min" />
              <input type="range" id="filter-height-max" class="range-max" />
            </div>
          </div>

          <div class="filter-section">
            <div class="filter-label">
              <span>飞行最大速度（km/h）</span>
              <span class="range-values" id="filter-speed-values">—</span>
            </div>
            <div class="dual-range">
              <div class="range-track"><div class="range-fill" id="filter-speed-fill"></div></div>
              <input type="range" id="filter-speed-min" class="range-min" />
              <input type="range" id="filter-speed-max" class="range-max" />
            </div>
          </div>

          <div class="filter-actions">
            <button type="button" id="btn-reset-filters" class="primary">重置筛选</button>
          </div>
        </div>
      </div>

      <div class="filter-status" id="filter-status">
        <span id="filter-status-text">调整筛选条件以缩小结果集</span>
        <div class="filter-status-chips" id="filter-status-chips"></div>
      </div>

      <div class="track-list-section">
        <div class="track-rail-header">
          <h2>筛选结果 <span class="filter-count-badge" id="list-count-badge">—</span></h2>
          <p id="track-list-meta">点击选中 · 可加入对比</p>
          <div class="track-actions">
            <button type="button" class="filter-btn" id="btn-show-series">显示时序图</button>
            <button type="button" class="filter-btn" id="btn-solo-track">仅看此条</button>
            <button type="button" class="filter-btn" id="btn-add-compare">加入对比</button>
            <button type="button" class="filter-btn" id="btn-exit-compare">退出对比</button>
            <button type="button" class="filter-btn" id="btn-clear-selection">取消选中</button>
          </div>
        </div>
        <div class="list-toolbar">
          <input type="search" id="track-search" placeholder="搜索 ID / 任务名 / 机场 / 机库SN / 任务ID / 无人机SN" />
          <select id="track-sort" title="排序">
            <option value="points">点数</option>
            <option value="duration">时长</option>
            <option value="distance">距离</option>
          </select>
        </div>
        <div class="track-list" id="track-list"></div>
      </div>
    </aside>

    <div class="map-column">
      <div class="layer-bar" role="toolbar" aria-label="图层控制">
        <span class="layer-bar-title">图层控制</span>
        <div class="layer-list">
          <label><input type="checkbox" id="layer-airports" /> 机场点位（全部）</label>
          <label><input type="checkbox" id="layer-coverage" /> 机场覆盖半径</label>
          <label><input type="checkbox" id="layer-tracks" checked /> 飞行轨迹</label>
          <label><input type="checkbox" id="layer-district" checked /> 显示越城区行政区划</label>
          <label><input type="checkbox" id="layer-region-only" /> 仅显示行政区内轨迹</label>
          <label><input type="checkbox" id="layer-view-3d" /> 3D 视图</label>
          <label><input type="checkbox" id="layer-terrain" checked /> 地形</label>
          <label><input type="checkbox" id="layer-buildings-3d" checked /> 立体建筑</label>
        </div>
        <button type="button" class="filter-btn" id="btn-reset-view">重置默认视野</button>
      </div>
      <main class="map-wrap">
        <div id="map"></div>
        <div id="map3d" aria-hidden="true"></div>
        <aside id="map3d-track-info" class="map3d-track-info" hidden aria-live="polite">
          <strong id="map3d-track-info-title" class="map3d-track-info-title">轨迹详情</strong>
          <dl id="map3d-track-info-body" class="map3d-track-info-body"></dl>
          <p id="map3d-track-info-hint" class="map3d-track-info-hint" hidden></p>
        </aside>
        <p id="map3d-hint" class="map3d-hint" hidden role="status"></p>
        <div class="map-legend">
          <strong style="font-size:0.72rem;color:var(--heading)">图例</strong>
          <div><span class="dot" style="background:#E74C3C"></span>大疆机场/轨迹</div>
          <div><span class="dot" style="background:#3498DB"></span>一电机场/轨迹</div>
          <div><span class="dot" style="background:#2ECC71"></span>纵横机场/轨迹</div>
          <div><span class="line-sample" style="background:transparent;border:2px solid #E67E22;height:0"></span>越城区行政区划</div>
          <div><span class="line-sample" style="background:#95A5A6"></span>无记录关联轨迹</div>
        </div>
      </main>
      <div id="track-series-panel" class="track-series-panel" aria-live="polite" aria-hidden="true">
        <button type="button" class="series-drawer-toggle" id="btn-toggle-series" aria-expanded="false" aria-controls="track-series-drawer-body" title="展开时序图">
          <span class="series-drawer-chevron" aria-hidden="true"></span>
        </button>
        <div id="track-series-drawer-body" class="track-series-drawer-body">
          <div class="track-series-header">
            <div class="header-left">
              <h3 id="track-series-title">轨迹时序</h3>
              <span class="series-meta" id="track-series-meta"></span>
            </div>
            <div class="series-metric-toggles" id="series-metric-toggles" hidden>
              <button type="button" class="filter-btn active" data-metric="height">高度</button>
              <button type="button" class="filter-btn" data-metric="speed">速度</button>
              <button type="button" class="filter-btn" data-metric="distance">距离</button>
            </div>
          </div>
          <div class="track-series-body">
            <aside class="track-series-legend panel">
              <div class="series-play-bar" id="series-play-bar" hidden>
                <button type="button" class="series-play-btn" id="btn-series-play" aria-label="播放">播放</button>
                <button type="button" class="series-play-btn" id="btn-series-pause" aria-label="暂停" hidden>暂停</button>
                <label class="series-play-rate-label">
                  倍速
                  <select id="series-play-rate" aria-label="播放倍速">
                    <option value="1">1×</option>
                    <option value="3" selected>3×</option>
                    <option value="10">10×</option>
                    <option value="30">30×</option>
                  </select>
                </label>
                <span class="series-play-time" id="series-play-time">T+0.0 / 0.0 min</span>
              </div>
              <h3>图例</h3>
              <div class="layer-list" id="track-series-legend"></div>
            </aside>
            <div class="track-series-chart">
              <canvas id="chart-track-series"></canvas>
              <div class="series-play-cursor" id="series-play-cursor" hidden></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  </section>

  <script>
    /* ========================================================================
     * 全局状态与常量（筛选、选中、3D 开关、seriesPlay 等）
     * ======================================================================== */
    const FACTORY_COLORS = { "大疆": "#E74C3C", "DJ": "#E74C3C", "一电": "#3498DB", "YD": "#3498DB", "纵横": "#2ECC71", "ZH": "#2ECC71", "未知": "#95A5A6" };

    let MAP_DATA = null;
    let map = null;
    let basemapLayer = null;
    let airportLayer = null;
    let coverageLayer = null;
    let trackLayer = null;
    let districtLayer = null;
    let trackPolylines = new Map(); // id -> { line, hit }
    const TRACK_HIT_WEIGHT = 18; // 透明命中层线宽，扩大点选/悬停判定范围
    const COMPARE_MAX = 2;
    const COMPARE_PALETTE = ["#E74C3C", "#3498DB", "#2ECC71", "#F39C12"];
    let selectedTrackId = null;
    let hoverTrackId = null;
    let soloTrackMode = false;
    /** 已点「加入对比」，等待点第二条对比轨。 */
    let comparePickMode = false;
    let compareActive = false;
    let compareTrackIds = [];
    let compareMetric = "height"; // height | speed | distance
    let seriesPosExtraMarkers = new Map(); // trackId -> Leaflet marker（对比副轨 2D）
    let seriesPosExtra3dPins = []; // { trackId, el, state } 对比副轨 3D HTML 圆点
    let trackSearchQuery = "";
    let trackSortKey = "points";
    let filterBounds = null;
    let rangeFiltersBound = false;
    let filterApplyTimer = null;
    let trackSeriesChart = null;
    let seriesChartTrack = null;
    let seriesPlay = {
      playing: false,
      rate: 3,
      tCursor: 0,
      index: 0,
      frac: 0,
      raf: 0,
      lastTs: 0,
      lastTipIdx: -1,
      cursorVisible: false,
    };
    let seriesPosMarker = null;
    let seriesPos3dEl = null;
    let seriesPos3dState = null; // { lng, lat, alt, label, accent }
    let map3d = null;
    let map3dReady = false;
    let in3dMode = false;
    /** 全局偏好：选轨不重置；仅图层开关可改。 */
    let prefer3dView = false;
    let preferTerrain = true;
    let map3dTrackId = null;
    let map3dPopup = null;
    let map3dHoverFeatureId = null;
    let map3dInteractBound = false;
    let selectedTrack3dLineLayer = null;
    const MAP3D_DEFAULT_HEIGHT = 120;
    let trackFilters = {
      factory: "all",
      flyType: "all",
      dateMin: null,
      dateMax: null,
      durationMin: null,
      durationMax: null,
      distanceMin: null,
      distanceMax: null,
      heightMin: null,
      heightMax: null,
      speedMin: null,
      speedMax: null,
    };

    const BASEMAPS = {
      light: {
        url: "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
      },
      dark: {
        url: "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
      },
    };

    /* ========================================================================
     * Leaflet 2D（图层刷新、轨迹命中、筛选/列表）
     * ======================================================================== */

    function applyBasemap(theme) {
      if (!map) return;
      const cfg = theme === "linear" ? BASEMAPS.dark : BASEMAPS.light;
      if (basemapLayer) map.removeLayer(basemapLayer);
      basemapLayer = L.tileLayer(cfg.url, {
        maxZoom: 20,
        subdomains: "abcd",
        attribution: cfg.attribution,
      }).addTo(map);
      applyMap3dBasemap(theme);
    }

    /* ========================================================================
     * MapLibre 3D（DEM+AGL、WebGL 细管、叠层、地形/建筑）
     * ======================================================================== */
    const MAP3D_TERRAIN_EXAGGERATION = 1.0;

    function map3dStyleForTheme(theme) {
      const path = theme === "linear" ? "dark_all" : "light_all";
      return {
        version: 8,
        sources: {
          carto: {
            type: "raster",
            tiles: [
              `https://a.basemaps.cartocdn.com/${path}/{z}/{x}/{y}.png`,
              `https://b.basemaps.cartocdn.com/${path}/{z}/{x}/{y}.png`,
              `https://c.basemaps.cartocdn.com/${path}/{z}/{x}/{y}.png`,
              `https://d.basemaps.cartocdn.com/${path}/{z}/{x}/{y}.png`,
            ],
            tileSize: 256,
            attribution:
              '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
          },
          "terrain-dem": {
            type: "raster-dem",
            tiles: [
              "https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png",
            ],
            tileSize: 256,
            maxzoom: 15,
            encoding: "terrarium",
            attribution: "Terrain © Mapzen / AWS Open Data",
          },
        },
        layers: [{ id: "carto", type: "raster", source: "carto" }],
        terrain: { source: "terrain-dem", exaggeration: MAP3D_TERRAIN_EXAGGERATION },
      };
    }

    /** 启用地形起伏 + 山影 + 天空，让底图本身呈 3D。 */
    function ensureMap3dTerrain() {
      if (!map3d || typeof maplibregl === "undefined") return;
      if (!map3d.getSource("terrain-dem")) {
        map3d.addSource("terrain-dem", {
          type: "raster-dem",
          tiles: [
            "https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png",
          ],
          tileSize: 256,
          maxzoom: 15,
          encoding: "terrarium",
          attribution: "Terrain © Mapzen / AWS Open Data",
        });
      }
      const beforeId = map3d.getLayer("district-3d-fill")
        ? "district-3d-fill"
        : map3d.getLayer("coverage-3d-fill")
          ? "coverage-3d-fill"
          : map3d.getLayer("tracks-3d-line")
            ? "tracks-3d-line"
            : undefined;
      if (!map3d.getLayer("terrain-hillshade")) {
        const layer = {
          id: "terrain-hillshade",
          type: "hillshade",
          source: "terrain-dem",
          paint: {
            "hillshade-exaggeration": 0.5,
            "hillshade-shadow-color": "#1a1a1a",
            "hillshade-highlight-color": "#ffffff",
            "hillshade-accent-color": "#6b6b6b",
          },
        };
        if (beforeId) map3d.addLayer(layer, beforeId);
        else map3d.addLayer(layer);
      }
      setMap3dLayerVisible("terrain-hillshade", preferTerrain);
      if (typeof map3d.setTerrain === "function") {
        if (preferTerrain) {
          map3d.setTerrain({
            source: "terrain-dem",
            exaggeration: MAP3D_TERRAIN_EXAGGERATION,
          });
        } else {
          map3d.setTerrain(null);
        }
      }
      if (typeof map3d.setSky === "function") {
        const dark = document.documentElement.dataset.theme === "linear";
        map3d.setSky(
          dark
            ? {
                "sky-color": "#0b1220",
                "sky-horizon-blend": 0.5,
                "horizon-color": "#1a2332",
                "horizon-fog-blend": 0.6,
                "fog-color": "#121820",
                "fog-ground-blend": 0.35,
              }
            : {
                "sky-color": "#87c4f0",
                "sky-horizon-blend": 0.55,
                "horizon-color": "#e8f2fa",
                "horizon-fog-blend": 0.65,
                "fog-color": "#dce8f2",
                "fog-ground-blend": 0.4,
              }
        );
      }
    }

    /** OpenFreeMap 矢量建筑挤出（minzoom 13）；叠在底图之上、区划/航迹之下。 */
    function ensureMap3dBuildings() {
      if (!map3d || typeof maplibregl === "undefined") return;
      if (!map3d.getSource("openfreemap")) {
        map3d.addSource("openfreemap", {
          type: "vector",
          url: "https://tiles.openfreemap.org/planet",
          attribution:
            '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> © <a href="https://openfreemap.org/">OpenFreeMap</a>',
        });
      }
      const dark = document.documentElement.dataset.theme === "linear";
      // 对比度要够：浅灰贴在 CARTO 上几乎看不见
      const color = dark ? "#8b9bb4" : "#6b7280";
      const opacity = dark ? 0.75 : 0.85;
      const beforeId = map3d.getLayer("district-3d-fill")
        ? "district-3d-fill"
        : (map3d.getLayer("selected-track-3d-line") ? "selected-track-3d-line" : undefined);

      // 无高度标注时给默认 12 m，避免整片建筑挤出高度为 0
      const heightExpr = [
        "case",
        [">", ["to-number", ["coalesce", ["get", "render_height"], 0]], 0],
        ["to-number", ["get", "render_height"]],
        12,
      ];
      const baseExpr = [
        "case",
        [">", ["to-number", ["coalesce", ["get", "render_min_height"], 0]], 0],
        ["to-number", ["get", "render_min_height"]],
        0,
      ];

      if (!map3d.getLayer("buildings-3d")) {
        const layer = {
          id: "buildings-3d",
          source: "openfreemap",
          "source-layer": "building",
          type: "fill-extrusion",
          minzoom: 13,
          filter: ["!=", ["get", "hide_3d"], true],
          paint: {
            "fill-extrusion-color": color,
            "fill-extrusion-opacity": opacity,
            // 不再用 zoom 插值把高度压到 0（选中轨 fitBounds 常停在 14~15）
            "fill-extrusion-height": heightExpr,
            "fill-extrusion-base": baseExpr,
          },
        };
        if (beforeId) map3d.addLayer(layer, beforeId);
        else map3d.addLayer(layer);
      } else {
        map3d.setPaintProperty("buildings-3d", "fill-extrusion-color", color);
        map3d.setPaintProperty("buildings-3d", "fill-extrusion-opacity", opacity);
        map3d.setPaintProperty("buildings-3d", "fill-extrusion-height", heightExpr);
        map3d.setPaintProperty("buildings-3d", "fill-extrusion-base", baseExpr);
      }
      syncMap3dBuildingsVisibility();
    }

    function syncMap3dBuildingsVisibility() {
      const show = !!document.getElementById("layer-buildings-3d")?.checked;
      setMap3dLayerVisible("buildings-3d", show);
    }

    function applyMap3dBasemap(theme) {
      if (!map3d) return;
      const path = theme === "linear" ? "dark_all" : "light_all";
      const tiles = ["a", "b", "c", "d"].map(
        (s) => `https://${s}.basemaps.cartocdn.com/${path}/{z}/{x}/{y}.png`,
      );
      const src = map3d.getSource("carto");
      if (src && typeof src.setTiles === "function") {
        src.setTiles(tiles);
        ensureMap3dTerrain();
        ensureMap3dBuildings();
        return;
      }
      // 样式未就绪或 source 被清掉时整页换肤
      map3d.setStyle(map3dStyleForTheme(theme));
      map3d.once("style.load", () => {
        map3dReady = true;
        selectedTrack3dLineLayer = null;
        ensureMap3dLayers();
        ensureSeriesPos3dLayers();
        ensureMap3dTerrain();
        ensureMap3dBuildings();
        bindMap3dTerrainRebuild();
        setupMap3dInteractions(map3d);
        syncMap3dOverlays();
        if (map3dPendingTrack) {
          updateMap3dGeometry(map3dPendingTrack);
        } else if (map3dTrackId != null && MAP_DATA) {
          const t = MAP_DATA.tracks.find((x) => x.id === map3dTrackId);
          if (t) updateMap3dGeometry(t);
        }
      });
    }

    /** 全高度为 0/null → 3D 示意抬升；图表/弹窗仍用原始 height。 */
    function displayHeightsFor3d(series) {
      const raw = series?.height_m;
      if (!raw?.length) return { heights: [], usedDefault120: false };
      const allZeroOrNull = raw.every((h) => h == null || Number(h) === 0);
      if (allZeroOrNull) {
        return {
          heights: raw.map(() => MAP3D_DEFAULT_HEIGHT),
          usedDefault120: true,
        };
      }
      return {
        heights: raw.map((h) => (h == null || !Number.isFinite(Number(h)) ? 0 : Number(h))),
        usedDefault120: false,
      };
    }

    /** 查询 DEM 海拔（含地形夸张，与建筑 fill-extrusion 同一套）。 */
    function queryMap3dTerrainElevation(lng, lat) {
      if (!map3d || typeof map3d.queryTerrainElevation !== "function") return null;
      try {
        const v = map3d.queryTerrainElevation(
          { lng, lat },
          { exaggerated: true }
        );
        return v == null || !Number.isFinite(Number(v)) ? null : Number(v);
      } catch (_) {
        return null;
      }
    }

    /**
     * 3D 垂直坐标：DEM（含地形夸张）+ AGL，与建筑 fill-extrusion 同口径。
     * 口径：elevation_m 优先作 AGL（−5～800 m）；否则 max(0, height_m − DEM)；
     *       usedDefault120 时 AGL 固定 120 m；无 DEM 时退回海拔 height_m 避免整条贴地。
     * 副作用：只读 map3d.queryTerrainElevation，不改 DOM/图层。
     */
    function absoluteAltitudeFor3d(lon, lat, heightM, elevationM, usedDefault120) {
      const dem = queryMap3dTerrainElevation(lon, lat);
      let agl = null;
      if (usedDefault120) {
        agl = MAP3D_DEFAULT_HEIGHT;
      } else if (elevationM != null && Number.isFinite(Number(elevationM))) {
        const e = Number(elevationM);
        if (e >= -5 && e <= 800) agl = Math.max(0, e);
      }
      if (agl == null) {
        if (heightM != null && Number.isFinite(Number(heightM))) {
          const h = Math.max(0, Number(heightM));
          if (dem != null) agl = Math.max(0, h - dem);
          else return h; // 无 DEM：退回海拔，避免整条贴地
        } else {
          agl = 0;
        }
      }
      return dem != null ? dem + agl : agl;
    }

    function bindMap3dTerrainRebuild() {
      if (!map3d || map3d.__terrainRebuildBound) return;
      map3d.__terrainRebuildBound = true;
      let timer = null;
      const rebuild = () => {
        if (!in3dMode || map3dTrackId == null || !MAP_DATA) return;
        const t = MAP_DATA.tracks.find((x) => x.id === map3dTrackId);
        if (t) updateMap3dGeometry(t);
      };
      map3d.on("sourcedata", (e) => {
        if (e?.sourceId !== "terrain-dem" || !e.isSourceLoaded) return;
        clearTimeout(timer);
        timer = setTimeout(rebuild, 120);
      });
    }

    /**
     * 由选中轨 series 构建 3D 细管线点列（经 densifyTrack3dPoints 加密）。
     * 口径：lon/lat/height 取自 series；绝对高度经 absoluteAltitudeFor3d。
     * 返回 { points, color, usedDefault120, path }；有效点不足 2 个则 null。
     * 副作用：无；不写 map3d（由 updateMap3dGeometry → setTrack 消费）。
     */
    function buildSelectedTrack3dLine(track) {
      const series = track?.series;
      if (!series?.lon?.length || !series?.lat?.length) return null;
      const { heights, usedDefault120 } = displayHeightsFor3d(series);
      const n = Math.min(series.lon.length, series.lat.length, heights.length);
      if (n < 2) return null;
      const color = darkenHex(factoryColor(track), 0.55);
      const rawPts = [];
      const path = [];
      for (let i = 0; i < n; i++) {
        const lon = series.lon[i];
        const lat = series.lat[i];
        if (lon == null || lat == null || !Number.isFinite(lon) || !Number.isFinite(lat)) continue;
        const heightM = Number(heights[i]);
        const elevM = series.elevation_m?.[i];
        const h = absoluteAltitudeFor3d(
          lon,
          lat,
          Number.isFinite(heightM) ? heightM : 0,
          elevM,
          usedDefault120
        );
        rawPts.push({ lon, lat, h: Number.isFinite(h) ? h : 0 });
        path.push([lon, lat]);
      }
      if (rawPts.length < 2) return null;
      const pts = densifyTrack3dPoints(rawPts);
      return { points: pts, color, usedDefault120, path };
    }

    /** 真正的 3D 细线（自定义 WebGL 层）；点列经 Chaikin + Catmull-Rom 加密。 */
    const MAP3D_LINE_HALF_WIDTH_M = 1.4;
    const MAP3D_DENSE_STEP_M = 8;
    const MAP3D_DENSE_MAX_SUB = 16;
    const MAP3D_DENSE_MIN_SUB = 4;
    // Chaikin 会偏离采样点，标点会「飘」离航迹；仅用 Catmull-Rom 保证过采样点
    const MAP3D_CHAIKIN_ITERS = 0;

    function segmentLengthM(a, b) {
      const midLat = (a.lat + b.lat) / 2;
      const cosLat = Math.cos((midLat * Math.PI) / 180) || 1e-6;
      const dxM = (b.lon - a.lon) * 111320 * cosLat;
      const dyM = (b.lat - a.lat) * 111320;
      const dz = (b.h - a.h);
      return Math.hypot(dxM, dyM, dz);
    }

    function lerpTrackPt(a, b, t) {
      return {
        lon: a.lon + (b.lon - a.lon) * t,
        lat: a.lat + (b.lat - a.lat) * t,
        h: Math.max(0, a.h + (b.h - a.h) * t),
      };
    }

    /** Chaikin 角切：先抹圆折线拐角。 */
    function chaikinSmoothTrack(points, iterations) {
      let pts = points;
      for (let iter = 0; iter < iterations; iter++) {
        if (pts.length < 2) break;
        const next = [pts[0]];
        for (let i = 0; i < pts.length - 1; i++) {
          const a = pts[i];
          const b = pts[i + 1];
          next.push(lerpTrackPt(a, b, 0.25));
          next.push(lerpTrackPt(a, b, 0.75));
        }
        next.push(pts[pts.length - 1]);
        pts = next;
      }
      return pts;
    }

    /**
     * 航迹点弦上线性加密 lon/lat/h（步长约 MAP3D_DENSE_STEP_M）。
     * 口径：Chaikin 迭代为 0，保证过原采样点；与 seriesInterpAtTime 插值一致，
     *       避免曲线弯出弦外导致 3D 标点飘离航迹。
     * 副作用：无。
     */
    function densifyTrack3dPoints(points) {
      if (!points || points.length < 2) return points || [];
      const smoothed = chaikinSmoothTrack(points, MAP3D_CHAIKIN_ITERS);
      const out = [];
      for (let i = 0; i < smoothed.length - 1; i++) {
        const p1 = smoothed[i];
        const p2 = smoothed[i + 1];
        out.push(p1);
        const lenM = segmentLengthM(p1, p2);
        if (lenM < 0.8) continue;
        const subdiv = Math.max(
          MAP3D_DENSE_MIN_SUB,
          Math.min(MAP3D_DENSE_MAX_SUB, Math.ceil(lenM / MAP3D_DENSE_STEP_M))
        );
        for (let s = 1; s < subdiv; s++) {
          out.push(lerpTrackPt(p1, p2, s / subdiv));
        }
      }
      out.push(smoothed[smoothed.length - 1]);
      return out;
    }

    function hexToRgba01(hex, alpha = 1) {
      const m = String(hex || "").trim().match(/^#?([0-9a-f]{6})$/i);
      if (!m) return [0.15, 0.35, 0.85, alpha];
      const n = parseInt(m[1], 16);
      return [
        ((n >> 16) & 255) / 255,
        ((n >> 8) & 255) / 255,
        (n & 255) / 255,
        alpha,
      ];
    }

    /** MapLibre 自定义层：墨卡托 + 海拔下的方形截面细管，避免 fill-extrusion 断带伪影。 */
    function createSelectedTrack3dLineLayer() {
      const layer = {
        id: "selected-track-3d-line",
        type: "custom",
        renderingMode: "3d",
        visible: true,
        _vertexCount: 0,
        _color: [0.2, 0.35, 0.85, 1],
        onAdd(map, gl) {
          this.map = map;
          this.gl = gl;
          try {
            gl.getExtension("OES_element_index_uint");
          } catch (_) { /* ignore */ }
          const vs = `
            uniform mat4 u_matrix;
            attribute vec3 a_pos;
            void main() {
              gl_Position = u_matrix * vec4(a_pos, 1.0);
            }`;
          const fs = `
            precision mediump float;
            uniform vec4 u_color;
            void main() {
              gl_FragColor = u_color;
            }`;
          const compile = (type, src) => {
            const sh = gl.createShader(type);
            gl.shaderSource(sh, src);
            gl.compileShader(sh);
            return sh;
          };
          this.program = gl.createProgram();
          gl.attachShader(this.program, compile(gl.VERTEX_SHADER, vs));
          gl.attachShader(this.program, compile(gl.FRAGMENT_SHADER, fs));
          gl.linkProgram(this.program);
          this.aPos = gl.getAttribLocation(this.program, "a_pos");
          this.uMatrix = gl.getUniformLocation(this.program, "u_matrix");
          this.uColor = gl.getUniformLocation(this.program, "u_color");
          this.buffer = gl.createBuffer();
          this.indexBuffer = gl.createBuffer();
          this.hoverBuffer = gl.createBuffer();
          this.hoverIndexBuffer = gl.createBuffer();
          this._hoverVertexCount = 0;
        },
        onRemove(_map, gl) {
          if (this._meshes?.length) {
            for (const m of this._meshes) {
              if (m.buffer) gl.deleteBuffer(m.buffer);
              if (m.indexBuffer) gl.deleteBuffer(m.indexBuffer);
            }
            this._meshes = [];
          }
          if (this._hoverMeshes?.length) {
            for (const m of this._hoverMeshes) {
              if (m.buffer) gl.deleteBuffer(m.buffer);
              if (m.indexBuffer) gl.deleteBuffer(m.indexBuffer);
            }
            this._hoverMeshes = [];
          }
          if (this.buffer) gl.deleteBuffer(this.buffer);
          if (this.indexBuffer) gl.deleteBuffer(this.indexBuffer);
          if (this.hoverBuffer) gl.deleteBuffer(this.hoverBuffer);
          if (this.hoverIndexBuffer) gl.deleteBuffer(this.hoverIndexBuffer);
          if (this.program) gl.deleteProgram(this.program);
          this.buffer = null;
          this.indexBuffer = null;
          this.hoverBuffer = null;
          this.hoverIndexBuffer = null;
          this.program = null;
          this.gl = null;
        },
        setTrack(points, colorHex) {
          this.setTracks(points?.length ? [{ points, colorHex }] : []);
        },
        setTracks(items) {
          const gl = this.gl;
          if (this._meshes?.length && gl) {
            for (const m of this._meshes) {
              if (m.buffer) gl.deleteBuffer(m.buffer);
              if (m.indexBuffer) gl.deleteBuffer(m.indexBuffer);
            }
          }
          this._meshes = [];
          this._vertexCount = 0;
          this._positions = null;
          this._indices = null;
          const list = Array.isArray(items) ? items : [];
          for (const item of list) {
            const points = item?.points;
            const colorHex = item?.colorHex || item?.color || "#2563EB";
            if (!points?.length || typeof maplibregl === "undefined") continue;
            const merc = [];
            for (let i = 0; i < points.length; i++) {
              const p = points[i];
              const m = maplibregl.MercatorCoordinate.fromLngLat(
                { lng: p.lon, lat: p.lat },
                Math.max(0, p.h)
              );
              merc.push({
                x: m.x,
                y: m.y,
                z: m.z,
                meter: m.meterInMercatorCoordinateUnits(),
              });
            }
            if (merc.length < 2) continue;
            const half = MAP3D_LINE_HALF_WIDTH_M;
            const verts = [];
            const idx = [];
            const ring = [];
            for (let i = 0; i < merc.length; i++) {
              const prev = merc[Math.max(0, i - 1)];
              const curr = merc[i];
              const next = merc[Math.min(merc.length - 1, i + 1)];
              let tx = next.x - prev.x;
              let ty = next.y - prev.y;
              let tz = next.z - prev.z;
              let tLen = Math.hypot(tx, ty, tz) || 1e-12;
              tx /= tLen; ty /= tLen; tz /= tLen;
              let bx = -ty;
              let by = tx;
              let bz = 0;
              let bLen = Math.hypot(bx, by);
              if (bLen < 1e-8) {
                bx = 1; by = 0; bz = 0;
                bLen = 1;
              } else {
                bx /= bLen; by /= bLen;
              }
              let nx = ty * bz - tz * by;
              let ny = tz * bx - tx * bz;
              let nz = tx * by - ty * bx;
              let nLen = Math.hypot(nx, ny, nz) || 1e-12;
              nx /= nLen; ny /= nLen; nz /= nLen;
              const w = half * curr.meter;
              const corners = [
                [curr.x - bx * w - nx * w, curr.y - by * w - ny * w, curr.z - bz * w - nz * w],
                [curr.x + bx * w - nx * w, curr.y + by * w - ny * w, curr.z + bz * w - nz * w],
                [curr.x + bx * w + nx * w, curr.y + by * w + ny * w, curr.z + bz * w + nz * w],
                [curr.x - bx * w + nx * w, curr.y - by * w + ny * w, curr.z - bz * w + nz * w],
              ];
              const base = verts.length / 3;
              corners.forEach((c) => {
                verts.push(c[0], c[1], c[2]);
              });
              ring.push(base);
              if (i > 0) {
                const a = ring[i - 1];
                const b = base;
                for (let k = 0; k < 4; k++) {
                  const k2 = (k + 1) % 4;
                  idx.push(a + k, b + k, b + k2);
                  idx.push(a + k, b + k2, a + k2);
                }
              }
            }
            if (!idx.length) continue;
            const mesh = {
              positions: new Float32Array(verts),
              indices: new Uint32Array(idx),
              vertexCount: idx.length,
              color: hexToRgba01(colorHex, 1),
              buffer: null,
              indexBuffer: null,
            };
            if (gl) {
              mesh.buffer = gl.createBuffer();
              mesh.indexBuffer = gl.createBuffer();
              gl.bindBuffer(gl.ARRAY_BUFFER, mesh.buffer);
              gl.bufferData(gl.ARRAY_BUFFER, mesh.positions, gl.STATIC_DRAW);
              gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, mesh.indexBuffer);
              gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, mesh.indices, gl.STATIC_DRAW);
            }
            this._meshes.push(mesh);
            this._vertexCount += mesh.vertexCount;
          }
          if (this._meshes.length === 1) this._color = this._meshes[0].color;
          this.map?.triggerRepaint();
        },
        clearTrack() {
          this.setTracks([]);
          this.clearHoverPoint();
        },
        setHoverPoint(lon, lat, alt, colorHex) {
          this.setHoverPoints([{ lon, lat, alt, colorHex }]);
        },
        setHoverPoints(points) {
          const gl = this.gl;
          if (this._hoverMeshes?.length && gl) {
            for (const m of this._hoverMeshes) {
              if (m.buffer) gl.deleteBuffer(m.buffer);
              if (m.indexBuffer) gl.deleteBuffer(m.indexBuffer);
            }
          }
          this._hoverMeshes = [];
          this._hoverVertexCount = 0;
          this._hoverPositions = null;
          this._hoverIndices = null;
          if (!points?.length || typeof maplibregl === "undefined") {
            this.map?.triggerRepaint();
            return;
          }
          const idxTemplate = [
            0, 1, 2, 0, 2, 3, 0, 3, 4, 0, 4, 1,
            5, 2, 1, 5, 3, 2, 5, 4, 3, 5, 1, 4,
          ];
          for (const p of points) {
            const lon = Number(p.lon);
            const lat = Number(p.lat);
            if (!Number.isFinite(lon) || !Number.isFinite(lat)) continue;
            const m = maplibregl.MercatorCoordinate.fromLngLat(
              { lng: lon, lat },
              Math.max(0, Number(p.alt) || 0)
            );
            const r = 2.8 * m.meterInMercatorCoordinateUnits();
            const cx = m.x;
            const cy = m.y;
            const cz = m.z;
            const verts = new Float32Array([
              cx, cy, cz + r,
              cx + r, cy, cz,
              cx, cy + r, cz,
              cx - r, cy, cz,
              cx, cy - r, cz,
              cx, cy, cz - r,
            ]);
            const idx = new Uint16Array(idxTemplate);
            const mesh = {
              positions: verts,
              indices: idx,
              vertexCount: idx.length,
              color: hexToRgba01(p.colorHex || "#2563EB", 1),
              buffer: null,
              indexBuffer: null,
            };
            if (gl) {
              mesh.buffer = gl.createBuffer();
              mesh.indexBuffer = gl.createBuffer();
              gl.bindBuffer(gl.ARRAY_BUFFER, mesh.buffer);
              gl.bufferData(gl.ARRAY_BUFFER, verts, gl.DYNAMIC_DRAW);
              gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, mesh.indexBuffer);
              gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, idx, gl.DYNAMIC_DRAW);
            }
            this._hoverMeshes.push(mesh);
          }
          if (this._hoverMeshes.length === 1) {
            const only = this._hoverMeshes[0];
            this._hoverPositions = only.positions;
            this._hoverIndices = only.indices;
            this._hoverVertexCount = only.vertexCount;
            this._hoverColor = only.color;
            if (gl && this.hoverBuffer && this.hoverIndexBuffer) {
              gl.bindBuffer(gl.ARRAY_BUFFER, this.hoverBuffer);
              gl.bufferData(gl.ARRAY_BUFFER, only.positions, gl.DYNAMIC_DRAW);
              gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, this.hoverIndexBuffer);
              gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, only.indices, gl.DYNAMIC_DRAW);
            }
          }
          this.map?.triggerRepaint();
        },
        clearHoverPoint() {
          this.setHoverPoints([]);
        },
        render(gl, matrix) {
          if (!this.visible || !this.program) return;
          const raw = matrix?.defaultProjectionData?.mainMatrix || matrix;
          if (!raw) return;
          const mat = raw instanceof Float32Array ? raw : new Float32Array(raw);
          gl.useProgram(this.program);
          gl.uniformMatrix4fv(this.uMatrix, false, mat);
          gl.enable(gl.BLEND);
          gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
          gl.enableVertexAttribArray(this.aPos);

          if (this._meshes?.length) {
            for (const mesh of this._meshes) {
              if (!mesh.vertexCount || !mesh.buffer || !mesh.indexBuffer) continue;
              gl.uniform4fv(this.uColor, mesh.color || this._color);
              gl.bindBuffer(gl.ARRAY_BUFFER, mesh.buffer);
              gl.vertexAttribPointer(this.aPos, 3, gl.FLOAT, false, 0, 0);
              gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, mesh.indexBuffer);
              gl.drawElements(gl.TRIANGLES, mesh.vertexCount, gl.UNSIGNED_INT, 0);
            }
          } else if (this._vertexCount && this.buffer && this.indexBuffer) {
            gl.uniform4fv(this.uColor, this._color);
            gl.bindBuffer(gl.ARRAY_BUFFER, this.buffer);
            gl.vertexAttribPointer(this.aPos, 3, gl.FLOAT, false, 0, 0);
            gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, this.indexBuffer);
            gl.drawElements(gl.TRIANGLES, this._vertexCount, gl.UNSIGNED_INT, 0);
          }

          if (this._hoverMeshes?.length) {
            for (const mesh of this._hoverMeshes) {
              if (!mesh.vertexCount || !mesh.buffer || !mesh.indexBuffer) continue;
              gl.uniform4fv(this.uColor, mesh.color || [1, 1, 1, 1]);
              gl.bindBuffer(gl.ARRAY_BUFFER, mesh.buffer);
              gl.vertexAttribPointer(this.aPos, 3, gl.FLOAT, false, 0, 0);
              gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, mesh.indexBuffer);
              gl.drawElements(gl.TRIANGLES, mesh.vertexCount, gl.UNSIGNED_SHORT, 0);
            }
          } else if (this._hoverVertexCount && this.hoverBuffer && this.hoverIndexBuffer) {
            gl.uniform4fv(this.uColor, this._hoverColor || [1, 1, 1, 1]);
            gl.bindBuffer(gl.ARRAY_BUFFER, this.hoverBuffer);
            gl.vertexAttribPointer(this.aPos, 3, gl.FLOAT, false, 0, 0);
            gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, this.hoverIndexBuffer);
            gl.drawElements(gl.TRIANGLES, this._hoverVertexCount, gl.UNSIGNED_SHORT, 0);
          }
        },
      };
      return layer;
    }

    function ensureMap3dLayers() {
      if (!map3d) return;
      ensureMap3dContextLayers();
      if (map3d.getLayer("selected-track-3d-wall")) {
        try { map3d.removeLayer("selected-track-3d-wall"); } catch (_) { /* ignore */ }
      }
      if (map3d.getSource("selected-track-3d")) {
        try {
          map3d.getSource("selected-track-3d").setData({ type: "FeatureCollection", features: [] });
        } catch (_) { /* ignore */ }
      }
      if (!map3d.getLayer("selected-track-3d-line")) {
        selectedTrack3dLineLayer = createSelectedTrack3dLineLayer();
        map3d.addLayer(selectedTrack3dLineLayer);
      }
    }

    function circlePolygonLonLat(lon, lat, radiusM, steps = 48) {
      const coords = [];
      const cosLat = Math.cos((lat * Math.PI) / 180) || 1e-6;
      for (let i = 0; i <= steps; i++) {
        const a = (i / steps) * Math.PI * 2;
        const dx = Math.cos(a) * radiusM;
        const dy = Math.sin(a) * radiusM;
        coords.push([
          lon + dx / (111320 * cosLat),
          lat + dy / 111320,
        ]);
      }
      return coords;
    }

    function ensureMap3dContextLayers() {
      if (!map3d) return;
      const empty = { type: "FeatureCollection", features: [] };
      const sources = [
        ["district-3d", empty],
        ["coverage-3d", empty],
        ["tracks-3d", empty],
        ["airports-3d", empty],
      ];
      sources.forEach(([id, data]) => {
        if (!map3d.getSource(id)) {
          const opts = { type: "geojson", data };
          if (id === "tracks-3d" || id === "airports-3d") opts.promoteId = "id";
          map3d.addSource(id, opts);
        }
      });

      if (!map3d.getLayer("district-3d-fill")) {
        map3d.addLayer({
          id: "district-3d-fill",
          type: "fill",
          source: "district-3d",
          paint: {
            "fill-color": "#E67E22",
            "fill-opacity": 0.06,
          },
        });
      }
      if (!map3d.getLayer("district-3d-line")) {
        map3d.addLayer({
          id: "district-3d-line",
          type: "line",
          source: "district-3d",
          paint: {
            "line-color": "#E67E22",
            "line-width": 2,
          },
        });
      }
      if (!map3d.getLayer("coverage-3d-fill")) {
        map3d.addLayer({
          id: "coverage-3d-fill",
          type: "fill",
          source: "coverage-3d",
          paint: {
            "fill-color": ["get", "color"],
            "fill-opacity": 0.06,
          },
        });
      }
      if (!map3d.getLayer("coverage-3d-line")) {
        map3d.addLayer({
          id: "coverage-3d-line",
          type: "line",
          source: "coverage-3d",
          paint: {
            "line-color": ["get", "color"],
            "line-width": 1,
            "line-dasharray": [2, 2],
          },
        });
      }
      if (!map3d.getLayer("tracks-3d-line")) {

    function setMap3dLayerVisible(layerId, visible) {
      if (!map3d?.getLayer(layerId)) return;
      map3d.setLayoutProperty(layerId, "visibility", visible ? "visible" : "none");

    function showMap3dPopup(lngLat, html) {
      if (!map3d || typeof maplibregl === "undefined") return;
      if (!map3dPopup) {
        map3dPopup = new maplibregl.Popup({
          closeButton: true,
          closeOnClick: true,
          maxWidth: "320px",
          className: "map3d-popup",
        });
      }
      map3dPopup.setLngLat(lngLat).setHTML(html).addTo(map3d);

    function clearMap3dPopup() {
      if (map3dPopup) {
        map3dPopup.remove();
        map3dPopup = null;
      }

    function applyMap3dTrackHover(id) {
      if (!map3d || !map3dReady || !map3d.getSource("tracks-3d")) return;
      if (map3dHoverFeatureId != null && map3dHoverFeatureId !== id) {
        try {
          map3d.setFeatureState({ source: "tracks-3d", id: map3dHoverFeatureId }, { hover: false });
        } catch (_) { /* ignore */ }
      }
      if (id != null) {
        try {
          map3d.setFeatureState({ source: "tracks-3d", id }, { hover: true });
        } catch (_) { /* ignore */ }
      }
      map3dHoverFeatureId = id;
    }

    /** 将 2D 图层状态同步到 MapLibre（区划 / 覆盖 / 轨迹线 / 机场 / 立体建筑）。 */
    function syncMap3dOverlays() {
      if (!map3d || !map3dReady || !MAP_DATA) return;
      ensureMap3dLayers();
      ensureSeriesPos3dLayers();
      ensureMap3dBuildings();

      const showAirports = !!document.getElementById("layer-airports")?.checked;
      const showCoverage = !!document.getElementById("layer-coverage")?.checked;
      const showTracks = !!document.getElementById("layer-tracks")?.checked;
      const showDistrict = !!document.getElementById("layer-district")?.checked;

      const districtSrc = map3d.getSource("district-3d");
      if (districtSrc) {
        const geo = showDistrict ? MAP_DATA.meta.district_boundary : null;
        if (geo) {
          districtSrc.setData(
            geo.type === "FeatureCollection" ? geo : { type: "FeatureCollection", features: [geo] }
          );
        } else {
          districtSrc.setData({ type: "FeatureCollection", features: [] });
        }
      }
      setMap3dLayerVisible("district-3d-fill", showDistrict);
      setMap3dLayerVisible("district-3d-line", showDistrict);

      const coverageFeatures = [];
      if (showCoverage) {
        MAP_DATA.airports.forEach((a) => {
          if (!matchFactory(a)) return;
          if (a.longitude == null || a.latitude == null || !a.radius_m) return;
          coverageFeatures.push({
            type: "Feature",
            properties: {
              id: a.id,
              name: a.name,
              color: factoryColor(a),
              radius_m: a.radius_m,
              kind: "coverage",
            },
            geometry: {
              type: "Polygon",
              coordinates: [circlePolygonLonLat(a.longitude, a.latitude, a.radius_m)],
            },
          });
        });
      }
      map3d.getSource("coverage-3d")?.setData({ type: "FeatureCollection", features: coverageFeatures });
      setMap3dLayerVisible("coverage-3d-fill", showCoverage);
      setMap3dLayerVisible("coverage-3d-line", showCoverage);

      const trackFeatures = [];
      if (showTracks) {
        MAP_DATA.tracks.forEach((t) => {
          if (!shouldShowTrack(t) || !t.coords?.length) return;
          const style = trackLineStyle(t);
          const isSelected = selectedTrackId === t.id;
          const isHover = hoverTrackId === t.id;
          trackFeatures.push({
            type: "Feature",
            id: t.id,
            properties: {
              id: t.id,
              color: style.color,
              opacity: style.opacity,
              weight: style.weight,
              kind: "track",
            },
            geometry: {
              type: "LineString",
              coordinates: t.coords,
            },
          });
        });
      }
      map3d.getSource("tracks-3d")?.setData({ type: "FeatureCollection", features: trackFeatures });
      setMap3dLayerVisible("tracks-3d-line", showTracks);
      setMap3dLayerVisible("tracks-3d-hit", showTracks);
      if (selectedTrack3dLineLayer) {
        selectedTrack3dLineLayer.visible = !!(showTracks && in3dMode);
        map3d.triggerRepaint();
      }
      map3dHoverFeatureId = null;
      if (hoverTrackId != null) applyMap3dTrackHover(hoverTrackId);

      const airportFeatures = [];
      if (showAirports) {
        MAP_DATA.airports.forEach((a) => {
          if (!matchFactory(a)) return;
          if (a.longitude == null || a.latitude == null) return;
          airportFeatures.push({
            type: "Feature",
            id: a.id,
            properties: {
              id: a.id,
              color: factoryColor(a),
              kind: "airport",
              name: a.name,
            },
            geometry: {
              type: "Point",
              coordinates: [a.longitude, a.latitude],
            },
          });
        });
      }
      map3d.getSource("airports-3d")?.setData({ type: "FeatureCollection", features: airportFeatures });
      setMap3dLayerVisible("airports-3d", showAirports);
    }

    function setupMap3dInteractions(m) {
      if (!m || map3dInteractBound) return;
      map3dInteractBound = true;
      const pickLayers = [
        "tracks-3d-hit",
        "airports-3d",
        "coverage-3d-fill",
        "district-3d-fill",
      ];

      m.on("mousemove", (e) => {
        if (!in3dMode) return;
        const feats = m.queryRenderedFeatures(e.point, {
          layers: pickLayers.filter((id) => m.getLayer(id)),
        });
        const trackHit = feats.find((f) => f.layer?.id === "tracks-3d-hit");
        const canvas = m.getCanvas();
        if (trackHit) {
          const tid = Number(trackHit.properties?.id);
          if (Number.isFinite(tid)) setHoverTrack(tid);
          canvas.style.cursor = "pointer";
        } else {
          if (hoverTrackId != null) setHoverTrack(null);
          canvas.style.cursor = feats.length ? "pointer" : "";
        }
      });

      m.on("mouseleave", () => {
        if (hoverTrackId != null) setHoverTrack(null);
        m.getCanvas().style.cursor = "";
      });

      m.on("click", (e) => {
        if (!in3dMode) return;
        const feats = m.queryRenderedFeatures(e.point, {
          layers: pickLayers.filter((id) => m.getLayer(id)),
        });
        if (!feats.length) {
          clearMap3dPopup();
          return;
        }
        const trackHit = feats.find((f) => f.layer?.id === "tracks-3d-hit");
        if (trackHit) {
          const tid = Number(trackHit.properties?.id);
          if (Number.isFinite(tid)) focusTrack(tid);
          return;
        }
        const airport = feats.find((f) => f.layer?.id === "airports-3d");
        if (airport) {
          const aid = airport.properties?.id;
          const a = MAP_DATA?.airports?.find((x) => x.id === aid);
          if (a) showMap3dPopup(e.lngLat, airportPopup(a));
          return;
        }
        const coverage = feats.find((f) => f.layer?.id === "coverage-3d-fill");
        if (coverage) {
          const name = coverage.properties?.name || "机场";
          const r = Number(coverage.properties?.radius_m) || 0;
          showMap3dPopup(
            e.lngLat,
            `<b>${name}</b><br>覆盖半径 ${(r / 1000).toFixed(1)} km`
          );
          return;
        }
        const district = feats.find((f) => f.layer?.id === "district-3d-fill");
        if (district) {
          showMap3dPopup(
            e.lngLat,
            `<b>${MAP_DATA.meta.district_name || "越城区"}</b><br>看板「行政内」KPI 按此行政区划面统计`
          );
        }
      });
    }

    function seriesChartColors() {
      const isDark = document.documentElement.dataset.theme === "linear";
      return {
        height: isDark ? "#60A5FA" : "#2563EB",
        speed: isDark ? "#FBBF24" : "#EA580C",
        distance: isDark ? "#34D399" : "#059669",
      };
    }

    function formatSeriesNum(v, digits) {
      if (v == null || !Number.isFinite(Number(v))) return "—";
      return Number(v).toFixed(digits);
    }

    /** 与时序 Chart.js tooltip 相同的标注内容。 */
    function seriesPosAnnotationHtml(track, dataIndex) {
      const series = track?.series;
      const tMin = series?.t_min?.[dataIndex];
      const title = tMin != null ? `起飞后 ${Number(tMin).toFixed(1)} 分钟` : "时序点";
      const colors = seriesChartColors();
      const rows = [
        { color: colors.height, label: "高度 (m)", value: formatSeriesNum(series?.height_m?.[dataIndex], 0) },
        { color: colors.speed, label: "速度 (km/h)", value: formatSeriesNum(series?.speed_kmh?.[dataIndex], 1) },
        { color: colors.distance, label: "累计距离 (km)", value: formatSeriesNum(series?.distance_km?.[dataIndex], 2) },
      ];
      const ll = seriesPointLatLng(track, dataIndex);
      const footer = ll ? `位置 ${ll[0].toFixed(5)}, ${ll[1].toFixed(5)}` : "";
      const rowsHtml = rows
        .map(
          (r) =>
            `<div class="series-pos-tip-row"><span class="series-pos-tip-swatch" style="background:${r.color}"></span>${r.label}: ${r.value}</div>`
        )
        .join("");
      return (
        `<div class="series-pos-tip">` +
        `<div class="series-pos-tip-title">${title}</div>` +
        rowsHtml +
        (footer ? `<div class="series-pos-tip-footer">${footer}</div>` : "") +
        `</div>`
      );
    }

    function makeSeriesPosPinElement(track, dataIndex, accent) {
      const el = document.createElement("div");
      el.className = "series-pos-pin";
      el.innerHTML =
        seriesPosAnnotationHtml(track, dataIndex) +
        `<div class="series-pos-dot" style="background:${accent || css("--accent") || "#2563EB"}"></div>`;
      return el;
    }

    function updateSeriesPosPinElement(root, track, dataIndex, accent) {
      if (!root) return;
      const bg = accent || css("--accent") || "#2563EB";
      root.innerHTML =
        seriesPosAnnotationHtml(track, dataIndex) +
        `<div class="series-pos-dot" style="background:${bg}"></div>`;
    }

    /** 与 3D 航迹 WebGL 层同一套坐标：MercatorCoordinate(含海拔) × customLayerMatrix → 屏幕像素。 */
    function projectLngLatAlt(map, lng, lat, altM) {
      if (!map || typeof maplibregl === "undefined") return null;
      const merc = maplibregl.MercatorCoordinate.fromLngLat(
        { lng, lat },
        Number(altM) || 0
      );
      const tr = map.transform;
      if (!tr) return null;

      let matrix = null;
      if (typeof tr.customLayerMatrix === "function") {
        matrix = tr.customLayerMatrix();
      }
      if (matrix && matrix.length >= 16) {
        const m = matrix instanceof Float32Array ? matrix : new Float32Array(matrix);
        const x = merc.x;
        const y = merc.y;
        const z = merc.z;
        const clipX = m[0] * x + m[4] * y + m[8] * z + m[12];
        const clipY = m[1] * x + m[5] * y + m[9] * z + m[13];
        const clipW = m[3] * x + m[7] * y + m[11] * z + m[15];
        if (!Number.isFinite(clipW) || Math.abs(clipW) < 1e-12) return null;
        const ndcX = clipX / clipW;
        const ndcY = clipY / clipW;
        if (!Number.isFinite(ndcX) || !Number.isFinite(ndcY)) return null;
        const width = tr.width || map.getContainer().clientWidth;
        const height = tr.height || map.getContainer().clientHeight;
        return {
          x: (ndcX * 0.5 + 0.5) * width,
          y: (-ndcY * 0.5 + 0.5) * height,
        };
      }

      // 回退：旧 coordinatePoint（海拔米）
      if (typeof tr.coordinatePoint === "function") {
        let coord;
        if (typeof tr.locationCoordinate === "function") {
          coord = tr.locationCoordinate({ lng, lat });
        } else {
          coord = maplibregl.MercatorCoordinate.fromLngLat({ lng, lat });
        }
        const pt = tr.coordinatePoint(coord, Number(altM) || 0, tr.pixelMatrix3D || tr.pixelMatrix);
        if (!pt || !Number.isFinite(pt.x) || !Number.isFinite(pt.y)) return null;
        return pt;
      }
      return null;
    }

    function ensureSeriesPos3dLayers() {
      if (!map3d) return;
      if (!map3d.getSource("series-pos-3d")) {
        map3d.addSource("series-pos-3d", {
          type: "geojson",
          data: { type: "FeatureCollection", features: [] },
        });
      }
      if (!map3d.getLayer("series-pos-3d-bead")) {
        map3d.addLayer({
          id: "series-pos-3d-bead",
          type: "fill-extrusion",
          source: "series-pos-3d",
          paint: {
            "fill-extrusion-color": ["get", "color"],
            "fill-extrusion-height": ["get", "height"],
            "fill-extrusion-base": ["get", "base"],
            "fill-extrusion-opacity": 1,
          },
        });
      }
    }

    function setSeriesPos3dBead(lon, lat, alt, accent) {
      if (!map3d) return;
      ensureSeriesPos3dLayers();
      const src = map3d.getSource("series-pos-3d");
      if (!src) return;
      // 小珠贴近航迹采样点，避免大块挤出造成「偏了」的观感
      const halfM = 1.2;
      const cosLat = Math.cos((lat * Math.PI) / 180) || 1e-6;
      const dLon = halfM / (111320 * cosLat);
      const dLat = halfM / 111320;
      const base = Math.max(0, alt - halfM);
      const height = Math.max(alt + halfM, base + 0.4);
      src.setData({
        type: "FeatureCollection",
        features: [
          {
            type: "Feature",
            properties: { color: accent, base, height },
            geometry: {
              type: "Polygon",
              coordinates: [[
                [lon - dLon, lat - dLat],
                [lon + dLon, lat - dLat],
                [lon + dLon, lat + dLat],
                [lon - dLon, lat + dLat],
                [lon - dLon, lat - dLat],
              ]],
            },
          },
        ],
      });
    }

    function clearSeriesPos3dBead() {
      if (!map3d) return;
      const src = map3d.getSource("series-pos-3d");
      if (src) src.setData({ type: "FeatureCollection", features: [] });
    }

    function updateSeriesPos3dPinScreen() {
      if (!map3d) return;
      const box = map3d.getContainer();
      const w = box?.clientWidth || 0;
      const h = box?.clientHeight || 0;
      const place = (el, state) => {
        if (!el || !state) return;
        const pt = projectLngLatAlt(map3d, state.lng, state.lat, state.alt);
        if (!pt) {
          el.style.visibility = "hidden";
          return;
        }
        if (pt.x < -80 || pt.y < -80 || pt.x > w + 80 || pt.y > h + 80) {
          el.style.visibility = "hidden";
          return;
        }
        el.style.visibility = "visible";
        el.style.transform =
          `translate(-50%, calc(-100% + 9px)) translate(${pt.x.toFixed(1)}px, ${pt.y.toFixed(1)}px)`;
      };
      place(seriesPos3dEl, seriesPos3dState);
      for (const item of seriesPosExtra3dPins) {
        place(item.el, item.state);
      }
    }

    function ensureSeriesPos3dRenderHook() {
      if (!map3d || map3d.__seriesPosRenderBound) return;
      map3d.__seriesPosRenderBound = true;
      map3d.on("render", updateSeriesPos3dPinScreen);
    }

    function showSeriesPos3dMarker(track, dataIndex) {
      if (!map3d || !map3dReady || !in3dMode || !track || typeof maplibregl === "undefined") {
        clearSeriesPos3dMarker();
        return;
      }
      // 优先用时序同源 lon/lat，避免 coords 比例插值偏差
      const series = track.series;
      let lon = series?.lon?.[dataIndex];
      let lat = series?.lat?.[dataIndex];
      if (lon == null || lat == null || !Number.isFinite(Number(lon)) || !Number.isFinite(Number(lat))) {
        const ll = seriesPointLatLng(track, dataIndex);
        if (!ll) {
          clearSeriesPos3dMarker();
          return;
        }
        lat = ll[0];
        lon = ll[1];
      } else {
        lon = Number(lon);
        lat = Number(lat);
      }
      const { heights, usedDefault120 } = displayHeightsFor3d(series);
      const heightM = heights?.[dataIndex];
      const elevM = series?.elevation_m?.[dataIndex];
      const alt = absoluteAltitudeFor3d(
        lon,
        lat,
        heightM != null && Number.isFinite(Number(heightM)) ? Number(heightM) : 0,
        elevM,
        usedDefault120
      );
      const accent = css("--accent") || "#2563EB";
      seriesPos3dState = { lng: lon, lat, alt, accent };
      // 立体定位点走 WebGL（与航迹同坐标系）；不再用大块挤出珠
      clearSeriesPos3dBead();
      if (!compareActive) {
        selectedTrack3dLineLayer?.setHoverPoint?.(lon, lat, alt, accent);
      }
      if (!seriesPos3dEl) {
        seriesPos3dEl = makeSeriesPosPinElement(track, dataIndex, accent);
        seriesPos3dEl.classList.add("series-pos-3d-pin");
        const host = map3d.getCanvasContainer() || map3d.getContainer();
        host.appendChild(seriesPos3dEl);
      } else {
        updateSeriesPosPinElement(seriesPos3dEl, track, dataIndex, accent);
      }
      ensureSeriesPos3dRenderHook();
      updateSeriesPos3dPinScreen();
    }

    function clearSeriesPos3dMarker() {
      seriesPos3dState = null;
      if (seriesPos3dEl) {
        seriesPos3dEl.remove();
        seriesPos3dEl = null;
      }
      clearSeriesPos3dBead();
      if (!compareActive) selectedTrack3dLineLayer?.clearHoverPoint?.();
    }

    function clearSeriesPosExtra3dPins() {
      for (const item of seriesPosExtra3dPins) {
        try { item.el?.remove(); } catch (_) { /* ignore */ }
      }
      seriesPosExtra3dPins = [];
    }

    function clearSeriesPosExtraMarkers() {
      for (const m of seriesPosExtraMarkers.values()) {
        try { m.remove(); } catch (_) { /* ignore */ }
      }
      seriesPosExtraMarkers = new Map();
      clearSeriesPosExtra3dPins();
    }

    function clearPrimarySeriesPosMarker() {
      if (seriesPosMarker) {
        seriesPosMarker.remove();
        seriesPosMarker = null;
      }
      if (seriesPos3dEl) {
        seriesPos3dEl.remove();
        seriesPos3dEl = null;
      }
      seriesPos3dState = null;
    }

    function clearSeriesPosMarker() {
      clearPrimarySeriesPosMarker();
      clearSeriesPosExtraMarkers();
      clearSeriesPos3dBead();
      selectedTrack3dLineLayer?.clearHoverPoint?.();
    }

    function showCompareExtraPosMarkers(tCursor, opts = {}) {
      if (!compareActive) {
        clearSeriesPosExtraMarkers();
        return;
      }
      const keep2d = new Set();
      const keep3d = new Set();
      const hoverPts = [];
      const host = in3dMode && map3d
        ? (map3d.getCanvasContainer() || map3d.getContainer())
        : null;
      const forceTip = !!opts.forceTip;

      for (const t of getCompareTracks()) {
        if (!t.series?.t_min?.length) continue;
        const sample = seriesInterpAtTime(t, tCursor);
        if (!sample || sample.lat == null || sample.lon == null) continue;
        if (!Number.isFinite(sample.lat) || !Number.isFinite(sample.lon)) continue;
        const color = compareTrackColor(t.id);
        const alt = seriesAltForSample(t, sample);
        const tipOpts = { trackLabel: compareTrackPosLabel(t) };
        const pinHtml = seriesPosPinInnerHtml(sample, color, tipOpts);
        if (in3dMode) {
          hoverPts.push({ lon: sample.lon, lat: sample.lat, alt, colorHex: color });
        }

        if (t.id === selectedTrackId) continue;

        if (map) {
          keep2d.add(t.id);
          const existing = seriesPosExtraMarkers.get(t.id);
          const tipIdx = sample.i0;
          if (existing) {
            existing.setLatLng([sample.lat, sample.lon]);
            const needTip = forceTip || existing.__tipIdx !== tipIdx;
            if (needTip) {
              const root = existing.getElement()?.querySelector?.(".series-pos-pin");
              if (root) root.innerHTML = pinHtml;
              existing.__tipIdx = tipIdx;
            }
          } else {
            const pin = document.createElement("div");
            pin.className = "series-pos-pin";
            pin.innerHTML = pinHtml;
            const marker = L.marker([sample.lat, sample.lon], {
              interactive: false,
              keyboard: false,
              zIndexOffset: 800,
              icon: L.divIcon({
                className: "series-pos-divicon",
                html: pin.outerHTML,
                iconSize: [0, 0],
                iconAnchor: [0, 0],
              }),
            }).addTo(map);
            marker.__tipIdx = tipIdx;
            seriesPosExtraMarkers.set(t.id, marker);
          }
        }

        if (host) {
          keep3d.add(t.id);
          let item = seriesPosExtra3dPins.find((x) => x.trackId === t.id);
          const tipIdx = sample.i0;
          if (!item) {
            const el = document.createElement("div");
            el.className = "series-pos-pin series-pos-3d-pin series-pos-3d-extra";
            el.innerHTML = pinHtml;
            host.appendChild(el);
            item = { trackId: t.id, el, state: null, tipIdx };
            seriesPosExtra3dPins.push(item);
          } else if (forceTip || item.tipIdx !== tipIdx) {
            item.el.innerHTML = pinHtml;
            item.tipIdx = tipIdx;
          }
          item.state = { lng: sample.lon, lat: sample.lat, alt, accent: color };
        }
      }

      for (const [id, marker] of [...seriesPosExtraMarkers.entries()]) {
        if (!keep2d.has(id)) {
          try { marker.remove(); } catch (_) { /* ignore */ }
          seriesPosExtraMarkers.delete(id);
        }
      }
      seriesPosExtra3dPins = seriesPosExtra3dPins.filter((item) => {
        if (keep3d.has(item.trackId)) return true;
        try { item.el.remove(); } catch (_) { /* ignore */ }
        return false;
      });

      if (in3dMode && map3dReady) {
        selectedTrack3dLineLayer?.setHoverPoints?.(hoverPts);
        ensureSeriesPos3dRenderHook();
        updateSeriesPos3dPinScreen();
      }
    }

    /** MapLibre 默认：左键平移、右键方位+俯仰；仅拦截右键菜单。 */
    function setupMap3dOrbitControls(m) {
      if (!m || m.__orbitControlsBound) return;
      m.__orbitControlsBound = true;
      m.dragPan.enable();
      m.dragRotate.enable();
      m.getCanvas().addEventListener("contextmenu", (e) => {
        e.preventDefault();
      });
    }

    function ensureMap3d() {
      if (map3d) return map3d;
      if (typeof maplibregl === "undefined") {
        console.warn("MapLibre 未加载，跳过 3D 视图");
        return null;
      }
      const theme = document.documentElement.dataset.theme;
      const center = map
        ? [map.getCenter().lng, map.getCenter().lat]
        : [120.58, 30.0];
      const zoom = map ? map.getZoom() : 12;
      map3d = new maplibregl.Map({
        container: "map3d",
        style: map3dStyleForTheme(theme),
        center,
        zoom,
        pitch: 0,
        bearing: 0,
        maxPitch: 85,
        dragRotate: true,
        pitchWithRotate: true,
        attributionControl: true,
        canvasContextAttributes: { antialias: true },
      });
      map3d.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), "top-right");
      if (typeof maplibregl.TerrainControl === "function") {
        map3d.addControl(
          new maplibregl.TerrainControl({
            source: "terrain-dem",
            exaggeration: MAP3D_TERRAIN_EXAGGERATION,
          }),
          "top-right"
        );
      }
      setupMap3dOrbitControls(map3d);
      map3d.on("load", () => {
        map3dReady = true;
        ensureMap3dLayers();
        ensureSeriesPos3dLayers();
        ensureMap3dTerrain();
        ensureMap3dBuildings();
        bindMap3dTerrainRebuild();
        setupMap3dInteractions(map3d);
        syncMap3dOverlays();
        if (map3dPendingTrack) {
          const pending = map3dPendingTrack;
          map3dPendingTrack = null;
          applyTrack3dView(pending, true);
        }
      });
      return map3d;
    }

    const MAP3D_ORBIT_HINT = "左键拖：平移 · 右键拖：方位与俯仰 · 滚轮放大可见立体建筑";

    function finiteSeriesMax(arr) {
      let m = null;
      for (const v of arr || []) {
        if (v == null || !Number.isFinite(Number(v))) continue;
        const n = Number(v);
        m = m == null ? n : Math.max(m, n);
      }
      return m;
    }

    function finiteSeriesLast(arr) {
      if (!arr?.length) return null;
      for (let i = arr.length - 1; i >= 0; i--) {
        const v = arr[i];
        if (v != null && Number.isFinite(Number(v))) return Number(v);
      }
      return null;
    }

    /** 与时序曲线同源：优先用 series 汇总，否则回退轨迹级字段。 */
    function seriesSummaryStats(track) {
      const s = track?.series;
      const out = {
        duration_min: track?.duration_min ?? null,
        distance_km: track?.distance_m != null ? track.distance_m / 1000 : null,
        max_height_m: track?.max_height_m ?? null,
        max_speed_kmh: track?.max_speed_kmh ?? null,
        fromSeries: false,
      };
      if (!s?.t_min?.length) return out;
      const tLast = finiteSeriesLast(s.t_min);
      if (tLast != null) out.duration_min = Math.round(tLast * 10) / 10;
      const dLast = finiteSeriesLast(s.distance_km);
      if (dLast != null) out.distance_km = dLast;
      const hMax = finiteSeriesMax(s.height_m);
      if (hMax != null) out.max_height_m = Math.round(hMax * 10) / 10;
      const vMax = finiteSeriesMax(s.speed_kmh);
      if (vMax != null) out.max_speed_kmh = Math.round(vMax * 10) / 10;
      out.fromSeries = true;
      return out;
    }

    function trackInfoRows(t) {
      const st = seriesSummaryStats(t);
      const rows = [["ID", `#${t.id}`]];
      if (t.factory) rows.push(["厂商", t.factory]);
      if (st.duration_min != null) rows.push(["时长", `${st.duration_min} min`]);
      if (st.distance_km != null) rows.push(["距离", `${Number(st.distance_km).toFixed(1)} km`]);
      if (st.max_height_m != null) rows.push(["最大高度", `${st.max_height_m} m`]);
      if (st.max_speed_kmh != null) rows.push(["最大速度", `${st.max_speed_kmh} km/h`]);
      if (t.start_time) {
        rows.push(["起飞", String(t.start_time).replace("T", " ").slice(0, 16)]);
      }
      return rows;
    }

    /* ========================================================================
     * 右上角详情卡
     * ======================================================================== */

    function showMap3dTrackInfo(track, usedDefault120) {
      if (compareActive) {
        showCompareTrackInfo(usedDefault120);
        return;
      }
      const panel = document.getElementById("map3d-track-info");
      const title = document.getElementById("map3d-track-info-title");
      const body = document.getElementById("map3d-track-info-body");
      const hint = document.getElementById("map3d-track-info-hint");
      if (!panel || !track) return;
      panel.classList.remove("compare-mode");
      const color = factoryColor(track);
      if (title) {
        title.textContent = track.task_name
          ? `#${track.id} · ${track.task_name}`
          : `飞行 #${track.id}`;
        title.style.borderLeft = `3px solid ${color}`;
      }
      if (body) {
        body.innerHTML = trackInfoRows(track)
          .map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`)
          .join("");
      }
      if (hint) {
        if (usedDefault120) {
          hint.hidden = false;
          hint.textContent = "高度全为 0，3D 以 120 m 示意";
        } else {
          hint.hidden = true;
          hint.textContent = "";
        }
      }
      panel.hidden = false;
      const legacy = document.getElementById("map3d-hint");
      if (legacy) {
        legacy.hidden = true;
        legacy.textContent = "";
      }
    }

    function showCompareTrackInfo(usedDefault120) {
      const panel = document.getElementById("map3d-track-info");
      const title = document.getElementById("map3d-track-info-title");
      const body = document.getElementById("map3d-track-info-body");
      const hint = document.getElementById("map3d-track-info-hint");
      const tracks = getCompareTracks();
      if (!panel || !tracks.length) return;
      panel.classList.add("compare-mode");
      if (title) {
        title.textContent = `对比 ${tracks.length} 条`;
        title.style.borderLeft = "";
      }
      if (body) {
        const rows = tracks.map((t) => {
          const st = seriesSummaryStats(t);
          const color = compareTrackColor(t.id);
          const focus = "";
          const dur = st.duration_min != null ? st.duration_min : "—";
          const dist = st.distance_km != null ? Number(st.distance_km).toFixed(1) : "—";
          const h = st.max_height_m != null ? st.max_height_m : "—";
          const v = st.max_speed_kmh != null ? st.max_speed_kmh : "—";
          return `<tr class="${focus.trim()}" data-id="${t.id}" style="--compare-swatch:${color}">
            <td><span class="compare-summary-swatch" style="background:${color}"></span>#${t.id}</td>
            <td>${t.factory || "—"}</td>
            <td>${dur}</td>
            <td>${dist}</td>
            <td>${h}</td>
            <td>${v}</td>
          </tr>`;
        }).join("");
        body.innerHTML = `<table class="compare-summary-table">
          <thead><tr><th>ID</th><th>厂商</th><th>时长</th><th>距离</th><th>最大高度</th><th>最大速度</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>`;
        body.querySelectorAll("tr[data-id]").forEach((tr) => {
          tr.addEventListener("click", (e) => {
            e.stopPropagation();
            const id = Number(tr.dataset.id);
            if (Number.isFinite(id)) focusTrack(id, { fromCompareTable: true });
          });
        });
      }
      if (hint) {
        const anyDefault = tracks.some((t) => displayHeightsFor3d(t.series).usedDefault120);
        if (anyDefault) {
          hint.hidden = false;
          hint.textContent = "双轨摘要并列 · 点位信息同步";
        } else {
          hint.hidden = false;
          hint.textContent = "双轨摘要并列 · 点位信息同步";
        }
      }
      panel.hidden = false;
      const legacy = document.getElementById("map3d-hint");
      if (legacy) {
        legacy.hidden = true;
        legacy.textContent = "";
      }
    }

    function hideMap3dTrackInfo() {
      const panel = document.getElementById("map3d-track-info");
      if (panel) {
        panel.hidden = true;
        panel.classList.remove("compare-mode");
      }
      const body = document.getElementById("map3d-track-info-body");
      if (body) body.innerHTML = "";
      const hint = document.getElementById("map3d-track-info-hint");
      if (hint) {
        hint.hidden = true;
        hint.textContent = "";
      }
    }

    function setMap3dHint(usedDefault120) {
      // 兼容旧调用：把提示写入详情卡底部
      if (in3dMode && map3dTrackId != null && MAP_DATA) {
        const t = MAP_DATA.tracks.find((x) => x.id === map3dTrackId);
        if (t) {
          showMap3dTrackInfo(t, usedDefault120);
          return;
        }
      }
      const hint = document.getElementById("map3d-hint");
      if (!hint) return;
      hint.hidden = false;
      if (usedDefault120) {
        hint.textContent =
          "本轨遥测高度均为 0，3D 视图以 120 m 示意抬升；时序曲线与弹窗仍为真实值 0。 " +
          MAP3D_ORBIT_HINT;
      } else {
        hint.textContent = MAP3D_ORBIT_HINT;
      }
    }

    function updateMap3dGeometry(track) {
      if (!map3d || !map3dReady) return null;
      ensureMap3dLayers();
      if (compareActive) {
        const tracks = getCompareTracks();
        const items = [];
        let anyDefault = false;
        let primaryBuilt = null;
        for (const t of tracks) {
          const built = buildSelectedTrack3dLine(t);
          if (!built) continue;
          if (built.usedDefault120) anyDefault = true;
          items.push({ points: built.points, colorHex: darkenHex(compareTrackColor(t.id), 0.55) });
          if (t.id === selectedTrackId) primaryBuilt = built;
        }
        if (!items.length) {
          selectedTrack3dLineLayer?.clearTrack?.();
          setMap3dHint(false);
          syncMap3dOverlays();
          return null;
        }
        selectedTrack3dLineLayer?.setTracks?.(items);
        if (selectedTrack3dLineLayer) selectedTrack3dLineLayer.visible = true;
        setMap3dHint(anyDefault);
        syncMap3dOverlays();
        return primaryBuilt || {
          points: items[0].points,
          color: items[0].colorHex,
          usedDefault120: anyDefault,
          path: items[0].points.map((p) => [p.lon, p.lat]),
        };
      }
      const built = buildSelectedTrack3dLine(track);
      if (!built) {
        selectedTrack3dLineLayer?.clearTrack?.();
        setMap3dHint(false);
        syncMap3dOverlays();
        return null;
      }
      selectedTrack3dLineLayer?.setTrack?.(built.points, built.color);
      if (selectedTrack3dLineLayer) selectedTrack3dLineLayer.visible = true;
      setMap3dHint(built.usedDefault120);
      syncMap3dOverlays();
      return built;
    }

    function applyTrack3dView(track, animateCamera) {
      if (!map3d) return;
      if (compareActive) {
        map3dTrackId = selectedTrackId;
        map3d.resize();
        const built = updateMap3dGeometry(track);
        const bounds = new maplibregl.LngLatBounds();
        let has = false;
        for (const t of getCompareTracks()) {
          const b = buildSelectedTrack3dLine(t);
          if (!b?.path?.length) continue;
          b.path.forEach((c) => { bounds.extend(c); has = true; });
        }
        if (!has && built?.path?.length) {
